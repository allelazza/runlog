// CSV per Excel italiano: separatore ;, virgola decimale, date gg/mm/aaaa, BOM per gli accenti
function esportaCSV(nome){
  const T=tabella(nome), cella=(x,f)=>{
    if(x==null) return '';
    if(f==='d'&&/^\d{4}-\d{2}-\d{2}$/.test(x)) return x.slice(8)+'/'+x.slice(5,7)+'/'+x.slice(0,4);
    if(typeof x==='number') return String(x).replace('.',',');
    const s=String(x).replace(/^([=+\-@])/,"'$1");
    return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  };
  const righe=[T.col.join(';')].concat(T.righe.map(r=>r.map((x,i)=>cella(x,T.fmt[i])).join(';')));
  scarica(`runlog-${nome.toLowerCase()}-${oggiStr()}.csv`,'﻿'+righe.join('\r\n'),'text/csv');
}
// Calendario: sedute non fatte da oggi in poi. UID = ID della seduta, così un nuovo import aggiorna gli eventi.
function calendarioICS(){
  const ora=(S.set.oraUscita||'06:30').split(':'), z=s=>s.replace(/-/g,''), adesso=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const testo=s=>String(s||'').replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const piega=r=>{let o='';while(r.length>70){o+=r.slice(0,70)+'\r\n ';r=r.slice(70);}return o+r;};
  const ev=[];
  for(const e of Object.values(dateMap()).flat()){
    if(e.date<oggiStr()||e.done||e.skip||e.s.type==='rest') continue;
    const s=e.s, corsa=CORSA.includes(s.type);
    let r=['BEGIN:VEVENT','UID:'+e.key+'@runlog','DTSTAMP:'+adesso,'SUMMARY:'+testo(s.label+(s.km?' · '+s.km+' km':'')),'DESCRIPTION:'+testo(s.desc+(s.note?'\n'+s.note:''))];
    if(corsa){
      const min=Math.max(30,Math.round((s.km||6)*(passoSec(s.pace)||330)/60)+15), inizio=new Date(+e.date.slice(0,4),+e.date.slice(5,7)-1,+e.date.slice(8),+ora[0],+ora[1]), fine=new Date(inizio.getTime()+min*60000);
      const loc=d=>fmtD(d).replace(/-/g,'')+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
      r.push('DTSTART:'+loc(inizio),'DTEND:'+loc(fine),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+testo(s.label),'TRIGGER:-PT30M','END:VALARM');
    }else r.push('DTSTART;VALUE=DATE:'+z(e.date),'DTEND;VALUE=DATE:'+z(piuGiorni(e.date,1)),'TRANSP:TRANSPARENT');
    r.push('END:VEVENT');
    ev.push(r.map(piega).join('\r\n'));
  }
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//RunLog//IT','CALSCALE:GREGORIAN','X-WR-CALNAME:RunLog'].join('\r\n')+'\r\n'+ev.join('\r\n')+'\r\nEND:VCALENDAR\r\n';
}
// Report Markdown: contesto, settimane, allenamenti, fastidi. Niente nome, email o URL.
function reportAI(n){
  const oggi=oggiStr(), da=piuGiorni(lunediDi(oggi),-7*(n-1)), logs=S.logs.filter(l=>l.data>=da&&l.data<=oggi).sort((a,b)=>a.data<b.data?-1:1);
  const c=S.cfg||{}, wk=settDi(oggi), gare=S.gare.filter(g=>g.data&&g.data>=oggi).sort((a,b)=>a.data<b.data?-1:1);
  const nn=x=>x==null||x===''?'–':String(x).replace('.',',');
  let t=`# Diario di corsa: ultime ${n} settimane (${dataIt(da,{day:'numeric',month:'short'})} – ${dataIt(oggi,{day:'numeric',month:'short',year:'numeric'})})\n\n`;
  t+=`## Contesto\n- PB 10 km: ${c.pb||'–'}\n- Tre corse a settimana${c.foot>=0?`, calcio a 7 il ${GG[c.foot].toLowerCase()} (conta come seduta intensa)`:''}\n`;
  if(gare.length) t+=gare.map(g=>`- Gara: ${g.nome}, ${dataIt(g.data,{day:'numeric',month:'long',year:'numeric'})}${g.distKm?', '+nn(g.distKm)+' km':''}${g.objSec?', obiettivo '+hms(g.objSec):''} (${g.tipo||'Obiettivo'})`).join('\n')+'\n';
  if(wk) t+=`- Piano: settimana ${wk.w} di ${S.plan.length} — ${wk.title}\n`;
  t+=`- Scale: sforzo percepito 1–10; fastidi 0–10 (– = non compilato); carico = sforzo × minuti\n\n`;
  t+=`## Settimane\n| Settimana | Km fatti / previsti | Corse | Lungo | Tempo | Carico | Sforzo medio | Passo facile | Fastidio al risveglio |\n|---|---|---|---|---|---|---|---|---|\n`;
  for(let l=da;l<=oggi;l=piuGiorni(l,7)){
    const st=statSett(l), corse=S.logs.filter(x=>eCorsa(x)&&lunediDi(x.data)===l);
    t+=`| ${dataIt(l,{day:'numeric',month:'short'})} | ${nn(Math.round(st.km*10)/10)} / ${st.nP?Math.round(st.kmP):'–'} | ${st.n}${st.nP?' / '+st.nP:''}${st.calcio?' + calcio':''} | ${corse.length?nn(Math.max(...corse.map(x=>+x.km))):'–'} | ${st.sec?hms(st.sec):'–'} | ${Math.round(st.carico)||'–'} | ${st.rpe!=null?nn(Math.round(st.rpe*10)/10):'–'} | ${st.passoFac?secPasso(st.passoFac):'–'} | ${st.mattino!=null?nn(Math.round(st.mattino*10)/10):'–'} |\n`;
  }
  t+=`\n## Allenamenti\n| Data | Tipo | Km | Tempo | Passo | Sforzo | FC | Fastidi (achille/caviglia/schiena) | Previsto |${S.set.reportNote?' Note |':''}\n|---|---|---|---|---|---|---|---|---|${S.set.reportNote?'---|':''}\n`;
  for(const l of logs){
    const e=l.sk?sedutaDi(l.sk):null;
    t+=`| ${l.data} | ${l.tipo} | ${l.km?nn(l.km):'–'} | ${l.sec?hms(l.sec):'–'} | ${l.ritmo||'–'} | ${l.rpe||'–'} | ${l.fc||'–'} | ${fastidioMax(l)!=null?`${nn(l.dolore_achille)}/${nn(l.dolore_caviglia)}/${nn(l.dolore_schiena)}`:'–'} | ${e?e.s.label+(e.s.km?' '+e.s.km+' km':''):'fuori piano'} |${S.set.reportNote?' '+String(l.note||'').replace(/[|\n]/g,' ')+' |':''}\n`;
    if(l.splits&&l.splits.length>1) t+=`|  | intertempi | ${l.splits.map(x=>secPasso(x.t/(x.d/1000))).join(' · ')} |  |  |  |  |  |  |${S.set.reportNote?'  |':''}\n`;
  }
  const mk=Object.keys(S.morning).filter(d=>d>=da).sort(), tk=Object.keys(S.tests).filter(d=>d>=da).sort();
  if(mk.length) t+=`\n## Fastidio al risveglio\n${mk.map(d=>`${d}: ${S.morning[d].v}${S.morning[d].z?' ('+S.morning[d].z+')':''}`).join(' · ')}\n`;
  if(tk.length) t+=`\n## Test settimanale a fine estensione\n${tk.map(d=>`${d}: ${S.tests[d]}`).join(' · ')}\n`;
  const ri=S.revs.filter(r=>r.data>=da);
  if(ri.length) t+=`\n## Revisioni del piano\n${ri.map(r=>`- ${r.data}: ${r.esito}. ${r.motivo}`).join('\n')}\n`;
  if(S.plan){
    const pros=S.plan.filter(w=>w.lun>lunediDi(oggi)).slice(0,4);
    if(pros.length) t+=`\n## Prossime settimane in piano\n${pros.map(w=>`- ${dataIt(w.lun,{day:'numeric',month:'short'})} — ${w.title}: ${w.sessions.filter(s=>s.type!=='rest').map(s=>`${ggDi(S.over[s.id]||s.date).slice(0,3)} ${s.label}${s.km?' '+s.km+' km':''}`).join(', ')}`).join('\n')}\n`;
  }
  return t+`\n_Esportato da RunLog ${VER}. I dati sono inseriti a mano o importati dall'orologio; non sono dati clinici._\n`;
}

// Tutte le chiavi "rl_" tranne copie di sicurezza, chiave del foglio e coda (che valgono solo su questo telefono)
function backupJSON(){
  const k={}, fuori=n=>n.startsWith('rl_bak')||['rl_pre_v10','rl_token','rl_pend','rl_sync'].includes(n);
  try{for(let i=0;i<localStorage.length;i++){const n=localStorage.key(i);if(n&&n.startsWith('rl_')&&!fuori(n)) k[n]=localStorage.getItem(n);}}catch(e){}
  return JSON.stringify({app:'RunLog',version:VER,schema:SCHEMA,exportDate:new Date().toISOString(),keys:k});
}

// Accetta i backup della v10/v11 (chiavi "rl_") e della v9 (campi sciolti). Prima di sostituire salva una
// copia dei dati attuali (rl_bak_prerip). Collegamento al foglio e copie di sicurezza di questo telefono restano.
function applicaBackup(d,origine,daCloud){
  const kv=d&&d.keys&&typeof d.keys==='object', v9=d&&Array.isArray(d.logs);
  if(!kv&&!v9){toast('Non sembra un backup di RunLog','err');return;}
  let n=0;try{n=kv?JSON.parse(d.keys.rl_logs||'[]').length:d.logs.length;}catch(e){}
  if(!confirm(`Ripristinare il backup ${origine}${d.exportDate?' del '+d.exportDate.slice(0,10):''} con ${n} allenamenti? Sostituisce i dati su questo telefono; una copia di quelli attuali resta in Altro → Esporta.`)) return;
  if(S.logs.length||S.plan) LS.s('rl_bak_prerip',backupJSON());
  const resta=k=>k.startsWith('rl_bak')||['rl_sheet','rl_token','rl_theme'].includes(k);
  const url=S.sheetUrl;
  Object.keys(localStorage).filter(k=>k.startsWith('rl_')&&!resta(k)).forEach(k=>localStorage.removeItem(k));
  if(kv){for(const k in d.keys) if(!resta(k)||(k==='rl_sheet'&&!url)) localStorage.setItem(k,d.keys[k]);}
  else{
    LS.s('rl_logs',d.logs);LS.s('rl_morning',d.morning||{});LS.s('rl_rehab',d.rehab||{});
    if(d.sheetUrl&&!url) LS.s('rl_sheet',d.sheetUrl);
  }
  // si rilegge sul posto, senza ricaricare: con i file locali una ricarica subito dopo tante scritture
  // può mostrare per un attimo un archivio vuoto
  caricaStato();const m=migra();tema();
  if(S.sheetUrl&&S.token&&!daCloud&&!S.pend.includes('all')){S.pend.push('all');salva();}
  appunto();chiudiSheet(1);chiudiSheet(2);
  if(!S.cfg||!S.plan){disegna();primoAvvio(m.daV9);}
  else{$('primo').style.display='none';vai('oggi');}
  toast(`Backup ripristinato: ${S.logs.length} allenamenti`);
  if(!daCloud) sincronizza();
}
// Carica un piano da file JSON: elenco di settimane con sessions. Il piano attuale va tra le versioni.
function importaPiano(inp){
  const file=inp.files&&inp.files[0];if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{
    let p;try{p=JSON.parse(rd.result);}catch(e){toast('File non valido: non è JSON','err');return;}
    if(!Array.isArray(p)||!p.length||!p.every(w=>Array.isArray(w.sessions))){toast('Formato non valido: serve un elenco di settimane con sessions','err');return;}
    const lun0=p[0].lun&&/^\d{4}-\d{2}-\d{2}$/.test(p[0].lun)?lunediDi(p[0].lun):(S.plan?S.plan[0].lun:lunediDi(oggiStr()));
    if(!confirm(`Importare il piano di ${p.length} settimane dal ${dataIt(lun0,{day:'numeric',month:'long'})}? Il piano attuale resta tra le versioni precedenti.`)) return;
    p.forEach((w,i)=>{w.phase=w.phase||'base';w.title=w.title||('Settimana '+(i+1));w.ruolo=w.ruolo||'';w.sessions.forEach(s=>{s.d=+s.d||0;s.type=s.type||'easy';s.label=s.label||TIPI[s.type]||'Seduta';s.desc=s.desc||'';});});
    // ID e date: si tengono quelli del file se ci sono tutti (piano scaricato da RunLog), altrimenti si assegnano
    const conId=p.every(w=>w.lun&&w.sessions.every(s=>s.id&&s.date));
    const nuovo=conId?p.map((w,i)=>({...w,w:i+1})):timbra(p,lun0,0);
    if(S.plan) S.plans.unshift({ts:Date.now(),origine:'Prima dell\'import da file',motivo:'Sostituito da un piano caricato da file',cfg:S.cfg,plan:S.plan});
    S.plans=S.plans.slice(0,10);
    S.plan=nuovo;S.cfg=S.cfg||{...cfgDefault(),start:lun0};
    attivaStato();accoda('p');salva();$('primo').style.display='none';disegna();toast(`Piano importato: ${nuovo.length} settimane`);sincronizza();
  };
  rd.readAsText(file);inp.value='';
}

/* ═══════════════ 8b. FOGLIO GOOGLE: tabelle, invio, chiave, backup privato ═══════════════
   Come funziona
   • L'app è l'unica fonte dei dati: il foglio è una copia leggibile, aggiornata a ogni modifica.
     Le modifiche fatte a mano nel foglio non tornano nell'app (le corse non si possono sovrascrivere dal foglio).
   • La struttura delle colonne la decide l'app (tabella()): lo script è un "scrittore" generico,
     quindi quando l'app cambia colonne non serve aggiornare lo script.
   • Ogni richiesta porta una chiave segreta (S.token). La chiave nasce nello script all'abbinamento
     ed è salvata nelle proprietà dello script e in questo telefono: non è nel codice pubblico né nel backup.
   • Il backup completo va in un file Google separato e privato, creato da installa(): il foglio dei dati
     si può condividere con il coach senza condividere il backup.
   • Coda: ogni modifica aggiunge un'operazione in S.pend ('r:<id>' corsa nuova o modificata, 'd:<id>' corsa
     eliminata, 'p' piano cambiato, 'all' riscrivi tutto). Senza rete la coda resta e si riprova
     all'apertura, al ritorno della rete e quando l'app torna in primo piano. */

// Funzioni da eseguire a mano: installa (prima volta, o per collegare un altro telefono entro 30 minuti),
// nuovaChiave (scollega tutti i dispositivi, ad esempio se perdi il telefono).

var VERSIONE=11, FINESTRA=30*60*1000;
var FOGLI=["Corse","Intertempi","Settimane","Piano","Fastidi","Gare","Info"];
var FORMATI={d:"dd/mm/yyyy","@":"@",n1:"0.0",n2:"0.00",i:"0"};

function out(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);}
function prop(){return PropertiesService.getScriptProperties();}

// Risposta senza dati: serve all'app per sapere che lo script c'è e di che versione è
function doGet(e){return out({status:"ok",msg:"RunLog endpoint attivo",v:VERSIONE});}

function doPost(e){
  var lock=LockService.getScriptLock();
  try{
    var d=JSON.parse(e.postData.contents), P=prop(), chiave=P.getProperty("CHIAVE")||"";
    lock.waitLock(25000);
    // Abbinamento: con la chiave giusta la conferma; senza, la consegna solo entro 30 minuti da installa()
    if(d.action==="pair"){
      if(chiave&&d.key===chiave) return out({status:"ok",key:chiave});
      if(Date.now()-Number(P.getProperty("APERTO")||0)>FINESTRA) return out({status:chiave?"chiave":"chiuso"});
      if(!chiave){chiave=Utilities.getUuid().replace(/-/g,"");P.setProperty("CHIAVE",chiave);}
      return out({status:"ok",key:chiave});
    }
    if(!chiave||d.key!==chiave) return out({status:"auth",msg:"Chiave non valida: ricollega l'app (Altro → Foglio Google → Collega)"});
    if(d.action==="push"){
      var ss=SpreadsheetApp.getActiveSpreadsheet(), n=0;
      for(var i=0;i<d.fogli.length;i++) n+=scrivi(ss,d.fogli[i]);
      return out({status:"ok",righe:n});
    }
    if(d.action==="backup"||d.action==="restore"){
      var id=P.getProperty("BACKUP_ID");
      if(!id) return out({status:"err",msg:"Manca il file di backup privato: esegui la funzione installa nello script"});
      var bk=SpreadsheetApp.openById(id);
      if(d.action==="backup"){
        var nome="Backup "+Utilities.formatDate(new Date(),Session.getScriptTimeZone(),"yyyy-MM-dd HH:mm:ss");
        var sh=bk.insertSheet(nome,0), righe=[];
        for(var j=0;j<d.data.length;j+=40000) righe.push(["~"+d.data.substring(j,j+40000)]);
        sh.getRange(1,1,righe.length,1).setNumberFormat("@").setValues(righe);
        // tiene gli ultimi 10 backup
        var vecchi=bk.getSheets().filter(function(s){return s.getName().indexOf("Backup ")===0;}).sort(function(a,b){return a.getName()<b.getName()?1:-1;});
        for(var k=10;k<vecchi.length;k++) bk.deleteSheet(vecchi[k]);
        return out({status:"ok",parti:righe.length,nome:nome});
      }
      var ultimi=bk.getSheets().filter(function(s){return s.getName().indexOf("Backup ")===0;}).sort(function(a,b){return a.getName()<b.getName()?1:-1;});
      if(!ultimi.length||ultimi[0].getLastRow()<1) return out({status:"empty"});
      var testo=ultimi[0].getRange(1,1,ultimi[0].getLastRow(),1).getValues().map(function(r){return String(r[0]).substring(1);}).join("");
      return out({status:"ok",nome:ultimi[0].getName(),backup:testo});
    }
    return out({status:"err",msg:"Azione sconosciuta: aggiorna lo script"});
  }catch(err){return out({status:"err",msg:String(err)});}
  finally{try{lock.releaseLock();}catch(x){}}
}

// Scrive un foglio inviato dall'app. f = {nome, col, fmt, modo, righe, via, ordina}
//   modo "chiave": la prima colonna è l'ID; stesso ID = riga aggiornata, ID nuovo = riga aggiunta, "via" = righe tolte
//   modo "gruppo": toglie le righe la cui prima colonna è in "via" e aggiunge "righe" (es. intertempi di una corsa)
//   modo "tutto":  sostituisce tutto il contenuto
// Se le intestazioni sono cambiate (foglio di una versione precedente) le colonne vengono riallineate per nome.
function scrivi(ss,f){
  var sh=ss.getSheetByName(f.nome);
  if(!sh){sh=ss.insertSheet(f.nome);sh.protect().setDescription("Scritto da RunLog").setWarningOnly(true);}
  var dati=[], ur=sh.getLastRow(), uc=sh.getLastColumn();
  if(f.modo!=="tutto"&&ur>1&&uc>0){
    var vecchi=sh.getRange(1,1,ur,uc).getValues(), intest=vecchi.shift().map(String);
    var pos=f.col.map(function(c){return intest.indexOf(c);});
    dati=vecchi.map(function(r){return pos.map(function(p){return p>=0?r[p]:"";});});
  }
  var nuove=f.righe.map(function(r){
    return r.map(function(v,i){
      if(v===null||v===undefined) return "";
      if(f.fmt[i]==="d"&&/^\\d{4}-\\d{2}-\\d{2}$/.test(v)){var p=v.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
      if(typeof v==="string"&&/^[=+\\-@]/.test(v)&&f.fmt[i]!=="@") return "'"+v;    // niente formule dai testi
      return v;
    });
  });
  var via={};(f.via||[]).forEach(function(k){via[String(k)]=1;});
  if(f.modo==="chiave"){
    var idx={};dati.forEach(function(r,i){idx[String(r[0])]=i;});
    nuove.forEach(function(r){var k=String(r[0]);if(k in idx) dati[idx[k]]=r;else{idx[k]=dati.length;dati.push(r);}});
    dati=dati.filter(function(r){return !via[String(r[0])];});
  }else if(f.modo==="gruppo") dati=dati.filter(function(r){return !via[String(r[0])];}).concat(nuove);
  else dati=nuove;
  if(f.ordina!=null){                                                   // più recenti in alto, a parità resta l'ordine
    var c=f.ordina, t=function(x){return x instanceof Date?x.getTime():String(x);};
    dati=dati.map(function(r,i){return [r,i];}).sort(function(a,b){var x=t(a[0][c]),y=t(b[0][c]);return x<y?1:x>y?-1:a[1]-b[1];}).map(function(p){return p[0];});
  }
  sh.clearContents();
  var nc=f.col.length;
  sh.getRange(1,1,1,nc).setValues([f.col]).setFontWeight("bold");
  sh.setFrozenRows(1);
  if(dati.length){
    for(var i=0;i<nc;i++) if(FORMATI[f.fmt[i]]) sh.getRange(2,i+1,dati.length,1).setNumberFormat(FORMATI[f.fmt[i]]);
    sh.getRange(2,1,dati.length,nc).setValues(dati);
  }
  return dati.length;
}

// Da eseguire a mano: crea il file di backup privato, sposta il vecchio backup della v10,
// protegge i fogli con un avviso e apre per 30 minuti l'abbinamento dell'app.
function installa(){
  var ss=SpreadsheetApp.getActiveSpreadsheet(), P=prop(), bk=null, id=P.getProperty("BACKUP_ID");
  if(id){try{bk=SpreadsheetApp.openById(id);}catch(e){bk=null;}}
  if(!bk){
    bk=SpreadsheetApp.create("RunLog backup (privato, non condividere)");
    bk.getSheets()[0].setName("Leggimi").getRange(1,1).setValue("Backup completi dell'app RunLog, scritti dallo script del foglio RunLog. Non condividere questo file.");
    P.setProperty("BACKUP_ID",bk.getId());
  }
  var v10=ss.getSheetByName("Backup");
  if(v10){
    if(v10.getLastRow()>1){
      var v=v10.getRange(2,1,v10.getLastRow()-1,1).getValues();
      bk.insertSheet("Backup 0000 dalla v10").getRange(1,1,v.length,1).setNumberFormat("@").setValues(v);
    }
    if(ss.getSheets().length===1) ss.insertSheet("Info");
    ss.deleteSheet(v10);
  }
  ss.getSheets().forEach(function(sh){
    if(FOGLI.indexOf(sh.getName())>=0&&!sh.getProtections(SpreadsheetApp.ProtectionType.SHEET).length) sh.protect().setDescription("Scritto da RunLog").setWarningOnly(true);
  });
  P.setProperty("APERTO",String(Date.now()));
  Logger.log("Fatto. Backup privato: "+bk.getUrl());
  Logger.log("Ora pubblica la nuova versione del deployment e, entro 30 minuti, nell'app: Altro → Foglio Google → Collega.");
}

/* ── Tabelle: le stesse righe vanno nel foglio e negli export CSV ──
   Formati: 'd' data (aaaa-mm-gg), '@' testo, 'n1'/'n2' decimali, 'i' intero, '' automatico. */
function tabella(nome,soloId){
  const ora=new Date().toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const ordinati=[...S.logs].sort((a,b)=>a.data<b.data?1:a.data>b.data?-1:(b.ts||0)-(a.ts||0));
  const logs=soloId?ordinati.filter(l=>soloId.includes(l.id)):ordinati;
  const v=x=>x===''||x==null?null:x;
  switch(nome){
    case 'Corse': return {nome,ordina:1,col:['ID','Data','Ora','Tipo','Km','Tempo','Passo','Sforzo','Carico','FC media','FC max','Disl. +','Achille','Caviglia','Schiena','Scarpe','Seduta in piano','Note','Fonte','Aggiornato'],
      fmt:['@','d','@','','n2','@','@','i','i','i','i','i','i','i','i','','','','',''],
      righe:logs.map(l=>{
        const sc=S.shoes.find(x=>x.id===l.scarpa), e=l.sk?sedutaDi(l.sk):null;
        return [l.id,l.data,l.ora||'',l.tipo,v(+l.km||null),l.sec?hms(l.sec):'',l.ritmo||'',v(+l.rpe||null),l.rpe&&l.sec?Math.round(l.rpe*l.sec/60):null,v(+l.fc||null),v(+l.fcMax||null),v(+l.disl||null),
          l.dolore_achille,l.dolore_caviglia,l.dolore_schiena,sc?sc.nome:'',e?e.s.label+(e.s.km?' '+e.s.km+' km':''):'',l.note||'',l.fonte||'manuale',ora];
      })};
    case 'Intertempi': return {nome,ordina:1,col:['ID corsa','Data','Tratto','Tipo','Distanza (m)','Tempo','Passo','Disl. +','Disl. −','FC'],fmt:['@','d','i','','i','@','@','i','i','i'],
      righe:logs.flatMap(l=>[['km',l.splits||[]],['giro',l.laps||[]]].flatMap(([tipo,sp])=>sp.map((x,i)=>[l.id,l.data,i+1,tipo,x.d,hms(x.t),x.d>0?secPasso(x.t/(x.d/1000)):'',v(x.up),v(x.dn),v(x.hr)])))};
    case 'Piano': return {nome,col:['ID','Settimana','Fase','Data','Giorno','Tipo','Seduta','Km','Passo','Descrizione','Note','Stato'],fmt:['@','i','','d','','','','n1','@','','',''],
      righe:(S.plan||[]).flatMap(wk=>wk.sessions.map(s=>{
        const d=S.over[s.id]||s.date;
        return [s.id,wk.w,wk.title,d,ggDi(d),TIPI[s.type]||s.type,s.label,v(s.km||null),s.range?s.range.join('–'):s.pace||'',s.desc||'',s.note||'',
          S.done[s.id]?'fatta':S.skip[s.id]?'saltata':S.over[s.id]&&S.over[s.id]!==s.date?'spostata dal '+dataIt(s.date,{day:'numeric',month:'numeric'}):'da fare'];
      })).sort((a,b)=>a[3]<b[3]?-1:a[3]>b[3]?1:0)};
    case 'Settimane':{
      // tutte le settimane del piano più quelle fuori piano con allenamenti, fino a questa
      const lun=new Set((S.plan||[]).map(w=>w.lun)), oggiL=lunediDi(oggiStr());
      S.logs.forEach(l=>{if(l.data<=oggiStr()) lun.add(lunediDi(l.data));});
      return {nome,ordina:0,col:['Settimana dal','Sett. piano','Fase','Km previsti','Km fatti','Corse previste','Corse fatte','Lungo previsto','Lungo fatto','Tempo','Carico','Sforzo medio','Passo facile','Fastidio al risveglio','Calcio'],
        fmt:['d','i','','i','n1','i','i','n1','n1','@','i','n1','@','n1','i'],
        righe:[...lun].sort().map(l=>{
          const wk=settDi(l), st=statSett(l), fut=l>oggiL, corse=S.logs.filter(x=>eCorsa(x)&&lunediDi(x.data)===l);
          const lp=wk?Math.max(0,...wk.sessions.filter(s=>CORSA.includes(s.type)).map(s=>s.km||0)):0;
          return [l,wk?wk.w:null,wk?wk.title:'fuori piano',st.nP?Math.round(st.kmP):null,fut?null:Math.round(st.km*10)/10,st.nP||null,fut?null:st.n,v(lp||null),fut||!corse.length?null:Math.max(...corse.map(x=>+x.km)),
            fut||!st.sec?'':hms(st.sec),fut?null:Math.round(st.carico)||null,st.rpe!=null?Math.round(st.rpe*10)/10:null,st.passoFac?secPasso(st.passoFac):'',st.mattino!=null?Math.round(st.mattino*10)/10:null,fut?null:st.calcio||null];
        })};
    }
    case 'Fastidi':{
      const giorni=new Set([...Object.keys(S.morning),...Object.keys(S.tests),...Object.keys(S.rehab),...S.logs.filter(l=>fastidioMax(l)!=null).map(l=>l.data)]);
      return {nome,ordina:0,col:['Data','Al risveglio','Zona','Test settimanale','Esercizi fatti','Fastidio massimo in allenamento'],fmt:['d','i','','i','',''],
        righe:[...giorni].sort().map(d=>{
          const m=S.morning[d], fc=S.logs.filter(l=>l.data===d).map(fastidioMax).filter(x=>x!=null);
          return [d,m&&m.v!=null?+m.v:null,m&&m.z||'',S.tests[d]!=null?+S.tests[d]:null,S.rehab[d]?'sì':'',fc.length?Math.max(...fc):null];
        })};
    }
    case 'Gare': return {nome,col:['Nome','Data','Tipo','Distanza (km)','Obiettivo','Passo obiettivo','Risultato','Passo'],fmt:['','d','','n1','@','@','@','@'],
      righe:[...S.gare].sort((a,b)=>(a.data||'9')<(b.data||'9')?-1:1).map(g=>[g.nome,g.data||'',g.tipo||'',v(+g.distKm||null),g.objSec?hms(g.objSec):'',g.objSec&&g.distKm?secPasso(g.objSec/g.distKm):'',g.resSec?hms(g.resSec):'',g.resSec&&g.distKm?secPasso(g.resSec/g.distKm):''])};
    case 'Info':{
      const wk=settDi(oggiStr()), g=S.gare.filter(x=>x.data&&x.data>=oggiStr()).sort((a,b)=>a.data<b.data?-1:1)[0];
      return {nome,col:['Voce','Valore'],fmt:['',''],righe:[
        ['Aggiornato',ora],['App','RunLog '+VER],
        ['Piano',S.plan?`${S.plan.length} settimane dal ${dataIt(S.plan[0].lun,{day:'numeric',month:'long',year:'numeric'})}, PB 10 km ${S.cfg.pb}`:'nessuno'],
        ['Settimana in corso',wk?`${wk.w} — ${wk.title}`:'fuori piano'],
        ['Prossima gara',g?`${g.nome}, ${dataIt(g.data,{day:'numeric',month:'long',year:'numeric'})}`:'—'],
        ['Fogli','Corse: un allenamento per riga · Intertempi: per km e per giro · Settimane: previsto e fatto · Piano: tutte le sedute · Fastidi: risveglio, test, esercizi · Gare'],
        ['Scale','Sforzo 1–10 (percepito) · Fastidi 0–10 · Carico = sforzo × minuti · celle vuote = non compilato'],
        ['Attenzione','Questo file è scritto dall\'app: le modifiche fatte qui non tornano nell\'app e vengono sovrascritte al prossimo aggiornamento.']]};
    }
  }
}

// Fogli da inviare per le operazioni in coda
function fogliDaInviare(ops){
  const tutto=ops.includes('all'), ids=ops.filter(x=>x.startsWith('r:')).map(x=>x.slice(2)).filter(id=>S.logs.some(l=>l.id===id));
  const via=ops.filter(x=>x.startsWith('d:')).map(x=>x.slice(2)), f=[];
  if(tutto) f.push({...tabella('Corse'),modo:'tutto'},{...tabella('Intertempi'),modo:'tutto'});
  else if(ids.length||via.length) f.push({...tabella('Corse',ids),modo:'chiave',via},{...tabella('Intertempi',ids),modo:'gruppo',via:ids.concat(via)});
  if(tutto||ops.includes('p')) f.push({...tabella('Piano'),modo:'tutto'});
  for(const n of ['Settimane','Fastidi','Gare','Info']) f.push({...tabella(n),modo:'tutto'});
  return f;
}

// Richiesta allo script. text/plain = "richiesta semplice": niente controllo CORS preliminare, risposta leggibile.
// cieco=true: se il browser non lascia leggere la risposta si invia comunque senza conferma (solo per i dati).
async function gas(payload,cieco){
  const opt={method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,key:payload.key!=null?payload.key:S.token,ver:VER}),redirect:'follow'};
  let r;
  try{r=await fetch(S.sheetUrl,opt);}
  catch(e){
    if(!navigator.onLine||!cieco) throw e;
    await fetch(S.sheetUrl,{...opt,mode:'no-cors'});
    return {status:'ok',cieco:true};
  }
  const t=await r.text();
  try{return JSON.parse(t);}catch(e){return {status:'err',msg:'Lo script ha risposto in modo inatteso: controlla il deployment (accesso "Chiunque") e che sia la versione 11'};}
}

let _sync=false;
// Invia la coda; poi, se sono passate più di 12 ore dall'ultimo, il backup completo nel file privato
async function sincronizza(manuale){
  if(!S.sheetUrl||_sync){if(manuale&&!S.sheetUrl) toast('Collega prima il Google Sheet','err');return;}
  if(!S.token){if(manuale) toast('Premi "Collega" per abbinare l\'app al foglio','err');return;}
  const dovuto=!S.sync.bk||Date.now()-S.sync.bk>12*3600e3;
  if(!manuale&&!S.pend.length&&!dovuto) return;
  _sync=true;
  const ops=[...S.pend];
  try{
    if(ops.length||manuale){
      const res=await gas({action:'push',fogli:fogliDaInviare(ops)},true);
      if(res.status==='ok'){S.pend=S.pend.filter(x=>!ops.includes(x));S.sync={...S.sync,ok:Date.now(),err:'',cieco:!!res.cieco};}
      else{S.sync={...S.sync,err:res.msg||'Invio non riuscito',errTs:Date.now(),auth:res.status==='auth'};if(manuale) toast(S.sync.err,'err');}
    }
    if(!S.sync.err&&(dovuto||manuale)) await backupCloud(false);
    if(manuale&&!S.sync.err) toast('Foglio aggiornato'+(S.sync.cieco?' (invio senza conferma)':''));
  }catch(e){S.sync={...S.sync,err:'Nessuna connessione: riprovo più tardi',errTs:Date.now()};if(manuale) toast(S.sync.err,'err');}
  LS.s('rl_pend',S.pend);LS.s('rl_sync',S.sync);
  _sync=false;
  if(S.page==='oggi'||S.page==='altro') disegna();
}

// "Collega": controlla la versione dello script, ottiene la chiave e invia tutto
async function collegaSheet(){
  const url=($('gs_url')?$('gs_url').value:S.sheetUrl).trim(), chiave=$('gs_key')?$('gs_key').value.trim():'';
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)){toast('L\'URL deve iniziare con https://script.google.com/macros/s/ e finire con /exec','err');return;}
  if(url!==S.sheetUrl){S.sheetUrl=url;S.token='';}
  salva();
  const b=$('gs_coll');if(b){b.disabled=true;b.textContent='Collegamento…';}
  try{
    const p=await (await fetch(url,{redirect:'follow'})).json();
    if(!(p.v>=11)){S.sync={...S.sync,err:'Lo script del foglio è della versione precedente: aggiornalo',errTs:Date.now(),vecchio:true};salva();disegna();toast('Aggiorna prima lo script del foglio (istruzioni qui sotto)','err');return;}
    const res=await gas({action:'pair',key:chiave||S.token});
    if(res.status==='ok'){
      S.token=res.key;S.sync={...S.sync,err:'',vecchio:false,auth:false};
      if(!S.pend.includes('all')) S.pend.push('all');
      salva();toast('Collegato al foglio');await sincronizza(true);return;
    }
    toast(res.status==='chiave'?'Il foglio è già abbinato: inserisci la chiave dell\'altro telefono, oppure esegui di nuovo "installa" nello script e riprova entro 30 minuti'
      :res.status==='chiuso'?'Esegui la funzione "installa" nello script, poi riprova entro 30 minuti':res.msg||'Lo script ha risposto con un errore','err');
  }catch(e){toast('Non raggiungibile: controlla l\'URL, la connessione e che il deployment abbia accesso "Chiunque"','err');}
  finally{const b2=$('gs_coll');if(b2){b2.disabled=false;b2.textContent='Collega';}}
}
async function backupCloud(manuale){
  if(!S.sheetUrl||!S.token){if(manuale) toast('Collega prima il Google Sheet','err');return;}
  try{
    const res=await gas({action:'backup',data:backupJSON()},true);
    if(res.status==='ok'){S.sync={...S.sync,bk:Date.now()};LS.s('rl_sync',S.sync);if(manuale){toast(res.cieco?'Backup inviato (senza conferma)':'Backup salvato nel file privato');disegna();}}
    else if(manuale) toast(res.msg||'Backup non riuscito','err');
  }catch(e){if(manuale) toast('Nessuna connessione','err');}
}
async function ripristinaCloud(){
  if(!S.sheetUrl||!S.token){toast('Collega prima il Google Sheet','err');return;}
  try{
    const d=await gas({action:'restore'});
    if(d.status==='empty'){toast('Nel file privato non c\'è ancora nessun backup','err');return;}
    if(d.status!=='ok'||!d.backup){toast(d.msg||'Ripristino non riuscito','err');return;}
    applicaBackup(JSON.parse(d.backup),'del '+d.nome.replace('Backup ','').replace(/:\d\d$/,''),true);
  }catch(e){toast('Non riesco a leggere il backup: controlla la connessione','err');}
}

// Sezione "Foglio Google" in Altro
function sheetHTML(){
  const s=S.sync, coll=!!(S.sheetUrl&&S.token&&!s.auth);
  const quando=t=>t?new Date(t).toLocaleString('it-IT',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'mai';
  let stato;
  if(!S.sheetUrl) stato='<div class="stato">Non collegato</div>';
  else if(s.err) stato=`<div class="stato err">⚠ ${esc(s.err)}${S.pend.length?` · ${S.pend.length} modifiche in attesa`:''}</div>`;
  else if(!S.token) stato='<div class="stato err">URL salvato, manca l\'abbinamento: premi Collega</div>';
  else stato=`<div class="stato">✓ Ultimo invio ${quando(s.ok)}${s.cieco?' (senza conferma)':''} · backup ${quando(s.bk)}${S.pend.length?` · ${S.pend.length} in attesa`:''}</div>`;
  return `<div class="card"><div class="lbl">Foglio Google</div>${stato}
    <p class="txt" style="margin:10px 0">Ogni modifica finisce nel tuo Google Sheet, leggibile anche dal coach: corse, intertempi, settimane, piano, fastidi e gare. Il backup completo dell'app va in un file separato e privato.</p>
    <div class="fg"><label for="gs_url">URL dello script (finisce con /exec)</label><input type="url" id="gs_url" value="${esc(S.sheetUrl)}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></div>
    <div class="btn-row">${coll?`<button class="btn btn-pri sm" onclick="sincronizza(true)">Invia ora</button>`:`<button class="btn btn-pri sm" id="gs_coll" onclick="collegaSheet()">Collega</button>`}
      <button class="btn btn-sec sm" onclick="backupCloud(true)"${coll?'':' disabled'}>Backup ora</button><button class="btn btn-sec sm" onclick="ripristinaCloud()"${coll?'':' disabled'}>Ripristina</button></div>
    <details class="g" style="margin-top:10px"${s.vecchio||(S.sheetUrl&&!S.token)?' open':''}><summary>Collegare o aggiornare lo script</summary><div><ol class="ol">
      <li>Apri il tuo foglio su <b>sheets.google.com</b> (da computer è più comodo) → <b>Estensioni → Apps Script</b>.</li>
      <li>Cancella tutto il codice e incolla lo script qui sotto. Salva.</li>
      <li>In alto scegli la funzione <b>installa</b> e premi <b>Esegui</b>. Autorizza: <b>Avanzate → Vai a … (non sicuro)</b>. Lo script è tuo e scrive solo nei tuoi file.</li>
      <li><b>Esegui il deployment → Gestisci deployment</b> → matita → Versione: <b>Nuova versione</b> → Esegui il deployment. L'URL resta lo stesso. Se è il primo deployment: Nuovo deployment → App web, esegui come <b>te stesso</b>, accesso <b>Chiunque</b>.</li>
      <li>Entro 30 minuti premi <b>Collega</b> qui sopra.</li></ol>
      <div class="codice">${esc(SCRIPT_GS)}</div>
      <div class="btn-row"><button class="btn btn-sec sm" onclick="copia(SCRIPT_GS)">Copia lo script</button><button class="btn btn-sec sm" onclick="scarica('runlog-apps-script-v11.txt',SCRIPT_GS)">Scarica come file</button></div>
      <p class="muted" style="margin-top:8px">"Accesso: Chiunque" serve perché l'app possa scrivere senza farti accedere a Google dal telefono: senza la chiave lo script non scrive e non legge nulla.</p></div></details>
    <details class="g"><summary>Secondo telefono o chiave</summary><div>
      ${S.token?`<p>Chiave di questo telefono: <code id="gs_k">${'•'.repeat(8)+esc(S.token.slice(-4))}</code> <button class="lnk" onclick="$('gs_k').textContent=S.token">mostra</button> · <button class="lnk" onclick="copia(S.token)">copia</button></p>`:''}
      <p>Su un altro telefono: incolla URL e chiave e premi Collega. In alternativa esegui di nuovo <b>installa</b> nello script e premi Collega entro 30 minuti.</p>
      <div class="fg" style="margin-top:8px"><label for="gs_key">Chiave</label><input type="text" id="gs_key" placeholder="32 caratteri" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <p class="muted">Telefono perso? Esegui <b>nuovaChiave</b> nello script: le chiavi vecchie smettono di funzionare.</p></div></details>
    <details class="g"><summary>Condividere con il coach</summary><div><ol class="ol">
      <li>Nel foglio: <b>Condividi</b> → scrivi l'email del coach → ruolo <b>Visualizzatore</b> (o Commentatore se vuoi i suoi commenti).</li>
      <li>Lascia "Accesso generale" su <b>Con restrizioni</b>: niente link pubblici.</li>
      <li>Il coach vede tutti i fogli di quel file, fastidi compresi. Non vede il file di backup, che resta privato.</li>
      <li>Se il coach modifica una cella, la modifica non arriva nell'app e viene sovrascritta: per cambiare il piano deve dirtelo (la modifica diretta dal foglio arriverà in una versione successiva).</li></ol></div></details>
  </div>`;
}

/* ═══════════════ 9. AVVIO ═══════════════ */

// Primo avvio (o arrivo dalla v9 senza piano): una schermata con i parametri del piano già compilati
function primoAvvio(daV9){
  $('primoIn').innerHTML=`<h1>RunLog ${VER.split('.')[0]}</h1>
    <p class="txt" style="margin:10px 0 18px">${daV9
      ?`Ho ritrovato i dati della versione precedente: <b>${S.logs.length} allenamenti</b> e check sono al loro posto. Il vecchio piano non era più allineato: qui sotto lo ricalcoli partendo da dove sei adesso.`
      :'Diario di corsa con un piano che si adatta a come rispondi al carico. Controlla i dati qui sotto e parti.'}</p>
    ${formGenHTML(cfgDefault(),false)}
    <button class="btn btn-pri w100" onclick="generaDaForm()">Crea il piano e inizia</button>
    <label class="btn btn-sec w100" style="margin-top:8px">Ho un backup da caricare<input type="file" accept=".json,application/json,text/plain" style="display:none" onchange="importaBackup(this)"></label>`;
  $('primo').style.display='block';
  anteprimaGen();
}

// Richiesta di installazione del browser (solo online, Chrome ed Edge)
async function installa(){
  if(!_installa) return;
  const ev=_installa;_installa=null;
  try{ev.prompt();await ev.userChoice;}catch(e){}
  disegna();
}

(function avvio(){
  tema();
  /* 1. guardia: la scheda ricorda che c'erano dati, ma l'archivio risulta vuoto. Con i file locali il browser
        può consegnare un archivio vuoto se si ricarica subito dopo una scrittura; alla ricarica successiva
        i dati tornano. Qui NON si scrive nulla: due tentativi automatici, poi si chiede cosa fare. */
  const ap=(window.name||'').split('|');
  if(STORAGE_OK&&ap[0]==='runlog'&&ap[4]===QUI&&(+ap[1]>0||ap[2]==='1')&&!S.cfg&&!S.logs.length){
    const tentativi=+ap[3]||0;
    if(tentativi<2){
      window.name=['runlog',ap[1],ap[2],tentativi+1,QUI].join('|');
      setTimeout(()=>location.reload(),700);
    }
    $('primoIn').innerHTML=`<h1>RunLog</h1>
      <p class="txt" style="margin:14px 0 18px">${tentativi<2?'Carico i dati…':`Il browser non ha consegnato i dati salvati (${ap[1]} allenamenti poco fa). Di solito basta ricaricare: non è una perdita.`}</p>
      ${tentativi<2?'':`<button class="btn btn-pri w100" onclick="window.name=['runlog',${+ap[1]},${+ap[2]},0,QUI].join('|');location.reload()">Ricarica</button>
        <label class="btn btn-sec w100" style="margin-top:8px">Carica un backup<input type="file" accept=".json,application/json,text/plain" style="display:none" onchange="importaBackup(this)"></label>
        <button class="lnk" style="margin-top:14px" onclick="if(confirm('Iniziare da zero? Fallo solo se hai davvero cancellato i dati.')){window.name='';location.reload();}">I dati li ho cancellati io: inizia da zero</button>`}`;
    $('primo').style.display='block';
  }else{
    /* 2. migrazione dei dati delle versioni precedenti (con copia di sicurezza), primo disegno, eventuale primo avvio */
    const m=migra();
    disegna();
    if(!S.cfg||!S.plan) primoAvvio(m.daV9);
    appunto();
  }

  /* 3. fogli: tocco fuori = chiudi */
  for(const n of [1,2]) $('ov'+n).addEventListener('click',e=>{if(e.target===e.currentTarget) chiudiSheet(n);});

  /* 4. cambio giorno e sincronizzazione: all'avvio, al ritorno in primo piano e al ritorno della rete */
  let giorno=oggiStr();
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden) return;
    if(giorno!==oggiStr()){giorno=oggiStr();S.editCheck=false;disegna();}   // app rimasta aperta dal giorno prima
    sincronizza();
  });
  window.addEventListener('online',()=>sincronizza());
  sincronizza();
  if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>tema());

  /* 5. installazione: quando il browser segnala che l'app è installabile compare "Installa" */
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_installa=e;if(S.page==='oggi'||S.page==='altro') disegna();});
  window.addEventListener('appinstalled',()=>{_installa=null;toast('RunLog installata sulla schermata Home');disegna();});

  /* 6. online (https): utilizzabile senza rete, dati protetti dalla pulizia automatica del browser */
  if(location.protocol==='https:'||location.hostname==='localhost'){
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
    if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  }
})();
</script>

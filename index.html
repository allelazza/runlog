  /* ── salute in una sola scheda compatta: fastidio al risveglio, esercizi, test della settimana ── */
  const tSett=Object.keys(S.tests).find(d=>d>=lun&&d<=dom), giornoTest=piuGiorni(lun,+S.set.testDay||0);
  h+=`<div class="card salute">
    <div class="lbl">Al risveglio<small>fastidio 0–10</small></div>
    ${m&&m.v!=null&&!S.editCheck
      ?`<div class="riga"><span><i class="dot pieno" style="--tc:${colDolore(m.v)}"></i> <b>${m.v}/10</b>${m.z?' · '+esc(m.z):''}</span><button class="lnk" onclick="S.editCheck=true;disegna()">modifica</button></div>
        ${m.v>=3?`<div class="chips">${['achille','caviglia','altro'].map(z=>`<button class="${m.z===z?'on':''}" onclick="setZona('${z}')">${z}</button>`).join('')}</div>`:''}`
      :scalaHTML('mat',m?m.v:null,0)}
    <div class="riga" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
      <button class="spunta${S.rehab[oggi]?' on':''}" onclick="togRehab()" aria-pressed="${!!S.rehab[oggi]}"><i>${S.rehab[oggi]?'✓':''}</i>Esercizi fatti oggi</button>
      <button class="lnk" onclick="S.tab.altro='esercizi';vai('altro')">la mia routine</button></div>
    ${!tSett&&oggi>=giornoTest?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)"><div class="lbl">Test della settimana<small>sempre nello stesso modo</small></div>
      <p class="muted" style="margin-bottom:8px">Porta il piede a fine estensione nel movimento che ti dà fastidio. Quanto fa male?</p>${scalaHTML('test',null,0)}</div>`:''}
  </div>`;

  /* ── settimana: barra km, 7 giorni, numeri, posizione nel blocco ── */
  let hW='';
  for(let i=0;i<7;i++){
    const ds=piuGiorni(lun,i), es=dm[ds]||[], kmG=S.logs.filter(l=>l.data===ds&&eCorsa(l)).reduce((t,l)=>t+ +l.km,0);
    hW+=`<div class="wd${ds===oggi?' oggi':ds<oggi?' pass':''}" onclick="apriGiorno('${ds}')"><span class="wd-l">${GG[i][0]}</span><span class="wd-n">${parseD(ds).getDate()}</span>
      <span class="wd-d">${es.map(e=>`<i class="dot t-${e.s.type}${e.done?' fatto':e.skip?' salto':''}"></i>`).join('')}</span>${kmG?`<span class="wd-km">${num1(kmG)}</span>`:''}</div>`;
  }
  const st=statSett(lun), perc=st.kmP?Math.min(100,Math.round(st.km/st.kmP*100)):0;
  let blocco='';
  if(wk){
    const i=S.plan.indexOf(wk), prec=S.plan.slice(0,i), ultimoCut=prec.map(w=>w.ruolo).lastIndexOf('cut');
    const nB=prec.filter(w=>w.ruolo==='cut').length+1, pos=i-ultimoCut;
    blocco=['race','taper1','taper2'].includes(wk.ruolo)?(wk.ruolo==='race'?'Settimana di gara':'Scarico pre-gara'):wk.ruolo==='recup'?'Recupero':`Blocco ${nB} · settimana ${Math.min(pos,4)} di 4`;
  }
  h+=`<div class="card"><div class="lbl">Questa settimana<small>${blocco}</small></div>
    <div class="kmbar"><b>${num1(st.km)}</b><span> di ${Math.round(st.kmP)} km</span><div class="barra"><i style="width:${perc}%"></i></div></div>
    <div class="week" style="margin-top:10px">${hW}</div>
    <div class="wstats">
      <div class="ws"><b>${st.n}<i>/${st.nP}</i></b><span>corse</span></div>
      <div class="ws"><b>${st.sec?durata(st.sec):'—'}</b><span>tempo</span></div>
      <div class="ws"><b>${st.passoFac?secPasso(st.passoFac):'—'}</b><span>passo facile</span></div>
      <div class="ws"><b>${st.rpe!=null?num1(st.rpe):'—'}</b><span>sforzo medio</span></div>
    </div></div>`;

  /* ── prossima seduta di corsa o calcio ── */
  const dopo=Object.keys(dm).filter(d=>d>oggi).sort().map(d=>dm[d].find(e=>!e.done&&!e.skip&&(CORSA.includes(e.s.type)||e.s.type==='calcio'))).find(Boolean);
  if(dopo) h+=`<div class="card t-${dopo.s.type}" style="padding:11px 14px;cursor:pointer" onclick="apriGiorno('${dopo.date}')">
    <div class="lbl" style="margin:0"><span><i class="dot"></i>&nbsp; Prossima: <b style="color:var(--text)">${esc(dopo.s.label)}${dopo.s.km?' · '+num1(dopo.s.km)+' km':''}</b></span>
    <small>${giorniTra(oggi,dopo.date)===1?'domani':dataIt(dopo.date,{weekday:'short',day:'numeric',month:'short'})}</small></div></div>`;

  /* ── avviso di carico (solo quando serve) e conto alla rovescia delle gare ── */
  const c=carico();
  if(c.r!=null&&c.r>1.4) h+=`<div class="alert ${c.r>1.6?'a-danger':'a-warn'}"><b>${c.r>1.6?'⚠':'⚡'} Carico in salita: +${Math.round((c.r-1)*100)}% sulle ultime 4 settimane</b>${Math.round(c.k7)} km negli ultimi 7 giorni contro una media di ${Math.round(c.base)}. Per il tendine i salti di carico contano più dei km totali: tieni facili le prossime uscite.</div>`;
  const gare=S.gare.filter(g=>g.data&&g.data>=oggi).sort((a,b)=>a.data<b.data?-1:1).slice(0,2);
  if(gare.length) h+=`<div class="tiles">${gare.map(g=>`<div class="tile" style="cursor:pointer" onclick="S.tab.piano='gare';vai('piano')"><span>${esc(g.nome)}</span><b>${giorniTra(oggi,g.data)}<i> giorni</i></b><small>${dataIt(g.data,{day:'numeric',month:'long'})}</small></div>`).join('')}</div>`;

  el.innerHTML=h;
}

/* ═══════════════ 5. PIANO: calendario, settimane, gare, zone, giorno, revisione ═══════════════ */
function disPiano(el){
  const t=S.tab.piano;
  let h=`<div class="ph"><div><h1>Piano</h1>${S.plan?`<p>${S.plan.length} settimane dal ${dataIt(S.plan[0].lun,{day:'numeric',month:'long',year:'numeric'})}</p>`:''}</div>
      ${S.plan?`<button class="btn btn-sec sm" onclick="apriRevisione()">Revisione</button>`:''}</div>
    <div class="tabs">
      <button class="tab${t==='cal'?' on':''}" onclick="tab('piano','cal')">Calendario</button>
      <button class="tab${t==='sett'?' on':''}" onclick="tab('piano','sett')">Settimane</button>
      <button class="tab${t==='gare'?' on':''}" onclick="tab('piano','gare')">Gare</button>
      <button class="tab${t==='zone'?' on':''}" onclick="tab('piano','zone')">Zone</button>
    </div>`;
  if(!S.plan&&t!=='gare'){el.innerHTML=h+`<div class="card vuoto">Nessun piano.<br><br><button class="btn btn-pri" onclick="apriGeneratore()">Crea il piano</button></div>`;return;}
  const dm=dateMap(), oggi=oggiStr();

  if(t==='cal'){
    /* ── calendario mensile: pallini delle sedute (pieno = fatta) e km effettivamente corsi ── */
    const y=S.calY, mo=S.calM, primo=new Date(y,mo,1), nGiorni=new Date(y,mo+1,0).getDate(), sfas=(primo.getDay()+6)%7;
    const celle=Math.ceil((sfas+nGiorni)/7)*7;
    let c='';
    for(let i=0;i<celle;i++){
      const d=new Date(y,mo,i-sfas+1), ds=fmtD(d), es=dm[ds]||[], fuori=d.getMonth()!==mo;
      const logs=S.logs.filter(l=>l.data===ds), liberi=logs.filter(l=>!l.sk).length, km=logs.filter(eCorsa).reduce((t,l)=>t+ +l.km,0);
      c+=`<div class="cc${fuori?' fuori':''}${ds===oggi?' oggi':''}${es.some(e=>e.s.type==='race')?' gara':''}" onclick="apriGiorno('${ds}')">
        <div class="cc-n">${d.getDate()}</div>
        <div class="cc-d">${es.slice(0,4).map(e=>`<i class="dot t-${e.s.type}${e.done?' fatto':e.skip?' salto':''}"></i>`).join('')}${liberi?'<i class="dot t-rest fatto"></i>':''}</div>
        ${km?`<div class="cc-km">${num1(km)}</div>`:''}</div>`;
    }
    h+=`<div class="card" style="padding:12px 10px">
      <div class="cal-h"><button class="cal-nav" onclick="calMese(-1)" aria-label="Mese precedente">‹</button>
        <div class="cal-m">${primo.toLocaleDateString('it-IT',{month:'long',year:'numeric'})}</div>
        <button class="cal-nav" onclick="calMese(1)" aria-label="Mese successivo">›</button></div>
      <div class="cal-w">${GG.map(g=>`<div>${g[0]}</div>`).join('')}</div>
      <div class="cal-g">${c}</div>
      <div class="legenda">${['easy','long','medium','hard','calcio','gym','race'].map(k=>`<span class="t-${k}"><i class="dot pieno"></i>${TIPI[k]}</span>`).join('')}
        <span class="t-rest"><i class="dot"></i>da fare</span><span class="t-rest"><i class="dot pieno"></i>fatta</span><span>numero = km corsi</span></div>
    </div>`;
  }

  if(t==='sett'){
    /* ── elenco settimane con fase, km previsti e note; quella in corso è evidenziata ── */
    const NOMI={recovery:'Rientro e recupero',base:'Base aerobica',buildup:'Costruzione',taper:'Scarico pre-gara',race:'Gara'};
    const nW=settCorrente();
    let ultima='';
    for(const wk of S.plan){
      if(wk.phase!==ultima){h+=`<div><span class="fase">${NOMI[wk.phase]||wk.phase}</span></div>`;ultima=wk.phase;}
      const km=wk.sessions.filter(s=>CORSA.includes(s.type)).reduce((t,s)=>t+(s.km||0),0);
      h+=`<div class="wk${wk.w===nW?' cur':nW&&wk.w<nW?' pass':''}" id="wk${wk.w}">
        <div class="wk-h"><b>${wk.w}. ${esc(wk.title)}</b><span>${dataIt(wk.lun,{day:'numeric',month:'short'})} · ${Math.round(km)} km</span></div>
        ${wk.info?`<div class="wk-info">${esc(wk.info)}</div>`:''}
        ${wk.sessions.map(s=>{
          const ds=S.over[s.id]||s.date;
          return `<div class="sr t-${s.type}${S.skip[s.id]?' salto':''}" onclick="apriGiorno('${ds}')">
            <span class="sr-g">${ggDi(ds)}</span><i class="dot${S.done[s.id]?' fatto':S.skip[s.id]?' salto':''}"></i>
            <div><div class="sr-t">${esc(s.label)}${s.km?` · ${num1(s.km)} km`:''}</div><div class="sr-d">${esc(s.desc)}</div></div></div>`;
        }).join('')}
      </div>`;
    }
    /* ── versioni precedenti del piano (revisioni, cambi di parametri, import) ── */
    h+=`<div class="card"><div class="lbl">Versioni precedenti del piano<small>le ultime ${S.plans.length||0}</small></div>
      ${S.plans.length?S.plans.map((v,i)=>`<div class="lr" style="cursor:default"><div class="lr-m"><div class="lr-1"><b style="font-size:15px">${new Date(v.ts).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</b><span>${esc(v.origine)}</span></div>
          <div class="lr-2" style="white-space:normal">${esc(v.motivo||'')}</div></div><button class="btn btn-sec sm" onclick="ripristinaVersione(${i})">Ripristina</button></div>`).join('')
        :'<p class="muted">Ogni volta che il piano cambia, la versione precedente viene conservata qui.</p>'}
      ${S.revs.length?`<details class="tv"><summary>Revisioni del blocco</summary><table><tr><th>Data</th><th>Esito</th><th>Motivo</th></tr>${S.revs.slice(0,12).map(r=>`<tr><td>${dataIt(r.data,{day:'numeric',month:'short'})}</td><td>${esc(r.esito)}</td><td>${esc(r.motivo)}</td></tr>`).join('')}</table></details>`:''}
    </div>`;
  }

  if(t==='gare') h+=gareHTML();

  if(t==='zone'){
    /* ── passi personali calcolati dal PB (stessa funzione usata dal generatore) ── */
    const Z=zone(S.cfg.pb);
    const riga=(k,nome,sotto,passo)=>`<tr class="t-${k}"><td><i class="dot pieno"></i></td><td style="padding-left:10px"><b>${nome}</b><small>${sotto}</small></td><td>${passo}</td></tr>`;
    h+=`<div class="card"><div class="lbl">I tuoi passi<small>dal PB 10 km di ${esc(S.cfg.pb)} (${secPasso(Z.P)}/km)</small></div>
      <table class="ztab">
        ${riga('easy','Facile, rientro e base','passo libero, a sensazione',Z.easyFast+'–'+Z.easy)}
        ${riga('easy','Facile, con la qualità','serve a recuperare',Z.easy+'+')}
        ${riga('long','Lungo','aerobico, regolare',Z.long+'–'+Z.easy)}
        ${riga('medium','Progressivo','finale brillante',Z.steady)}
        ${riga('medium','Tempo / soglia','impegnativo ma controllato',Z.soglia)}
        ${riga('race','Ritmo mezza','obiettivo '+durata(passoSec(Z.hm)*21.0975),Z.hm)}
        ${riga('race','Ritmo maratona','obiettivo '+durata(passoSec(Z.mp)*42.195),Z.mp)}
        ${riga('hard','Ripetute 1000 m','VO2max',Z.r1000)}
        ${riga('hard','Ripetute 400 m','veloci ma sciolte',Z.r400)}
      </table>
      <p class="muted" style="margin-top:10px">I passi cambiano se aggiorni il PB (Revisione → Cambia gare o parametri). Con caldo e umidità sopra 22 °C aggiungi 10–15 secondi al km e accorcia il lungo: conta lo sforzo, non il cronometro.</p>
    </div>
    <div class="card"><div class="lbl">Come leggere il fastidio</div>
      <table class="ztab" style="font-size:13.5px">
        <tr><td><span class="pill p-ok" style="margin:0">0–2</span></td><td style="padding-left:10px"><b>Carico tollerato</b><small>puoi seguire la progressione del piano</small></td><td></td></tr>
        <tr><td><span class="pill p-warn" style="margin:0">3–4</span></td><td style="padding-left:10px"><b>Limite</b><small>va bene se torna alla base entro 24 ore: mantieni, non aumentare</small></td><td></td></tr>
        <tr><td><span class="pill p-danger" style="margin:0">5+</span></td><td style="padding-left:10px"><b>Troppo</b><small>togli la qualità e accorcia; se resta alto senti la fisio</small></td><td></td></tr>
      </table>
    </div>
    <div class="card"><div class="lbl">Com'è costruito il piano</div>
      <ol class="ol">
        <li><b>Tre corse a settimana</b>, mai in giorni consecutivi: qualità, facile o ritmo gara, lungo.</li>
        <li><b>Blocchi di 4 settimane</b>: tre a salire e una di scarico. Il lungo cresce di 1–2 km, poi scende del 25%.</li>
        <li><b>Niente qualità all'inizio</b>: prima solo corsa facile, poi allunghi e progressivi, poi tempo e ripetute.</li>
        <li><b>Il calcio conta come seduta intensa</b>: le corse gli girano intorno.</li>
        <li><b>A fine blocco, la revisione</b>: confronta il fatto con il previsto e propone se proseguire, consolidare, alleggerire o ripianificare. Cambia il piano solo se confermi.</li>
      </ol>
    </div>`;
  }
  el.innerHTML=h;
  if(t==='gare') calcolaPasso();
  // nelle settimane, porta a vista quella in corso
  if(t==='sett') setTimeout(()=>{const c=$('wk'+settCorrente());if(c) c.scrollIntoView({block:'start'});window.scrollBy(0,-70);},0);
}
function calMese(d){S.calM+=d;if(S.calM<0){S.calM=11;S.calY--;}if(S.calM>11){S.calM=0;S.calY++;}disegna();}

/* ── Scheda del giorno: sedute in piano (con il consiglio se oggi o futuro) + allenamenti registrati ── */
function apriGiorno(ds){
  S.giorno=ds;S.corsa=null;
  const es=dateMap()[ds]||[], logs=S.logs.filter(l=>l.data===ds);
  let h='';
  for(const e of es){
    const ad=(e.done||e.skip)?{s:e.s,avvisi:[],cambiata:false}:adatta(e.s,ds), s=e.s;
    // per la forza: gli esercizi attivi della routine nei gruppi indicati dalla seduta
    const es2=s.type==='gym'&&s.gr?(S.ex||[]).filter(x=>x.on&&s.gr.includes(x.gr)):[];
    h+=`<div class="sc t-${s.type}${e.skip?' salto':''}">
      <div class="sc-t">${e.done?'✓ ':''}${esc(s.label)} <span class="chip">${TIPI[s.type]||''}</span>${e.skip?'<span class="muted">saltata</span>':''}</div>
      <div class="sc-d">${esc(s.desc)}</div>
      ${s.note?`<div class="sc-n">${esc(s.note)}</div>`:''}
      ${es2.length?`<ul class="exl">${es2.map(x=>`<li><b>${esc(x.nome)}</b> · ${esc(x.dose)}</li>`).join('')}</ul>`:''}
      ${ad.cambiata?`<div class="consiglio" style="margin:8px 0 0"><b>Consigliato:</b> ${esc(ad.s.label)}${ad.s.km?' · '+ad.s.km+' km':''}. ${esc(ad.s.desc)}</div>`:''}
      ${ad.avvisi.map(a=>`<span class="pill p-${a.l}">${a.l==='danger'?'⚠':a.l==='warn'?'⚡':'✓'} ${esc(a.m)}</span>`).join('')}
      ${e.done?pvrHTML(e):''}
      <div class="sc-a">${azioniHTML(e,ds)}${ad.cambiata&&!e.done&&ad.s.type!=='rest'?`<button class="btn btn-sec sm" onclick="apriLog({key:'${e.key}',data:'${ds}',cons:1})">Registra il consiglio</button>`:''}</div>
    </div>`;
  }
  if(!es.length) h+=`<div class="vuoto">Nessuna seduta in piano: riposo.</div>`;
  /* allenamenti registrati in questo giorno ma non legati a una seduta del piano */
  const liberi=logs.filter(l=>!l.sk||!es.some(e=>e.key===l.sk));
  if(liberi.length) h+=`<div class="lbl" style="margin-top:12px">Registrati fuori piano</div>`+liberi.map(l=>`<div class="sc ${classeLog(l.tipo)}" style="cursor:pointer" onclick="apriCorsa('${l.id}')">
      <div class="sc-t">${esc(l.tipo)}${l.km?` · ${num1(l.km)} km`:''}${l.ritmo?` · ${l.ritmo}/km`:''}</div>
      ${fastidioMax(l)!=null?`<div class="sc-n">Fastidio massimo ${fastidioMax(l)}/10${l.note?' · '+esc(l.note):''}</div>`:l.note?`<div class="sc-n">${esc(l.note)}</div>`:''}</div>`).join('');
  h+=`<button class="btn btn-sec w100" style="margin-top:8px" onclick="apriLog({data:'${ds}',libero:true})">Registra un altro allenamento</button>`;
  apriSheet(1,dataIt(ds,{weekday:'long'}),dataIt(ds,{day:'numeric',month:'long',year:'numeric'}),h);
  S.giorno=ds;
}

/* ── Sposta una seduta a un'altra data ── */
function apriSposta(key,ds){
  S.sposta=key;
  apriSheet(2,'Sposta seduta','Scegli il nuovo giorno. Evita due corse in giorni consecutivi.',
    `<div class="fg"><label for="spData">Nuova data</label><input type="date" id="spData" value="${ds}"></div>
     <div class="btn-row"><button class="btn btn-pri" onclick="confermaSposta()">Sposta</button><button class="btn btn-sec" onclick="chiudiSheet(2)">Annulla</button></div>`);
}
function confermaSposta(){
  const nd=$('spData').value;
  if(!nd){toast('Scegli una data','err');return;}
  S.over[S.sposta]=nd;accoda('p');salva();chiudiSheet(2);
  // avviso se il giorno prima o dopo c'è già una corsa
  const io=sedutaDi(S.sposta);
  const vicine=[piuGiorni(nd,-1),piuGiorni(nd,1)].some(d=>(dateMap()[d]||[]).some(e=>CORSA.includes(e.s.type)&&!e.skip&&e.key!==S.sposta));
  toast(vicine&&io&&CORSA.includes(io.s.type)?'Spostata, ma ora hai due corse in giorni consecutivi':'Spostata a '+dataIt(nd,{weekday:'short',day:'numeric',month:'short'}));
  if(S.giorno) S.giorno=nd;
  aggiorna();sincronizza();
}

/* ═══ REVISIONE DEL BLOCCO ═══
   Flusso: apriRevisione() analizza le ultime 4 settimane e mostra situazione, tabella previsto/fatto,
   segnali ed esito proposto. "Vedi le differenze" calcola il nuovo piano senza applicarlo e mostra,
   settimana per settimana, km e lungo prima e dopo. Solo "Applica" cambia il piano: la versione
   precedente va in S.plans, il passato e le corse registrate non vengono toccati. */
const ESITI={prosegui:'Prosegui',consolida:'Consolida',alleggerisci:'Alleggerisci',ripianifica:'Ripianifica'};
function apriRevisione(){
  if(!S.plan){apriGeneratore();return;}
  const daLun=inizioRevisione(), R=analizzaBlocco(daLun), oggi=oggiStr();
  S._rev=R;
  const wk=settDi(oggi), gare=S.gare.filter(g=>g.data&&g.data>=oggi).sort((a,b)=>a.data<b.data?-1:1);
  let h=`<div class="kv" style="margin-top:0">
      <span>Settimana del piano</span><b>${wk?wk.w+' di '+S.plan.length:'fuori piano'}</b>
      ${gare[0]?`<span>${esc(gare[0].nome)}</span><b>tra ${Math.ceil(giorniTra(oggi,gare[0].data)/7)} settimane</b>`:''}
      <span>Lungo più lungo (3 settimane)</span><b>${lungoMax(21)||'—'} km</b>
      <span>Le modifiche partono da</span><b>${dataIt(daLun,{weekday:'short',day:'numeric',month:'short'})}</b></div>`;
  if(R.vuoto) h+=`<div class="alert a-info" style="margin-top:12px"><b>ⓘ Nessuna settimana chiusa da analizzare</b>La prima revisione utile arriva alla fine del primo blocco. Puoi comunque cambiare gare o parametri.</div>`;
  else{
    h+=`<div class="lbl" style="margin-top:14px">Ultime ${R.sett.length} settimane</div>
      <div class="tblw"><table class="tbl"><tr><th>Settimana</th><th>Km</th><th>Corse</th><th>Lungo</th><th>Sforzo facile</th></tr>
      ${R.sett.map(x=>`<tr><td>${dataIt(x.wk.lun,{day:'numeric',month:'short'})}</td><td>${num1(x.kmF)} <small>/ ${Math.round(x.kmP)}</small></td><td>${x.nF} <small>/ ${x.nP}</small></td><td>${num1(x.lungoF)} <small>/ ${num1(x.lungoP)}</small></td><td>${x.rpeF!=null?num1(x.rpeF):'—'}</td></tr>`).join('')}
      </table></div><p class="muted">fatto / previsto. Sforzo facile = media dello sforzo indicato nelle corse facili e nei lunghi.</p>`;
    const segnali=[];
    if(R.saltate.length) segnali.push(`${R.saltate.length} ${R.saltate.length===1?'seduta saltata':'sedute saltate'}: ${R.saltate.slice(0,4).map(x=>esc(x.s.label)+' ('+dataIt(x.date,{day:'numeric',month:'short'})+')').join(', ')}${R.saltate.length>4?'…':''}`);
    if(R.episodi) segnali.push(`${R.episodi} ${R.episodi===1?'episodio':'episodi'} di fastidio 5 o più (al risveglio o in corsa)`);
    if(R.testPeggio) segnali.push('Test settimanale peggiorato due volte di fila');
    if(R.rpeSale) segnali.push('Sforzo nelle corse facili in salita');
    h+=`<div class="lbl" style="margin-top:12px">Segnali</div>${segnali.length?`<ul class="exl">${segnali.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p class="muted">Nessun segnale da segnalare.</p>'}`;
    h+=`<div class="alert ${R.esito==='prosegui'?'a-ok':R.esito==='alleggerisci'?'a-warn':'a-info'}" style="margin-top:12px"><b>Proposta: ${ESITI[R.esito]}</b>${esc(R.motivo)}</div>
      <div class="fg"><label for="rv_es">Esito da applicare</label><select id="rv_es">${Object.keys(ESITI).map(k=>`<option value="${k}"${k===R.esito?' selected':''}>${ESITI[k]}${k===R.esito?' (proposto)':''}</option>`).join('')}</select></div>
      <div class="btn-row"><button class="btn btn-pri" onclick="propostaRevisione($('rv_es').value)">Vedi le differenze</button></div>`;
  }
  h+=`<button class="btn btn-sec w100" style="margin-top:8px" onclick="apriGeneratore()">Cambia gare o parametri</button>`;
  apriSheet(1,'Revisione del blocco',R.vuoto?'':`Blocco chiuso il ${dataIt(piuGiorni(R.sett[R.sett.length-1].wk.lun,6),{day:'numeric',month:'long'})}`,h);
}
function propostaRevisione(esito){
  const R=S._rev;
  if(esito==='prosegui'){
    if(!confirm('Proseguire con il piano com\'è? Nessuna seduta cambia.')) return;
    registraRevisione(R,'prosegui',R.esito==='prosegui'?R.motivo:'Scelto di proseguire nonostante la proposta: '+ESITI[R.esito]);
    chiudiSheet(1);disegna();toast('Revisione registrata: il piano resta com\'è');return;
  }
  const cfg=parametriRevisione(R,esito), nuovo=ricalcolaDa(cfg,R.daLun);
  const motivo=esito===R.esito?R.motivo:`Scelto ${ESITI[esito]} (proposta: ${ESITI[R.esito]}). ${R.motivo}`;
  mostraDifferenze(nuovo,{...cfg,tail:R.daLun},{origine:'Revisione: '+ESITI[esito],motivo,esito,blocco:R.sett.length?R.sett[R.sett.length-1].wk.lun:null,daLun:R.daLun});
}
function registraRevisione(R,esito,motivo){
  const cut=S.plan.filter(wk=>wk.ruolo==='cut'&&wk.lun<R.daLun).pop();
  S.revs.unshift({data:oggiStr(),blocco:cut?cut.lun:null,esito:ESITI[esito],motivo});
  S.revs=S.revs.slice(0,30);salva();
}
function rimandaRevisione(lun){S.revs.unshift({data:oggiStr(),blocco:lun,esito:'Rimandata',motivo:'Rimandata da Oggi'});S.revs=S.revs.slice(0,30);salva();disegna();}

// Confronto vecchio/nuovo settimana per settimana e pulsante Applica
function mostraDifferenze(nuovo,cfg,info){
  S._prop={nuovo,cfg,info};
  const vecchie=Object.fromEntries((S.plan||[]).map(w=>[w.lun,w])), righe=[];
  const kmW=w=>w?w.sessions.filter(s=>CORSA.includes(s.type)).reduce((t,s)=>t+(s.km||0),0):0;
  const lgW=w=>w?Math.max(0,...w.sessions.filter(s=>CORSA.includes(s.type)).map(s=>s.km||0)):0;
  const firma=w=>w?w.sessions.map(s=>s.d+s.type+s.label+(s.km||'')).join('|'):'';
  const tutte=[...new Set([...Object.keys(vecchie),...nuovo.map(w=>w.lun)])].filter(l=>l>=info.daLun).sort();
  for(const lun of tutte){
    const a=vecchie[lun], b=nuovo.find(w=>w.lun===lun);
    righe.push({lun,ka:kmW(a),kb:kmW(b),la:lgW(a),lb:lgW(b),cambia:firma(a)!==firma(b),ta:a?a.title:'—',tb:b?b.title:'—'});
  }
  const n=righe.filter(r=>r.cambia).length, r=riepilogoPiano(nuovo);
  let avv='';
  if(r.wH&&r.piccoH<16) avv+=`<li>Prima della mezza il lungo arriva solo a ${r.piccoH} km.</li>`;
  if(r.wM&&r.piccoM<28) avv+=`<li>Per la maratona il lungo arriva solo a ${r.piccoM} km: troppo poco.</li>`;
  const h=`<div class="alert a-info"><b>${esc(info.origine)}</b>${esc(info.motivo)}</div>
    ${avv?`<div class="alert a-warn"><b>⚡ Attenzione</b><ul>${avv}</ul></div>`:''}
    <p class="txt" style="margin-bottom:8px">${n?`Cambiano ${n} ${n===1?'settimana':'settimane'} su ${righe.length}.`:'Nessuna settimana cambia.'} Le settimane prima del ${dataIt(info.daLun,{day:'numeric',month:'short'})} e le corse registrate restano come sono.</p>
    <div class="tblw"><table class="tbl"><tr><th>Settimana</th><th>Km</th><th>Lungo</th></tr>
    ${righe.map(x=>`<tr class="${x.cambia?'diff':''}"><td>${dataIt(x.lun,{day:'numeric',month:'short'})}<small class="sotto">${esc(x.tb)}</small></td><td>${x.cambia&&Math.round(x.ka)!==Math.round(x.kb)?`<s>${Math.round(x.ka)}</s> ${Math.round(x.kb)}`:Math.round(x.kb)}</td><td>${x.cambia&&x.la!==x.lb?`<s>${num1(x.la)}</s> ${num1(x.lb)}`:num1(x.lb)}</td></tr>`).join('')}
    </table></div>
    <div class="btn-row" style="margin-top:12px"><button class="btn btn-pri" onclick="applicaProposta()">Applica</button><button class="btn btn-sec" onclick="chiudiSheet(1)">Annulla</button></div>`;
  apriSheet(1,'Differenze nel piano','Evidenziate le settimane che cambiano',h);
}
// Applica il piano proposto: archivia il precedente, pulisce lo stato delle sedute sparite, invia al foglio
function applicaProposta(){
  const P=S._prop;if(!P) return;
  if(S.plan) S.plans.unshift({ts:Date.now(),origine:P.info.origine,motivo:P.info.motivo,cfg:S.cfg,plan:S.plan});
  S.plans=S.plans.slice(0,10);
  S.plan=P.nuovo;S.cfg=P.cfg;
  attivaStato();
  if(P.info.esito) registraRevisione({daLun:P.info.daLun},P.info.esito,P.info.motivo);
  sincGare(S.cfg);accoda('p');salva();
  S._prop=null;chiudiSheet(1);$('primo').style.display='none';
  toast('Piano aggiornato');vai('oggi');sincronizza();
}
function ripristinaVersione(i){
  const v=S.plans[i];if(!v) return;
  if(!confirm(`Tornare alla versione del ${new Date(v.ts).toLocaleDateString('it-IT')}? Il piano attuale viene archiviato e le corse registrate restano.`)) return;
  S.plans.splice(i,1);
  S.plans.unshift({ts:Date.now(),origine:'Prima del ripristino',motivo:'Versione sostituita da un ripristino',cfg:S.cfg,plan:S.plan});
  S.plans=S.plans.slice(0,10);
  S.plan=v.plan;S.cfg=v.cfg;attivaStato();sincGare(S.cfg);accoda('p');salva();disegna();toast('Versione ripristinata');sincronizza();
}
// Dopo un cambio di piano: via spunte, salti e spostamenti di sedute che non esistono più;
// le corse non collegate vengono ricollegate per data a una seduta compatibile ancora libera
function attivaStato(){
  _dm=null;
  const ids=new Set(S.plan.flatMap(w=>w.sessions.map(s=>s.id)));
  for(const o of [S.done,S.skip,S.over]) for(const k in o) if(!ids.has(k)) delete o[k];
  for(const l of [...S.logs].sort((a,b)=>a.data<b.data?-1:1)){
    if(l.sk&&ids.has(l.sk)){S.done[l.sk]=true;continue;}
    l.sk='';
    const corsa=eCorsa(l), cand=(dateMap()[l.data]||[]).find(e=>!S.done[e.key]&&(corsa?CORSA.includes(e.s.type):l.tipo==='Calcio'?e.s.type==='calcio':l.tipo==='Forza'?e.s.type==='gym':false));
    if(cand){l.sk=cand.key;S.done[cand.key]=true;}
  }
  _dm=null;
}

/* ═══ GENERATORE (crea il piano o cambia gare e parametri) ═══ */
function formGenHTML(c,inCorso){

    <div class="fg2"><div class="fg"><label for="g_start">Inizio <small>lunedì</small></label><input type="date" id="g_start" value="${c.start}" onchange="anteprimaGen()"${inCorso?' disabled':''}></div>
    <div class="fg"><label for="g_pb">PB 10 km <small>mm:ss</small></label><input type="text" id="g_pb" value="${esc(c.pb)}" placeholder="45:30" oninput="anteprimaGen()"></div></div>
    <div class="fg2"><div class="fg"><label for="g_long">Lungo attuale <small>km</small></label><input type="number" inputmode="numeric" id="g_long" value="${c.long0}" min="3" max="35" oninput="anteprimaGen()"></div>
    <div class="fg"><label for="g_noq">Solo corsa facile per</label><select id="g_noq" onchange="anteprimaGen()">${opz([[8,'8 settimane'],[6,'6 settimane'],[4,'4 settimane'],[2,'2 settimane'],[0,'Nessuna']],c.noQ)}</select></div></div>

    <button type="button" class="lnk" id="g_togli" style="margin:-6px 0 8px" onclick="$('g_mara').value='';anteprimaGen()">Togli la maratona (solo mezza)</button>
    <div class="fg2"><div class="fg"><label for="g_foot">Calcio: giorno</label><select id="g_foot" onchange="anteprimaGen()">${opz([[-1,'Non gioco'],[0,'Lunedì'],[1,'Martedì'],[2,'Mercoledì'],[3,'Giovedì'],[4,'Venerdì']],c.foot)}</select></div>
    <div class="fg"><label for="g_fmin">Minuti ultima partita</label><select id="g_fmin" onchange="anteprimaGen()">${opz([[10,'10'],[15,'15'],[20,'20'],[30,'30'],[40,'40'],[50,'50'],[60,'Partita intera']],c.footMin)}</select></div></div>
    <div class="alert a-info" id="g_prev"></div>`;

function leggiGen(){
  const st=$('g_start').value||oggiStr();
  return {start:lunediDi(st),pb:passoSec($('g_pb').value)>0?$('g_pb').value.trim():'45:30',long0:Math.max(3,Math.min(35,Math.round(+$('g_long').value||6))),
    noQ:+$('g_noq').value,half:$('g_half').value||'',mara:$('g_mara').value||'',foot:+$('g_foot').value,footMin:+$('g_fmin').value};
}
// anteprima in tempo reale: durata, settimane delle gare, sequenza dei lunghi e avvisi sulla fattibilità
function anteprimaGen(){
  const c=leggiGen(), inCorso=$('g_start').disabled, da=inCorso?S._genDa:c.start, r=riepilogoPiano(generaPiano({...c,start:da}));
  let t=`<b>${inCorso?`Dal ${dataIt(da,{day:'numeric',month:'long'})}: ${r.n} settimane`:`${r.n} settimane dal ${dataIt(c.start,{day:'numeric',month:'long'})}`}</b>`+(r.wH?`Mezza alla settimana ${r.wH}. `:'')+(r.wM?`Maratona alla settimana ${r.wM}. `:'')+
    `<br>Lunghi: ${r.lunghi.map(x=>x>40?'M':x===21.1?'½':x).join(' · ')}`;
  if(passoSec($('g_pb').value)<=0) t+='<br>⚠ PB non valido: uso 45:30.';
  if(r.wH&&r.piccoH<16) t+=`<br>⚠ Tempi stretti: prima della mezza il lungo arriva solo a ${r.piccoH} km.`;
  if(r.wM&&r.piccoM<28) t+=`<br>⚠ Per la maratona il lungo arriva solo a ${r.piccoM} km: troppo poco.`;
  if(r.wH&&r.wM&&r.wM-r.wH<10) t+=`<br>⚠ Solo ${r.wM-r.wH} settimane tra mezza e maratona: i lunghi salgono in fretta.`;
  if(!inCorso&&c.start!==($('g_start').value||c.start)) t+=`<br>ⓘ Inizio spostato a lunedì ${dataIt(c.start,{day:'numeric',month:'long'})}.`;
  if(inCorso) t+=`<br>Le settimane prima restano com'erano.`;
  $('g_prev').innerHTML=t;
  $('g_togli').style.display=c.mara?'':'none';                    // il link serve solo se una data della maratona c'è
}
// Piano già iniziato: si ricalcola dal lunedì della revisione in poi; piano non ancora iniziato o assente: piano nuovo
function apriGeneratore(){
  const inCorso=!!S.plan&&oggiStr()>=S.plan[0].lun;
  S._genDa=inCorso?inizioRevisione():null;
  const c={...(S.cfg||cfgDefault())};
  if(inCorso){c.long0=Math.max(3,lungoMax(21)||c.long0);c.start=S._genDa;}
  apriSheet(1,S.plan?'Cambia gare o parametri':'Crea il piano',inCorso?`Il piano viene ricalcolato da ${dataIt(S._genDa,{weekday:'long',day:'numeric',month:'long'})}. Prima vedi le differenze.`:'Il piano viene calcolato da questi parametri.',
    formGenHTML(c,inCorso)+`<div class="btn-row"><button class="btn btn-pri" onclick="generaDaForm()">${S.plan?'Vedi le differenze':'Crea il piano'}</button><button class="btn btn-sec" onclick="chiudiSheet(1)">Annulla</button></div>`);
  anteprimaGen();
}
function generaDaForm(){
  const c=leggiGen(), inCorso=$('g_start').disabled;
  if(!S.plan){                                                     // primo piano: si crea subito
    S.cfg={...c,tail:c.start};S.plan=timbra(generaPiano(c),c.start,0);
    attivaStato();sincGare(S.cfg);accoda('p');salva();
    chiudiSheet(1);$('primo').style.display='none';toast(`Piano creato: ${S.plan.length} settimane`);vai('oggi');sincronizza();return;
  }
  const da=inCorso?S._genDa:c.start;
  const nuovo=inCorso?ricalcolaDa(c,da):timbra(generaPiano(c),c.start,0);
  mostraDifferenze(nuovo,{...c,start:inCorso?S.cfg.start:c.start,tail:da},{origine:'Cambio di gare o parametri',motivo:`PB ${c.pb}, lungo ${c.long0} km${c.half?', mezza '+dataIt(c.half,{day:'numeric',month:'short'}):''}${c.mara?', maratona '+dataIt(c.mara,{day:'numeric',month:'short'}):''}${c.foot>=0?', calcio il '+GG[c.foot].toLowerCase():''}`,daLun:inCorso?da:'0000-00-00'});
}

/* ═══ GARE ═══ */
const TIPI_GARA=['Obiettivo','Preparazione','Test'];
function gareHTML(){
  const oggi=oggiStr(), gare=[...S.gare].sort((a,b)=>!a.data?1:!b.data?-1:a.data<b.data?-1:1);
  let h=gare.map(g=>{
    const gg=g.data?giorniTra(oggi,g.data):null, futura=gg==null||gg>=0, km=+g.distKm||0;
    const ris=g.resSec||((g.data&&S.logs.find(l=>l.tipo==='Gara'&&l.data===g.data&&l.sec>0))||{}).sec||0;
    let corpo=`<div class="kv">`;
    if(g.objSec) corpo+=`<span>Obiettivo</span><b>${hms(g.objSec)}${km?' · '+secPasso(g.objSec/km)+'/km':''}</b>`;
    if(ris) corpo+=`<span>Risultato</span><b>${hms(ris)}${km?' · '+secPasso(ris/km)+'/km':''}${g.objSec?` <span class="${ris<=g.objSec?'d-ok':'d-warn'}">(${ris<=g.objSec?'−':'+'}${hms(Math.abs(ris-g.objSec))})</span>`:''}</b>`;
    if(futura&&km&&!ris){
      const p=proiezione(km), rec=migliori(Math.min(km,10)), serve=km>30?30:km>15?18:Math.round(km*0.8), fatto=lungoMax(42);
      corpo+=`<span>Stima dalle prestazioni recenti</span><b>${hms(p.sec)} · prudente ${hms(p.prud)}</b>`;
      if(rec.all&&g.objSec) corpo+=`<span>Miglior ${Math.min(km,10)} km in allenamento</span><b>${secPasso(rec.all.sec/Math.min(km,10))}/km <small class="muted">(obiettivo ${secPasso(g.objSec/km)})</small></b>`;
      corpo+=`</div><p class="muted" style="margin-top:6px">Stima con la formula di Riegel da: ${esc(p.rif.et)}. Con tre uscite a settimana conta di più quella prudente.</p>`;
      // coerenza con il piano: la gara c'è? il lungo previsto prima della gara basta?
      const inPiano=(S.plan||[]).find(wk=>wk.sessions.some(s=>s.type==='race'&&(S.over[s.id]||s.date)===g.data));
      const lungoPrev=Math.max(0,...(S.plan||[]).filter(wk=>wk.lun<lunediDi(g.data)).flatMap(wk=>wk.sessions).filter(s=>CORSA.includes(s.type)&&s.type!=='race').map(s=>s.km||0));
      corpo+=inPiano?`<div class="kv"><span>Nel piano</span><b>settimana ${inPiano.w}</b><span>Lungo più lungo previsto prima</span><b class="${lungoPrev>=serve?'d-ok':'d-warn'}">${num1(lungoPrev)} km (servono ${serve})</b></div>`
        :`<div class="kv"><span>Nel piano</span><b class="d-warn">no</b></div><p class="muted">Per prepararla: Revisione → Cambia gare o parametri.</p>`;
      corpo+=`<div class="lbl" style="margin:10px 0 0">Lungo più lungo fatto (6 settimane)<small>${num1(fatto)} di ${serve} km</small></div><div class="barra"><i style="width:${Math.min(100,Math.round(fatto/serve*100))}%"></i></div><div>`;
    }
    corpo+='</div>';
    return `<div class="card"><div class="gara-h"><div><div class="gara-n">${esc(g.nome)}</div>
        <div class="muted">${g.data?dataIt(g.data,{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'data da definire'}${km?' · '+num1(km)+' km':''} · ${esc(g.tipo||'Obiettivo')}</div></div>
        ${gg!=null?`<div class="gara-g"><b>${Math.abs(gg)>60&&gg>0?Math.round(gg/7):Math.abs(gg)}</b><span>${gg>=0?(gg>60?'settimane':'giorni'):'giorni fa'}</span></div>`:''}</div>
      ${corpo}
      <div class="sc-a"><button class="btn btn-sec sm" onclick="apriGara('${g.id}')">Modifica</button></div></div>`;
  }).join('')||'<div class="card vuoto">Nessuna gara in programma.</div>';
  h+=`<button class="btn btn-sec w100" style="margin-bottom:10px" onclick="apriGara('')">Aggiungi una gara</button>
    <div class="card"><div class="lbl">Calcolatore passo gara</div>
      <div class="fg2"><div class="fg"><label for="ca_km">Distanza</label><select id="ca_km" onchange="calcolaPasso()"><option value="10">10 km</option><option value="21.0975" selected>Mezza</option><option value="42.195">Maratona</option><option value="5">5 km</option></select></div>
      <div class="fg"><label for="ca_t">Tempo obiettivo</label><input type="text" id="ca_t" placeholder="1:40:00" value="1:40:00" oninput="calcolaPasso()"></div></div>
      <div id="ca_out"></div></div>`;
  return h;
}

    <div class="fg"><label for="ga_p">Passo obiettivo <small>m:ss</small></label><input type="text" id="ga_p" value="${g.objSec&&g.distKm?secPasso(g.objSec/g.distKm):''}" placeholder="4:44" oninput="garaPasso('p')"></div></div>
    <div class="fg"><label for="ga_r">Risultato ufficiale <small>h:mm:ss, dopo la gara</small></label><input type="text" id="ga_r" value="${t(g.resSec)}" placeholder="1:39:12"></div>
    ${g.auto?'<p class="muted" style="margin-bottom:10px">Questa gara viene dal piano: la data si cambia in Revisione → Cambia gare o parametri.</p>':''}
    <div class="btn-row"><button class="btn btn-pri" onclick="salvaGara()">Salva</button><button class="btn btn-sec" onclick="chiudiSheet(1)">Annulla</button></div>
    ${g.id&&!g.auto?`<button class="btn btn-red w100" style="margin-top:8px" onclick="if(confirm('Eliminare la gara?')){S.gare=S.gare.filter(x=>String(x.id)!==String(S.garaId));salva();chiudiSheet(1);disegna();}">Elimina gara</button>`:''}`);
}
// tempo e passo obiettivo si aggiornano a vicenda
function garaPasso(da){
  const km=parseFloat($('ga_k').value)||0;if(!km) return;
  if(da==='t'){const s=passoSec($('ga_o').value);$('ga_p').value=s?secPasso(s/km):'';}
  else{const p=passoSec($('ga_p').value);$('ga_o').value=p?hms(p*km):'';}
}
function salvaGara(){
  const nome=$('ga_n').value.trim();
  if(!nome){toast('Inserisci il nome','err');return;}
  const vecchia=S.gare.find(x=>String(x.id)===String(S.garaId));
  const g={...(vecchia||{}),id:S.garaId||nuovoId('g'),nome,data:vecchia&&vecchia.auto?vecchia.data:$('ga_d').value,distKm:parseFloat($('ga_k').value)||'',
    tipo:$('ga_tp').value,objSec:passoSec($('ga_o').value),resSec:passoSec($('ga_r').value)};
  if(vecchia) S.gare[S.gare.indexOf(vecchia)]=g; else S.gare.push(g);
  salva();chiudiSheet(1);disegna();toast('Gara salvata');
}
// le gare del piano (mezza/maratona) sono sincronizzate dal generatore: id fissi 'hm' e 'mar'
function sincGare(cfg){
  const Z=zone(cfg.pb), vecchie=Object.fromEntries(S.gare.map(g=>[g.id,g]));
  S.gare=S.gare.filter(g=>!g.auto&&g.id!==2&&g.id!==3&&!(g.id===1&&!g.data));   // via le automatiche e i segnaposto della v9
  for(const [id,data,km,passo,nome] of [['hm',cfg.half,21.1,Z.hm,'Mezza Maratona'],['mar',cfg.mara,42.2,Z.mp,'Maratona']]){
    if(!data) continue;
    const v=vecchie[id]||{};
    S.gare.push({id,auto:true,nome:v.nome||nome,data,distKm:km,tipo:v.tipo||'Obiettivo',resSec:v.data===data?v.resSec||0:0,objSec:v.objSec||Math.round(passoSec(passo)*(km>40?42.195:21.0975))});
  }
}
function calcolaPasso(){
  const km=parseFloat($('ca_km').value)||0, sec=passoSec($('ca_t').value), out=$('ca_out');
  if(!km||!sec){out.innerHTML='<p class="muted">Scrivi il tempo come ore:minuti:secondi, ad esempio 1:40:00.</p>';return;}
  const p=sec/km, tappe=[];
  for(let k=5;k<km-0.5;k+=5) tappe.push(k);
  if(km>40) tappe.push(21.0975);
  tappe.sort((a,b)=>a-b).push(km);
  out.innerHTML=`<div class="kv" style="margin-top:0"><span>Passo</span><b>${secPasso(p)} /km</b>${tappe.map(k=>`<span>${k===km?'Arrivo':k===21.0975?'Mezza':'Km '+k}</span><b>${hms(p*k)}</b>`).join('')}</div>`;
}

/* ═══════════════ 6. REGISTRA ALLENAMENTO + DETTAGLIO CORSA ═══════════════
   Un solo form per: registrazione da una seduta del piano ({key,data}), dal consiglio del giorno
   ({key,data,cons}), registrazione libera ({data,libero}) e modifica ({id}).
   Dati principali sempre visibili (data, ora, tipo, scarpe, km, tempo, sforzo); FC, fastidi e note
   stanno in "Altri dati". Lo stato delle scale e i dati importati da file stanno in S.form. */
function apriLog(o){
  o=o||{};
  const ex=o.id?S.logs.find(l=>l.id===o.id):null;                 // allenamento esistente → modifica
  let key=ex?(ex.sk||''):(o.key||'');
  // aperto dal "+" senza seduta: se oggi c'è una corsa o una partita ancora da fare, parte da quella
  if(!ex&&!key&&!o.libero){
    const c=(dateMap()[o.data||oggiStr()]||[]).find(e=>!e.done&&!e.skip&&(CORSA.includes(e.s.type)||e.s.type==='calcio'));
    if(c) key=c.key;
  }
  const ent=key?sedutaDi(key):null, data=ex?ex.data:(o.data||oggiStr());
  // dal consiglio del giorno si registra la seduta consigliata (km e tipo), collegata alla seduta in piano
  const s=ent?(o.cons?adatta(ent.s,data).s:ent.s):null;
  const tipo=ex?ex.tipo:s?tipoLogDi(s):'Facile';
  S.form={id:ex?ex.id:null,key,libero:!!o.libero,
    achille:ex?ex.dolore_achille:null, caviglia:ex?ex.dolore_caviglia:null, schiena:ex?ex.dolore_schiena:null,
    rpe:ex&&ex.rpe?+ex.rpe:null,
    imp:ex&&(ex.splits||ex.laps||ex.prof)?{splits:ex.splits||[],laps:ex.laps||[],prof:ex.prof||null,up:ex.disl||0,dn:ex.dislNeg||0,start:ex.start||null,fonte:ex.fonte,extId:ex.extId||null,hrMax:ex.fcMax||null}:null,
    pianoKm:s&&s.km||0, pianoPasso:s&&['easy','long','race'].includes(s.type)?s.pace:''};
  const sec=ex?+ex.sec||0:0, scarpe=S.shoes.filter(x=>!x.off||(ex&&ex.scarpa===x.id));
  const ultimaScarpa=ex?ex.scarpa||'':(([...S.logs].reverse().find(l=>l.scarpa&&eCorsa(l))||{}).scarpa||(scarpe[0]||{}).id||'');
  const fastidi=ex&&fastidioMax(ex)!=null;
  const h=`
    ${s&&!ex?`<div class="alert a-info" style="margin-bottom:12px"><b>${o.cons?'Consigliato':'In piano'}: ${esc(s.label)}</b>${esc(s.desc)}</div>`:''}
    <label class="btn btn-sec w100" style="margin-bottom:6px">Importa il file dell'attività<input type="file" id="f_file" accept=".fit,.gpx,.tcx,.gz,application/gpx+xml,application/vnd.garmin.tcx+xml,application/octet-stream,application/xml,text/xml" style="display:none" onchange="importaFile(this)"></label>
    <p class="muted" style="margin-bottom:12px;text-align:center">FIT (Garmin e altri orologi), GPX (Strava dal sito), TCX</p>
    <div id="f_imp"></div>
    <div class="fg2">
      <div class="fg"><label for="f_data">Data</label><input type="date" id="f_data" value="${data}"></div>
      <div class="fg"><label for="f_ora">Ora <small>facoltativa</small></label><input type="time" id="f_ora" value="${ex&&ex.ora||''}"></div>
    </div>
    <div class="fg2">
      <div class="fg"><label for="f_tipo">Tipo</label><select id="f_tipo" onchange="logTipo()">${TIPI_LOG.concat(TIPI_LOG.includes(tipo)?[]:[tipo]).map(t=>`<option${t===tipo?' selected':''}>${t}</option>`).join('')}</select></div>
      <div class="fg"><label for="f_scarpa">Scarpe</label><select id="f_scarpa"><option value="">—</option>${scarpe.map(x=>`<option value="${x.id}"${x.id===ultimaScarpa?' selected':''}>${esc(x.nome)}</option>`).join('')}</select></div>
    </div>
    <div class="fg2" id="f_boxKm">
      <div class="fg"><label for="f_km">Km</label><input type="number" inputmode="decimal" id="f_km" step="0.01" min="0" placeholder="0,0" value="${ex?ex.km||'':(s&&s.km)||''}" oninput="logPasso()"></div>
      <div class="fg"><span class="fl">Passo</span><div class="passo" id="f_passo">—</div></div>
    </div>
    <div class="fg"><span class="fl" id="f_lblTempo">Tempo</span>
      <div class="trow">
        <input type="number" inputmode="numeric" id="f_h" min="0" max="9" placeholder="0" value="${sec>=3600?Math.floor(sec/3600):''}" oninput="logPasso()" aria-label="ore"><span>h</span>
        <input type="number" inputmode="numeric" id="f_m" min="0" max="599" placeholder="00" value="${sec?Math.floor(sec%3600/60):''}" oninput="logPasso()" aria-label="minuti"><span>min</span>
        <input type="number" inputmode="numeric" id="f_s" min="0" max="59" placeholder="00" value="${sec?sec%60:''}" oninput="logPasso()" aria-label="secondi"><span>s</span>
      </div>
      ${S.form.pianoPasso&&!ex?`<button type="button" class="lnk" onclick="tempoDaPiano()">Usa il tempo previsto dal piano</button>`:''}
    </div>
    <span class="fl">Sforzo percepito <small>1 = passeggiata · 10 = massimo</small></span>${scalaHTML('rpe',S.form.rpe,1)}
    <details class="altri"${ex&&(ex.fc||fastidi||ex.note)?' open':''}><summary>Altri dati <small>FC, fastidi, note</small></summary>
      <div class="fg2">
        <div class="fg"><label for="f_fc">FC media</label><input type="number" inputmode="numeric" id="f_fc" min="60" max="220" placeholder="bpm" value="${ex&&ex.fc||''}"></div>
        <div class="fg"><label for="f_up">Dislivello + <small>m</small></label><input type="number" inputmode="numeric" id="f_up" min="0" placeholder="0" value="${ex&&ex.disl||''}"></div>
      </div>
      <button type="button" class="spunta${fastidi?' on':''}" id="f_tgF" onclick="togFastidi()" aria-pressed="${fastidi}"><i>${fastidi?'✓':''}</i>Ho avuto fastidi</button>
      <div id="f_fast" style="display:${fastidi?'block':'none'};margin-top:10px">
        <span class="fl">Achille <small>durante o subito dopo</small></span>${scalaHTML('achille',S.form.achille,0)}
        <span class="fl">Caviglia</span>${scalaHTML('caviglia',S.form.caviglia,0)}
        <span class="fl">Schiena</span>${scalaHTML('schiena',S.form.schiena,0)}
      </div>
      <div class="fg" style="margin-top:10px"><label for="f_note">Note</label><textarea id="f_note" placeholder="Sensazioni, meteo, fondo…">${ex?esc(ex.note||''):''}</textarea></div>
    </details>
    <div id="f_split"></div>
    <div class="btn-row" style="margin-top:12px"><button class="btn btn-pri" onclick="salvaLog()">Salva</button><button class="btn btn-sec" onclick="chiudiSheet(2)">Annulla</button></div>
    ${ex?`<button class="btn btn-red w100" style="margin-top:8px" onclick="eliminaLog('${ex.id}')">Elimina allenamento</button>`:''}`;
  apriSheet(2,ex?'Modifica allenamento':'Registra allenamento',dataIt(data,{weekday:'long',day:'numeric',month:'long'}),h);
  logTipo();logPasso();anteprimaSplit();
}
// calcio, forza e altro non hanno km: nasconde km e passo e chiede solo la durata
function logTipo(){
  const corsa=!NON_CORSA.includes($('f_tipo').value);
  $('f_boxKm').style.display=corsa?'':'none';
  $('f_lblTempo').textContent=corsa?'Tempo':$('f_tipo').value==='Calcio'?'Minuti giocati':'Durata';
}
function logPasso(){
  const km=parseFloat($('f_km').value)||0, sec=(+$('f_h').value||0)*3600+(+$('f_m').value||0)*60+(+$('f_s').value||0);
  $('f_passo').innerHTML=km>0&&sec>0?`${secPasso(sec/km)} <small>min/km</small>`:'—';
}
function tempoDaPiano(){
  const km=parseFloat($('f_km').value)||S.form.pianoKm, sec=Math.round(km*passoSec(S.form.pianoPasso));
  $('f_h').value=sec>=3600?Math.floor(sec/3600):'';$('f_m').value=Math.floor(sec%3600/60);$('f_s').value=sec%60;logPasso();
}
// interruttore "Ho avuto fastidi": spento = fastidi non compilati (non zero)
function togFastidi(){
  const box=$('f_fast'), on=box.style.display==='none';
  box.style.display=on?'block':'none';
  $('f_tgF').classList.toggle('on',on);$('f_tgF').firstChild.textContent=on?'✓':'';
  if(!on){for(const k of ['achille','caviglia','schiena']){S.form[k]=null;$('sc_'+k).outerHTML=scalaHTML(k,null,0);}}
}
function anteprimaSplit(){
  const im=S.form&&S.form.imp, el=$('f_split');
  if(!el) return;
  el.innerHTML=im&&im.splits&&im.splits.length?`<details class="altri"><summary>Intertempi dal file <small>${im.splits.length} tratti</small></summary>${tabellaSplit(im.splits,'km')}</details>`:'';
}

/* ── Import di un file nel form ── */
async function importaFile(inp){
  const file=inp.files&&inp.files[0];inp.value='';
  if(!file) return;
  const box=$('f_imp');box.innerHTML='<p class="muted">Leggo il file…</p>';
  let r;
  try{r=await leggiFile(file);}
  catch(e){box.innerHTML=`<div class="alert a-danger"><b>⚠ File non letto</b>${esc(e.message)}. Prova con il GPX della stessa attività, oppure inserisci i dati a mano.</div>`;return;}
  const d=new Date(r.start), data=fmtD(d), ora=pad(d.getHours())+':'+pad(d.getMinutes());
  // riempie il form
  $('f_data').value=data;$('f_ora').value=ora;
  $('f_km').value=(r.dist/1000).toFixed(2);
  $('f_h').value=r.sec>=3600?Math.floor(r.sec/3600):'';$('f_m').value=Math.floor(r.sec%3600/60);$('f_s').value=r.sec%60;
  if(r.hr) $('f_fc').value=r.hr;
  if(r.up) $('f_up').value=r.up;
  if(NON_CORSA.includes($('f_tipo').value)) $('f_tipo').value=r.sport?'Altro':'Facile';
  logTipo();logPasso();
  S.form.imp={splits:r.splits,laps:r.laps,prof:r.prof,up:r.up,dn:r.dn,start:new Date(r.start).toISOString(),fonte:r.fonte,extId:r.extId,hrMax:r.hrMax};
  anteprimaSplit();
  let h=`<div class="alert a-ok"><b>✓ Letto ${r.fonte.toUpperCase()}: ${num1(r.dist/1000)} km in ${hms(r.sec)}</b>${dataIt(data,{weekday:'long',day:'numeric',month:'long'})} alle ${ora}${r.up?` · dislivello +${r.up}/−${r.dn} m`:''}${r.hr?` · FC ${r.hr}`:''}${r.laps.length?` · ${r.laps.length} giri`:''}. Controlla tipo e sforzo, poi salva.</div>`;
  if(r.sport) h+=`<div class="alert a-warn"><b>⚡ Il file risulta di tipo "${esc(r.sport)}"</b>Se non era una corsa, scegli il tipo giusto.</div>`;
  // controllo doppioni: stesso file, stessa partenza, o stesso giorno con km e tempo quasi uguali
  const dop=trovaDoppione({id:S.form.id,extId:r.extId,data,start:r.start,km:r.dist/1000,sec:r.sec});
  if(dop){
    S.form.dop=dop.id;
    h+=`<div class="alert a-warn" id="f_dop"><b>⚡ Sembra già registrata</b>${dataIt(dop.data,{day:'numeric',month:'short'})} · ${esc(dop.tipo)}${dop.km?' · '+num1(dop.km)+' km':''}${dop.sec?' in '+hms(dop.sec):''}.
      <div class="sc-a"><button class="btn btn-pri sm" onclick="sceltaDoppione('unisci')">Aggiungi i dati del file a quella</button><button class="btn btn-sec sm" onclick="sceltaDoppione('sostituisci')">Sostituiscila</button><button class="btn btn-sec sm" onclick="sceltaDoppione('nuova')">Registra come nuova</button></div></div>`;
  }
  box.innerHTML=h;
}
// unisci = tiene tipo, sforzo, scarpe, fastidi e note della corsa esistente e prende dal file km, tempi e intertempi;
// sostituisci = sovrascrive la corsa esistente con quello che c'è ora nel form; nuova = ignora il doppione
function sceltaDoppione(c){
  const dop=S.logs.find(l=>l.id===S.form.dop);
  if(dop&&c!=='nuova'){
    S.form.id=dop.id;S.form.key=dop.sk||S.form.key;
    if(c==='unisci'){
      $('f_tipo').value=dop.tipo;if(dop.scarpa) $('f_scarpa').value=dop.scarpa;if(dop.note) $('f_note').value=dop.note;
      S.form.rpe=dop.rpe?+dop.rpe:S.form.rpe;$('sc_rpe').outerHTML=scalaHTML('rpe',S.form.rpe,1);
      for(const k of ['achille','caviglia','schiena']){S.form[k]=dop['dolore_'+k];}
      if(fastidioMax(dop)!=null&&$('f_fast').style.display==='none') togFastidi();
      for(const k of ['achille','caviglia','schiena']) $('sc_'+k).outerHTML=scalaHTML(k,S.form[k],0);
      logTipo();
    }
  }
  S.form.dop=null;
  $('f_dop').outerHTML=`<p class="muted" style="margin-bottom:10px">${c==='unisci'?'Unisco i dati alla corsa esistente: salva per confermare.':c==='sostituisci'?'La corsa esistente verrà sostituita: salva per confermare.':'Verrà registrata come corsa separata.'}</p>`;
}

function salvaLog(){
  const f=S.form, tipo=$('f_tipo').value, corsa=!NON_CORSA.includes(tipo), data=$('f_data').value;
  const km=corsa?Math.round((parseFloat($('f_km').value)||0)*100)/100:0;
  const sec=(+$('f_h').value||0)*3600+(+$('f_m').value||0)*60+(+$('f_s').value||0);
  if(!data){toast('Inserisci la data','err');return;}
  if(data>oggiStr()){toast('La data è nel futuro','err');return;}
  if(corsa&&!km){toast('Inserisci i km','err');return;}
  if(f.dop){toast('Scegli prima cosa fare con la corsa già registrata','err');return;}
  const vecchio=f.id?S.logs.find(l=>l.id===f.id):null;
  // inserimento a mano di una corsa che sembra già registrata: chiede conferma
  if(!vecchio&&!f.imp&&corsa){
    const dop=trovaDoppione({data,km,sec});
    if(dop&&!confirm(`Il ${dataIt(dop.data,{day:'numeric',month:'short'})} c'è già una corsa di ${num1(dop.km)} km in ${hms(dop.sec)}. Registrarla comunque?`)) return;
  }
  // collegamento alla seduta del piano: vale la seduta da cui si è partiti se è compatibile col tipo
  // scelto, altrimenti si cerca nel giorno una seduta compatibile ancora da fare
  const compat=e=>corsa?CORSA.includes(e.s.type):tipo==='Calcio'?e.s.type==='calcio':tipo==='Forza'?e.s.type==='gym':false;
  const diPartenza=f.key?sedutaDi(f.key):null;
  let sk='';
  if(diPartenza&&compat(diPartenza)) sk=f.key;
  else if(!f.libero){const cand=(dateMap()[data]||[]).find(e=>!e.done&&!e.skip&&compat(e));if(cand) sk=cand.key;}
  if(vecchio&&vecchio.sk&&vecchio.sk!==sk) delete S.done[vecchio.sk];   // modifica che scollega: la vecchia seduta torna da fare
  const fast=$('f_fast').style.display!=='none';
  const im=corsa?f.imp:null;
  const log={...(vecchio||{}),id:f.id||nuovoId('l'),data,ora:$('f_ora').value||'',tipo,km:km||'',sec,ritmo:km&&sec?secPasso(sec/km):'',durata:sec?Math.round(sec/60):'',
    rpe:f.rpe||'',fc:+$('f_fc').value||'',scarpa:$('f_scarpa').value||'',
    dolore_achille:fast?f.achille:null,dolore_caviglia:fast?f.caviglia:null,dolore_schiena:fast?f.schiena:null,
    note:$('f_note').value.trim(),sk,
    disl:corsa?+$('f_up').value||0:0, dislNeg:im?im.dn||0:(vecchio&&vecchio.dislNeg)||0,
    splits:im?im.splits:(vecchio&&vecchio.splits)||null, laps:im?im.laps:(vecchio&&vecchio.laps)||null, prof:im?im.prof:(vecchio&&vecchio.prof)||null,
    start:im?im.start:(vecchio&&vecchio.start)||null, fonte:im?im.fonte:(vecchio&&vecchio.fonte)||'manuale', extId:im?im.extId:(vecchio&&vecchio.extId)||null,
    fcMax:im?im.hrMax:(vecchio&&vecchio.fcMax)||null, ts:vecchio?vecchio.ts:Date.now()};
  if(!corsa){log.splits=log.laps=log.prof=null;}
  // scarpe: avviso quando questa corsa fa superare la soglia del paio
  const sc=S.shoes.find(x=>x.id===log.scarpa);
  const kmScarpa=()=>sc?(+sc.km0||0)+S.logs.filter(l=>l.scarpa===sc.id&&eCorsa(l)).reduce((t,l)=>t+ +l.km,0):0;
  const primaS=kmScarpa();
  if(vecchio) S.logs[S.logs.indexOf(vecchio)]=log; else S.logs.push(log);
  if(sk){S.done[sk]=true;delete S.skip[sk];accoda('p');}
  accoda('r:'+log.id);
  salva();chiudiSheet(2);aggiorna();
  const dopoS=kmScarpa(), mx=fastidioMax(log);
  if(sc&&primaS<sc.soglia&&dopoS>=sc.soglia) toast(`${sc.nome}: superati i ${sc.soglia} km. È ora di pensare al cambio`,'err');
  else toast(mx>=5?'Salvato. Fastidio 5 o più: la prossima seduta avrà un consiglio prudente':'Allenamento salvato',mx>=5?'err':'');
  sincronizza();
}
function eliminaLog(id){
  if(!confirm('Eliminare questo allenamento?')) return;
  const l=S.logs.find(x=>x.id===id);
  if(!l) return;
  if(l.sk){delete S.done[l.sk];accoda('p');}                       // la seduta collegata torna "da fare"
  S.logs=S.logs.filter(x=>x.id!==id);
  S.pend=S.pend.filter(x=>x!=='r:'+id);accoda('d:'+id);            // sul foglio la riga va cancellata
  salva();chiudiSheet(2);aggiorna();toast('Allenamento eliminato');sincronizza();
}

/* ── Dettaglio di una corsa: numeri, seduta prevista, intertempi, grafico, fastidi, note ── */
function apriCorsa(id){
  const l=S.logs.find(x=>x.id===id);if(!l) return;
  S.corsa=id;S.giorno=null;
  const sc=S.shoes.find(x=>x.id===l.scarpa), ent=l.sk?sedutaDi(l.sk):null, corsa=eCorsa(l);
  const FONTI={manuale:'inserita a mano',gpx:'da file GPX',fit:'da file FIT',tcx:'da file TCX'};
  let h=`<div class="cifre">
      ${corsa?`<div><b>${num1(l.km)}</b><span>km</span></div>`:''}
      <div><b>${l.sec?hms(l.sec):'—'}</b><span>${corsa?'tempo':'durata'}</span></div>
      ${l.ritmo?`<div><b>${l.ritmo}</b><span>min/km</span></div>`:''}
      <div><b>${l.rpe||'—'}</b><span>sforzo</span></div></div>
    <div class="kv">
      ${l.fc?`<span>FC media${l.fcMax?' / massima':''}</span><b>${l.fc}${l.fcMax?' / '+l.fcMax:''} bpm</b>`:''}
      ${l.disl||l.dislNeg?`<span>Dislivello</span><b>+${l.disl||0} / −${l.dislNeg||0} m</b>`:''}
      ${sc?`<span>Scarpe</span><b>${esc(sc.nome)}</b>`:''}
      ${fastidioMax(l)!=null?`<span>Fastidi</span><b>achille ${l.dolore_achille??'—'} · caviglia ${l.dolore_caviglia??'—'} · schiena ${l.dolore_schiena??'—'}</b>`:''}
    </div>
    ${ent?`<div class="sc t-${ent.s.type}" style="margin-top:12px"><div class="sc-t">In piano: ${esc(ent.s.label)}</div><div class="sc-d">${esc(ent.s.desc)}</div>${pvrHTML(ent)}</div>`:''}
    ${l.note?`<p class="txt" style="margin-top:10px">${esc(l.note)}</p>`:''}`;
  const sp=l.splits||[], lp=l.laps||[];
  if(sp.length||lp.length){
    const vista=S.vistaSplit==='giri'&&lp.length?'giri':'km';
    h+=`<div class="lbl" style="margin-top:14px">Intertempi${lp.length&&sp.length?`<span class="seg mini"><button class="${vista==='km'?'on':''}" onclick="S.vistaSplit='km';apriCorsa('${id}')">per km</button><button class="${vista==='giri'?'on':''}" onclick="S.vistaSplit='giri';apriCorsa('${id}')">per giro</button></span>`:''}</div>`;
    h+=tabellaSplit(vista==='giri'?lp:sp,vista);
    if(vista==='km'&&sp.length>=3) h+=graficoSplit(l);
  }else if(corsa) h+=`<p class="muted" style="margin-top:12px">Intertempi non disponibili: importa il file dell'attività per vederli (Modifica → Importa il file).</p>`;
  h+=`<div class="btn-row" style="margin-top:14px"><button class="btn btn-sec" onclick="apriLog({id:'${id}'})">Modifica</button></div>`;
  apriSheet(1,`${l.tipo} · ${dataIt(l.data,{weekday:'short',day:'numeric',month:'short'})}`,[l.ora?'ore '+l.ora:'',FONTI[l.fonte]||''].filter(Boolean).join(' · '),h);
  S.corsa=id;
}
// tabella degli intertempi: evidenzia il tratto più veloce e il più lento, scarto dal passo medio
function tabellaSplit(sp,vista){
  const pas=sp.map(x=>x.d>0?x.t/(x.d/1000):0), tot=sp.reduce((s,x)=>s+x.t,0), dist=sp.reduce((s,x)=>s+x.d,0), media=dist?tot/(dist/1000):0;
  const validi=pas.map((p,i)=>sp[i].d>=500?p:null).filter(p=>p!=null);
  const best=validi.length>2?Math.min(...validi):null, worst=validi.length>2?Math.max(...validi):null;
  const conHr=sp.some(x=>x.hr), conUp=sp.some(x=>x.up||x.dn);
  let cum=0;
  return `<div class="tblw"><table class="tbl split"><tr><th>${vista==='giri'?'Giro':'Km'}</th>${vista==='giri'?'<th>Dist.</th>':''}<th>Tempo</th><th>Passo</th><th>±</th>${conUp?'<th>Disl.</th>':''}${conHr?'<th>FC</th>':''}</tr>
    ${sp.map((x,i)=>{
      cum+=x.d;const p=pas[i], dv=Math.round(p-media), cl=p===best&&x.d>=500?'best':p===worst&&x.d>=500?'worst':'';
      const nome=vista==='giri'?i+1:(x.d===1000?Math.round(cum/1000):num1(cum/1000));
      return `<tr class="${cl}"><td>${nome}${cl==='best'?' <small>più veloce</small>':cl==='worst'?' <small>più lento</small>':''}</td>${vista==='giri'?`<td>${x.d>=1000?num1(x.d/1000)+' km':x.d+' m'}</td>`:''}<td>${hms(x.t)}</td><td>${p?secPasso(p):'—'}</td><td>${dv>0?'+':dv<0?'−':''}${Math.abs(dv)}"</td>${conUp?`<td>${x.up!=null?'+'+x.up+(x.dn?' −'+x.dn:''):'—'}</td>`:''}${conHr?`<td>${x.hr||'—'}</td>`:''}</tr>`;
    }).join('')}</table></div><p class="muted">± = scarto dal passo medio (${secPasso(media)}/km): negativo = più veloce.</p>`;
}
// grafico: passo per km (in alto = più veloce) con la media; sotto, in un riquadro separato, il profilo altimetrico
function graficoSplit(l){
  const sp=l.splits, W=440, pl=38, pr=10, iw=W-pl-pr, H1=150, pt=12, ih=H1-pt-22;
  const dist=sp.reduce((s,x)=>s+x.d,0), xs=[];let c=0;
  for(const x of sp){xs.push((c+x.d/2)/dist);c+=x.d;}
  const pas=sp.map(x=>x.t/(x.d/1000)), media=sp.reduce((s,x)=>s+x.t,0)/(dist/1000);
  const lo=Math.min(...pas)-6, hi=Math.max(...pas)+6, X=f=>pl+f*iw, Y=p=>pt+(p-lo)/(hi-lo)*ih, tick=hi-lo>120?30:hi-lo>40?15:5;
  let g='';
  for(let v=Math.ceil(lo/tick)*tick;v<=hi;v+=tick) g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${secPasso(v)}</text>`;
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(media)}" y2="${Y(media)}" stroke="var(--t3)" stroke-dasharray="4 4"/><text x="${W-pr}" y="${Y(media)-5}" text-anchor="end">media ${secPasso(media)}</text>`;
  g+=`<polyline points="${pas.map((p,i)=>X(xs[i]).toFixed(1)+','+Y(p).toFixed(1)).join(' ')}" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linejoin="round"/>`;
  pas.forEach((p,i)=>{
    g+=`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(p).toFixed(1)}" r="4" fill="var(--c1)" stroke="var(--surface)" stroke-width="2"/>`;
    g+=`<rect x="${(X(xs[i])-iw/sp.length/2).toFixed(1)}" y="${pt}" width="${(iw/sp.length).toFixed(1)}" height="${ih}" fill="transparent" style="cursor:pointer" onclick="grOut('goSplit',this)" data-o="${esc(`Km ${i+1}: ${secPasso(p)}/km${sp[i].up?' · +'+sp[i].up+' m':''}${sp[i].hr?' · FC '+sp[i].hr:''}`)}"/>`;
  });
  const kmTot=dist/1000, passoKm=kmTot>20?5:kmTot>8?2:1;
  for(let k=passoKm;k<kmTot;k+=passoKm) g+=`<text x="${X(k/kmTot)}" y="${H1-6}" text-anchor="middle">${k}</text>`;
  let h=`<div class="gr" style="margin-top:12px"><div class="lbl">Passo per km<small>in alto = più veloce</small></div><svg viewBox="0 0 ${W} ${H1}" role="img" aria-label="Passo di ogni chilometro">${g}</svg>`;
  if(l.prof&&l.prof.length>2){
    const pr2=l.prof, H2=80, mn=Math.min(...pr2), mx=Math.max(...pr2), rng=Math.max(10,mx-mn), Y2=e=>8+(1-(e-mn)/rng)*(H2-26);
    const fx=i=>X(Math.min(1,(i+1)*200/dist));
    const pts=pr2.map((e,i)=>fx(i).toFixed(1)+','+Y2(e).toFixed(1)).join(' ');
    h+=`<div class="lbl" style="margin:8px 0 2px">Quota<small>${Math.round(mn)}–${Math.round(mx)} m</small></div>
      <svg viewBox="0 0 ${W} ${H2}" role="img" aria-label="Profilo altimetrico"><line x1="${pl}" x2="${W-pr}" y1="${H2-18}" y2="${H2-18}" stroke="var(--axis)"/>
      <polygon points="${fx(0)},${H2-18} ${pts} ${fx(pr2.length-1)},${H2-18}" fill="var(--t3)" opacity=".25"/><polyline points="${pts}" fill="none" stroke="var(--t2)" stroke-width="1.5"/>
      <text x="${pl-6}" y="${Y2(mx)+4}" text-anchor="end">${Math.round(mx)}</text><text x="${pl-6}" y="${Y2(mn)+4}" text-anchor="end">${Math.round(mn)}</text></svg>`;
  }
  return h+`<div class="gr-out" id="goSplit">Tocca un km per il dettaglio.</div></div>`;
}

/* ═══════════════ 6b. IMPORT DI FILE: FIT, GPX, TCX (anche compressi .gz) ═══════════════
   Tutto avviene nel telefono: il file non viene inviato da nessuna parte.

   Dove si prendono i file
   • Garmin (FIT): Garmin Connect da browser → attività → ingranaggio → "Esporta originale" (zip con il .fit),
     oppure il file nella cartella GARMIN/Activity dell'orologio collegato via cavo.
   • Strava (GPX): dal sito, attività → ⋯ → "Esporta GPX". L'app Strava non esporta file.
     Con "Esporta originale" Strava dà il file com'è stato registrato (FIT se viene da un orologio).
   • TCX: alcune app e vecchi export.

   Risultato comune di leggiFile(): {fonte, start (ms), dist (m), sec (tempo in movimento), up, dn (m),
   hr, hrMax, splits:[{d,t,up,dn,hr}] per km, laps:[...] giri dell'orologio, prof:[quota ogni 200 m], extId, sport} */

async function leggiFile(file){
  let buf=await file.arrayBuffer(), b=new Uint8Array(buf);
  // compresso gzip (export completi di Strava: .fit.gz, .gpx.gz): lo decomprime il browser
  if(b[0]===0x1f&&b[1]===0x8b){
    if(typeof DecompressionStream==='undefined') throw new Error('questo browser non apre i file .gz: decomprimilo prima');
    buf=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    b=new Uint8Array(buf);
  }
  let r;
  if(b.length>12&&String.fromCharCode(b[8],b[9],b[10],b[11])==='.FIT') r=leggiFIT(buf);
  else{
    const txt=new TextDecoder('utf-8').decode(b);
    if(/<TrainingCenterDatabase/i.test(txt)) r=leggiXML(txt,'tcx');
    else if(/<gpx[\s>]/i.test(txt)) r=leggiXML(txt,'gpx');
    else throw new Error('formato non riconosciuto: servono file FIT, GPX o TCX');
  }
  return elaboraTraccia(r);
}

/* ── FIT: formato binario di Garmin (e di quasi tutti gli orologi) ──
   Il file è una sequenza di messaggi. Un messaggio "definizione" descrive i campi (numero, dimensione,
   tipo) di un tipo di messaggio locale; i messaggi "dati" che seguono usano quella definizione.
   Leggo solo i messaggi che servono: file_id (0), session (18), lap (19), record (20). */
function leggiFIT(buf){
  const v=new DataView(buf), n=buf.byteLength, hs=v.getUint8(0);
  const fine=Math.min(n,hs+v.getUint32(4,true)), EPOCA=631065600;     // i tempi FIT contano dal 31/12/1989
  const DIM=[1,1,1,2,2,4,4,1,4,8,1,2,4,1,8,8,8];                      // byte per tipo base (indice = tipo & 0x1F)
  const NON_VALIDO=[0xFF,0x7F,0xFF,0x7FFF,0xFFFF,0x7FFFFFFF,0xFFFFFFFF,null,null,null,0,0,0,null];
  const defs={}, out={file:null,sess:[],laps:[],rec:[]};
  let p=hs, ultimoTs=0;
  // legge i campi di un messaggio dati secondo la sua definizione (solo il primo valore se è un elenco)
  const leggiCampi=def=>{
    const m={};
    for(const c of def.campi){
      const bt=c.bt&0x1F, sz=DIM[bt]||1;
      if(c.size>=sz&&p+sz<=n&&bt!==7&&bt<14){
        let x;
        switch(bt){
          case 0:case 2:case 10:case 13: x=v.getUint8(p);break;
          case 1: x=v.getInt8(p);break;
          case 3: x=v.getInt16(p,def.le);break;
          case 4:case 11: x=v.getUint16(p,def.le);break;
          case 5: x=v.getInt32(p,def.le);break;
          case 6:case 12: x=v.getUint32(p,def.le);break;
          case 8: x=v.getFloat32(p,def.le);break;
          case 9: x=v.getFloat64(p,def.le);break;
        }
        if(x!==NON_VALIDO[bt]&&!(bt>=8&&bt<=9&&isNaN(x))) m[c.num]=x;
      }
      p+=c.size;
    }
    p+=def.dev;                                                      // campi "developer": saltati
    return m;
  };
  const smista=(glob,m)=>{
    if(m[253]!=null) ultimoTs=m[253];
    if(glob===0) out.file=m;
    else if(glob===18) out.sess.push(m);
    else if(glob===19) out.laps.push(m);
    else if(glob===20) out.rec.push(m);
  };
  while(p<fine){
    const h=v.getUint8(p++);
    if(h&0x80){                                                      // intestazione compressa: tempo relativo all'ultimo
      const def=defs[(h>>5)&3];if(!def) throw new Error('file FIT danneggiato');
      const off=h&0x1F;let ts=(ultimoTs&~0x1F)+off;if(off<(ultimoTs&0x1F)) ts+=0x20;
      const m=leggiCampi(def);m[253]=ts;smista(def.glob,m);continue;
    }
    const lt=h&0x0F;
    if(h&0x40){                                                      // definizione
      p++;const le=v.getUint8(p++)===0, glob=v.getUint16(p,le);p+=2;
      const nf=v.getUint8(p++), campi=[];
      for(let i=0;i<nf;i++){campi.push({num:v.getUint8(p),size:v.getUint8(p+1),bt:v.getUint8(p+2)});p+=3;}
      let dev=0;
      if(h&0x20){const nd=v.getUint8(p++);for(let i=0;i<nd;i++){dev+=v.getUint8(p+1);p+=3;}}
      defs[lt]={glob,le,campi,dev};continue;
    }
    const def=defs[lt];if(!def) throw new Error('file FIT danneggiato');
    smista(def.glob,leggiCampi(def));
  }
  if(!out.rec.length&&!out.sess.length) throw new Error('nessun dato di attività nel file');
  const SEMI=180/2147483648, ms=ts=>(ts+EPOCA)*1000;
  const pts=out.rec.filter(r=>r[253]!=null).map(r=>({t:ms(r[253]),lat:r[0]!=null?r[0]*SEMI:NaN,lon:r[1]!=null?r[1]*SEMI:NaN,
    ele:r[78]!=null?r[78]/5-500:r[2]!=null?r[2]/5-500:NaN,hr:r[3]!=null?r[3]:NaN,d:r[5]!=null?r[5]/100:null}));
  const s=out.sess[0]||null, f=out.file||{};
  const SPORT={0:'generico',1:'corsa',2:'bici',5:'nuoto',11:'camminata',17:'escursione'};
  return {fonte:'fit',pts,
    laps:out.laps.map(l=>({d:(l[9]||0)/100,t:(l[8]!=null?l[8]:l[7]||0)/1000,hr:l[15]||null,up:l[21]!=null?l[21]:null,dn:l[22]!=null?l[22]:null})),
    tot:s?{dist:s[9]!=null?s[9]/100:null,sec:s[8]!=null?s[8]/1000:s[7]!=null?s[7]/1000:null,up:s[22]!=null?s[22]:null,dn:s[23]!=null?s[23]:null,
      hr:s[16]||null,hrMax:s[17]||null,start:s[2]!=null?ms(s[2]):null}:null,
    sport:s&&s[5]!=null?(SPORT[s[5]]||'altro'):null,
    extId:f[3]!=null&&f[4]!=null?`fit:${f[3]}:${f[4]}`:null};
}

/* ── GPX e TCX: XML, letti con il parser del browser ── */
function leggiXML(txt,tipo){
  const doc=new DOMParser().parseFromString(txt,'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('file '+tipo.toUpperCase()+' non leggibile');
  const tutti=(el,nome)=>[...el.getElementsByTagNameNS('*',nome)];
  const figlio=(el,nome)=>el?[...el.children].find(c=>c.localName===nome)||null:null;
  const numero=el=>el?parseFloat(el.textContent):NaN;
  if(tipo==='gpx'){
    const pts=tutti(doc,'trkpt').map(p=>{
      const hr=tutti(p,'hr')[0];
      return {t:Date.parse((figlio(p,'time')||{}).textContent),lat:+p.getAttribute('lat'),lon:+p.getAttribute('lon'),ele:numero(figlio(p,'ele')),hr:hr?parseFloat(hr.textContent):NaN,d:null};
    }).filter(p=>!isNaN(p.t)&&!isNaN(p.lat));
    const tipoTrk=(tutti(doc,'type')[0]||{}).textContent||'';
    return {fonte:'gpx',pts,laps:[],tot:null,sport:/run/i.test(tipoTrk)||!tipoTrk?null:tipoTrk.toLowerCase(),extId:null};
  }
  const act=tutti(doc,'Activity')[0];
  if(!act) throw new Error('nessuna attività nel file TCX');
  const pts=tutti(act,'Trackpoint').map(tp=>{
    const pos=figlio(tp,'Position');
    return {t:Date.parse((figlio(tp,'Time')||{}).textContent),lat:numero(figlio(pos,'LatitudeDegrees')),lon:numero(figlio(pos,'LongitudeDegrees')),
      ele:numero(figlio(tp,'AltitudeMeters')),hr:numero(figlio(figlio(tp,'HeartRateBpm'),'Value')),d:figlio(tp,'DistanceMeters')?numero(figlio(tp,'DistanceMeters')):null};
  }).filter(p=>!isNaN(p.t));
  const laps=tutti(act,'Lap').map(L=>({d:numero(figlio(L,'DistanceMeters'))||0,t:numero(figlio(L,'TotalTimeSeconds'))||0,hr:numero(figlio(figlio(L,'AverageHeartRateBpm'),'Value'))||null,up:null,dn:null}));
  const sd=laps.reduce((s,l)=>s+l.d,0), st=laps.reduce((s,l)=>s+l.t,0), hrT=laps.filter(l=>l.hr).reduce((s,l)=>s+l.t,0);
  const sport=act.getAttribute('Sport')||'';
  return {fonte:'tcx',pts,laps,tot:sd&&st?{dist:sd,sec:st,hr:hrT?Math.round(laps.reduce((s,l)=>s+(l.hr||0)*l.t,0)/hrT):null,start:Date.parse((figlio(act,'Id')||{}).textContent)||null}:null,
    sport:/run/i.test(sport)?null:sport.toLowerCase()||null,extId:null};
}

/* ── Elaborazione comune: tempo in movimento, intertempi per km, dislivello, profilo ── */
function elaboraTraccia(r){
  const pts=r.pts, rad=x=>x*Math.PI/180;
  const tratto=(a,b)=>{                                              // distanza tra due punti: dal dispositivo se c'è, altrimenti GPS
    if(a.d!=null&&b.d!=null) return b.d-a.d;
    if(isNaN(a.lat)||isNaN(b.lat)) return NaN;
    const q=Math.sin(rad(b.lat-a.lat)/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(rad(b.lon-a.lon)/2)**2;
    return 2*6371000*Math.asin(Math.sqrt(q));
  };
  let dist=0,mov=0,up=0,dn=0,eleRif=null,hrS=0,hrT=0,hrMax=0,kmSucc=1000,tUlt=0,profSucc=200,ultimaEle=NaN;
  let seg={up:0,dn:0,hrS:0,hrT:0};
  const splits=[], prof=[];
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],dt=(b.t-a.t)/1000;
    if(!isNaN(b.ele)){                                               // dislivello con soglia di 2 m: filtra il rumore della quota
      ultimaEle=b.ele;
      if(eleRif==null) eleRif=b.ele;
      else if(b.ele-eleRif>=2){up+=b.ele-eleRif;seg.up+=b.ele-eleRif;eleRif=b.ele;}
      else if(eleRif-b.ele>=2){dn+=eleRif-b.ele;seg.dn+=eleRif-b.ele;eleRif=b.ele;}
    }
    if(!(dt>0)) continue;
    const dd=tratto(a,b);
    if(!(dd>=0)||dd/dt<0.6) continue;                                // fermo o in pausa (sotto 0,6 m/s): non conta
    if(!isNaN(b.hr)){hrS+=b.hr*dt;hrT+=dt;seg.hrS+=b.hr*dt;seg.hrT+=dt;hrMax=Math.max(hrMax,b.hr);}
    while(dist+dd>=kmSucc){                                          // passato un km: intertempo per interpolazione
      const tKm=mov+dt*(kmSucc-dist)/dd;
      splits.push({d:1000,t:Math.round(tKm-tUlt),up:Math.round(seg.up),dn:Math.round(seg.dn),hr:seg.hrT?Math.round(seg.hrS/seg.hrT):null});
      tUlt=tKm;kmSucc+=1000;seg={up:0,dn:0,hrS:0,hrT:0};
    }
    while(dist+dd>=profSucc){if(!isNaN(ultimaEle)) prof.push(Math.round(ultimaEle));profSucc+=200;}
    dist+=dd;mov+=dt;
  }
  const resto=dist-(kmSucc-1000);
  if(resto>=100) splits.push({d:Math.round(resto),t:Math.round(mov-tUlt),up:Math.round(seg.up),dn:Math.round(seg.dn),hr:seg.hrT?Math.round(seg.hrS/seg.hrT):null});
  const T=r.tot||{};
  // i totali calcolati dall'orologio (FIT, TCX) sono più affidabili di quelli ricostruiti dalla traccia
  const res={fonte:r.fonte,sport:r.sport,
    start:T.start||(pts[0]&&pts[0].t)||null,
    dist:T.dist||dist, sec:Math.round(T.sec||mov),
    up:Math.round(T.up!=null?T.up:up), dn:Math.round(T.dn!=null?T.dn:dn),
    hr:T.hr||(hrT?Math.round(hrS/hrT):null), hrMax:T.hrMax||(hrMax||null),
    splits, prof:prof.length>2?prof:null, laps:[]};
  // giri dell'orologio: utili per le ripetute. Se sono tutti da 1 km (giro automatico) duplicano gli intertempi.
  const giri=(r.laps||[]).filter(l=>l.d>0&&l.t>0);
  if(giri.length>=2&&!giri.slice(0,-1).every(l=>Math.abs(l.d-1000)<=25)) res.laps=giri.map(l=>({d:Math.round(l.d),t:Math.round(l.t),hr:l.hr?Math.round(l.hr):null,up:l.up,dn:l.dn}));
  if(!(res.dist>=200)||!(res.sec>0)) throw new Error('attività troppo corta o senza tempi');
  res.extId=r.extId||('trk:'+new Date(res.start).toISOString().slice(0,16)+':'+Math.round(res.dist/10));
  return res;
}

// Corsa già registrata che coincide con un candidato (import o inserimento a mano), oppure null.
// Stesso file (extId), stessa partenza entro 2 minuti, oppure stesso giorno con km e tempo entro il 2%.
function trovaDoppione(c){
  return S.logs.find(l=>{
    if(l.id===c.id) return false;
    if(c.extId&&l.extId===c.extId) return true;
    if(l.data!==c.data) return false;
    if(c.start&&l.start&&Math.abs(Date.parse(l.start)-c.start)<=120000) return true;
    return eCorsa(l)&&c.km>0&&Math.abs(l.km-c.km)<=Math.max(0.1,c.km*0.02)&&c.sec>0&&l.sec>0&&Math.abs(l.sec-c.sec)<=Math.max(30,c.sec*0.02);
  })||null;
}

/* ═══════════════ 7. ANALISI: settimane, progressi, corse, fastidi ═══════════════
   Regole dei grafici: una sola scala per grafico (due misure diverse = due riquadri),
   griglia sottile, colori di serie verificati per daltonismo, legenda con 2+ serie,
   dettaglio al tocco nella riga sotto il grafico e tabella con gli stessi numeri.
   Niente metriche che l'app non può misurare bene (VO2max, "fitness", soglie stimate):
   solo km, tempi, sforzo indicato da te e fastidi. */

// tetto "pulito" dell'asse Y (0, 10, 20… oppure 0, 5, 10…)
function assePulito(max,passi){
  const grezzo=max/passi, p=Math.pow(10,Math.floor(Math.log10(grezzo))), n=grezzo/p;
  const step=(n<=1?1:n<=2?2:n<=5?5:10)*p;
  return {step,max:Math.ceil(max/step)*step};
}
// tocco su un elemento del grafico → scrive il dettaglio nella riga sotto
function grOut(id,el){$(id).textContent=el.getAttribute('data-o');}

// grafico a barre per settimana con un trattino opzionale (piano). Usato per km e per carico percepito.
function barreSett(id,titolo,sotto,sett,val,rif,fmt,legenda){
  const W=440,H=180,pl=34,pr=6,pt=12,pb=24,iw=W-pl-pr,ih=H-pt-pb,n=sett.length,slot=iw/n,bw=Math.min(24,slot-9);
  const ax=assePulito(Math.max(1,...sett.map(d=>Math.max(val(d),rif?rif(d)||0:0))),4), y=v=>pt+ih-(v/ax.max)*ih;
  let g='';
  for(let v=0;v<=ax.max+1e-9;v+=ax.step) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--${v===0?'axis':'grid'})"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  sett.forEach((d,i)=>{
    const cx=pl+slot*i+slot/2, x=cx-bw/2, v=val(d), top=y(v), r=Math.min(4,pt+ih-top);
    if(v>0) g+=`<path d="M${x},${pt+ih}V${top+r}a${r},${r} 0 0 1 ${r},${-r}H${x+bw-r}a${r},${r} 0 0 1 ${r},${r}V${pt+ih}Z" fill="var(--c1)"/>`;
    if(rif&&rif(d)) g+=`<line x1="${x-3}" x2="${x+bw+3}" y1="${y(rif(d))}" y2="${y(rif(d))}" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/>`;
    if(i%2===n%2) g+=`<text x="${cx}" y="${H-7}" text-anchor="middle">${dataIt(d.lun,{day:'numeric',month:'numeric'})}</text>`;
    g+=`<rect x="${pl+slot*i}" y="${pt}" width="${slot}" height="${ih}" fill="transparent" style="cursor:pointer" tabindex="0" onclick="grOut('${id}',this)" onfocus="grOut('${id}',this)" data-o="${esc(fmt(d))}"/>`;
  });
  return `<div class="gr"><div class="lbl">${titolo}<small>${sotto}</small></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(titolo)} per settimana">${g}</svg>
    ${legenda?`<div class="gr-leg">${legenda}</div>`:''}
    <div class="gr-out" id="${id}">${esc(fmt(sett[n-1]))}</div></div>`;
}

function disAnalisi(el){
  const t=S.tab.analisi, oggi=oggiStr(), corse=S.logs.filter(eCorsa);
  let h=`<div class="ph"><div><h1>Analisi</h1><p>${corse.length} corse · ${Math.round(corse.reduce((s,l)=>s+ +l.km,0))} km in totale</p></div></div>
    <div class="tabs">
      <button class="tab${t==='sett'?' on':''}" onclick="tab('analisi','sett')">Settimane</button>
      <button class="tab${t==='prog'?' on':''}" onclick="tab('analisi','prog')">Progressi</button>
      <button class="tab${t==='corse'?' on':''}" onclick="tab('analisi','corse')">Corse</button>
      <button class="tab${t==='fastidi'?' on':''}" onclick="tab('analisi','fastidi')">Fastidi</button>
    </div>`;

  if(t==='sett'){
    /* ── 12 settimane: km, corse, tempo, carico percepito (sforzo × minuti), confronto col piano ── */
    const lun0=lunediDi(oggi), sett=[];
    for(let i=11;i>=0;i--) sett.push(statSett(piuGiorni(lun0,-7*i)));
    const cur=sett[11], c=carico(), cont=continuita(), lm=lungoMax(27);
    h+=`<div class="tiles">
      <div class="tile"><span>Questa settimana</span><b>${num1(cur.km)}<i> km</i></b><small>${cur.nP?`${Math.round(cur.kmP)} in piano · ${cur.n} di ${cur.nP} corse`:`${cur.n} corse, fuori piano`}</small></div>
      <div class="tile"><span>Ultime 4 settimane</span><b>${Math.round(sett.slice(-4).reduce((s,x)=>s+x.km,0))}<i> km</i></b><small>${sett.slice(-4).reduce((s,x)=>s+x.n,0)} corse</small></div>
      <div class="tile"><span>Lungo più lungo</span><b>${lm?num1(lm):'—'}<i> km</i></b><small>ultimi 28 giorni</small></div>
      <div class="tile"><span>Continuità</span><b>${cont}<i> ${cont===1?'settimana':'settimane'}</i></b><small>di fila con 3 corse</small></div>
    </div>`;
    if(c.r!=null) h+=`<div class="alert ${c.r>1.6?'a-danger':c.r>1.4?'a-warn':'a-ok'}"><b>${c.r>1.6?'⚠':c.r>1.4?'⚡':'✓'} Km negli ultimi 7 giorni: ${c.r>=1?'+':''}${Math.round((c.r-1)*100)}% rispetto alla media delle 4 settimane prima</b>${Math.round(c.k7)} km contro ${Math.round(c.base)} di media. ${c.r>1.4?'Un aumento così brusco è un rischio per il tendine: niente qualità finché non rientra.':'Progressione graduale.'}</div>`;
    if(!S.logs.length) h+=`<div class="card vuoto">Registra la prima corsa: qui vedrai l'andamento delle settimane.</div>`;
    else{
      h+=barreSett('goKm','Km per settimana','ultime 12',sett,d=>d.km,d=>d.kmP,
        d=>`Settimana del ${dataIt(d.lun,{day:'numeric',month:'long'})}: ${num1(d.km)} km in ${d.n} corse`+(d.kmP?` · ${Math.round(d.kmP)} in piano`:''),
        `<span><i class="q" style="background:var(--c1)"></i>km corsi</span><span><i style="background:var(--text)"></i>km in piano</span>`);
      h+=barreSett('goCar','Carico percepito','sforzo × minuti, calcio compreso',sett,d=>Math.round(d.carico),null,
        d=>`Settimana del ${dataIt(d.lun,{day:'numeric',month:'long'})}: carico ${Math.round(d.carico)}`+(d.rpe!=null?` · sforzo medio ${num1(d.rpe)}`:'')+(d.calcio?` · ${d.calcio} ${d.calcio===1?'partita':'partite'}`:''),'');
      h+=`<p class="muted" style="margin:-4px 0 12px">Il carico percepito somma, per ogni allenamento con sforzo indicato, lo sforzo (1–10) per i minuti. Serve a confrontare le settimane tra loro, non è un valore assoluto.</p>`;
      h+=`<div class="card"><div class="lbl">Settimana per settimana</div><div class="tblw"><table class="tbl">
        <tr><th>Settimana</th><th>Km</th><th>Corse</th><th>Carico</th><th>Passo facile</th><th>Mattino</th></tr>
        ${[...sett].slice(Math.max(0,sett.findIndex(d=>d.km||d.kmP||d.n||d.calcio||d.mattino!=null))).reverse().map(d=>`<tr><td>${dataIt(d.lun,{day:'numeric',month:'short'})}</td><td>${num1(d.km)}${d.kmP?` <small>/ ${Math.round(d.kmP)}</small>`:''}</td><td>${d.n}${d.nP?`<small>/${d.nP}</small>`:''}${d.calcio?'<small> +calcio</small>':''}</td><td>${d.carico?Math.round(d.carico):'—'}</td><td>${d.passoFac?secPasso(d.passoFac):'—'}</td><td>${d.mattino!=null?num1(d.mattino):'—'}</td></tr>`).join('')}
      </table></div><p class="muted">fatto / previsto. Mattino = media del fastidio al risveglio (0–10).</p></div>`;
    }
  }

  if(t==='prog'){
    /* ── passo nel tempo (3 famiglie), tendenza sulle facili, record ufficiali e in allenamento ── */
    const lim=piuGiorni(oggi,-120), fam=x=>['Medio','Progressivo'].includes(x)?1:['Ripetute','Gara'].includes(x)?2:0;
    const NF=['Facile e lungo','Medio e progressivo','Ripetute e gare'];
    const pts=corse.filter(l=>l.ritmo&&+l.km>=2&&l.data>=lim).map(l=>({l,t:parseD(l.data).getTime(),p:passoSec(l.ritmo),c:fam(l.tipo)})).filter(p=>p.p>0).sort((a,b)=>a.t-b.t);
    if(pts.length<3) h+=`<div class="gr"><div class="lbl">Passo nel tempo</div><div class="vuoto">Servono almeno 3 corse con km e tempo.</div></div>`;
    else{
      const W=440,H=210,pl=38,pr=10,pt=12,pb=24,iw=W-pl-pr,ih=H-pt-pb;
      const t0=pts[0].t,t1=pts[pts.length-1].t,ps=pts.map(p=>p.p),lo=Math.min(...ps)-8,hi=Math.max(...ps)+8,tick=hi-lo>150?30:15;
      const x=t=>pl+(t1===t0?iw/2:(t-t0)/(t1-t0)*iw), y=p=>pt+(p-lo)/(hi-lo)*ih;      // più veloce = più in alto
      let g='';
      for(let v=Math.ceil(lo/tick)*tick;v<=hi;v+=tick) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${secPasso(v)}</text>`;
      for(let i=0;i<4;i++){const tt=t0+(t1-t0)*i/3;g+=`<text x="${x(tt)}" y="${H-7}" text-anchor="${i===0?'start':i===3?'end':'middle'}">${new Date(tt).toLocaleDateString('it-IT',{day:'numeric',month:'numeric'})}</text>`;}
      // tendenza (minimi quadrati) solo sulle corse facili: è lì che si vede la forma
      const fac=pts.filter(p=>p.c===0);let msg='';
      if(fac.length>=3&&fac[fac.length-1].t>fac[0].t){
        const mx=fac.reduce((s,p)=>s+p.t,0)/fac.length,my=fac.reduce((s,p)=>s+p.p,0)/fac.length;
        const b=fac.reduce((s,p)=>s+(p.t-mx)*(p.p-my),0)/fac.reduce((s,p)=>s+(p.t-mx)**2,0),a=my-b*mx,s30=b*30*864e5;
        g+=`<line x1="${x(fac[0].t)}" y1="${y(a+b*fac[0].t)}" x2="${x(fac[fac.length-1].t)}" y2="${y(a+b*fac[fac.length-1].t)}" stroke="var(--c1)" stroke-width="2" opacity=".45" stroke-linecap="round"/>`;
        msg=Math.abs(s30)<3?'Corse facili: passo stabile.':s30<0?`Corse facili: ${Math.round(Math.abs(s30))} secondi al km più veloci ogni 30 giorni.`:`Corse facili: ${Math.round(s30)} secondi al km più lente ogni 30 giorni.`;
      }
      for(const p of pts){
        g+=`<circle cx="${x(p.t).toFixed(1)}" cy="${y(p.p).toFixed(1)}" r="5" fill="var(--c${p.c+1})" stroke="var(--surface)" stroke-width="2"/>`;
        g+=`<circle cx="${x(p.t).toFixed(1)}" cy="${y(p.p).toFixed(1)}" r="14" fill="transparent" style="cursor:pointer" tabindex="0" onclick="grOut('goPassi',this)" onfocus="grOut('goPassi',this)" data-o="${esc(`${dataIt(p.l.data,{day:'numeric',month:'short'})} · ${p.l.tipo} · ${num1(p.l.km)} km a ${p.l.ritmo}/km${p.l.rpe?' · sforzo '+p.l.rpe:''}`)}"/>`;
      }
      h+=`<div class="gr"><div class="lbl">Passo nel tempo<small>ultimi 120 giorni · in alto = più veloce</small></div>
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Passo medio di ogni corsa negli ultimi 120 giorni">${g}</svg>
        <div class="gr-leg">${NF.map((n,i)=>`<span><i class="o" style="background:var(--c${i+1})"></i>${n}</span>`).join('')}</div>
        <div class="gr-out" id="goPassi">${msg||'Tocca un punto per il dettaglio.'}</div></div>`;
    }
    /* record: "in gara" = risultati di gare registrate; "in allenamento" = miglior tratto dentro una corsa (dagli intertempi) o corsa intera */
    const D=[[1,'1 km'],[5,'5 km'],[10,'10 km'],[21.0975,'Mezza']], g2=d=>dataIt(d,{day:'numeric',month:'short',year:'2-digit'});
    const righe=D.map(([d,n])=>{const m=migliori(d);return {n,d,...m};}).filter(r=>r.uff||r.all);
    h+=`<div class="card"><div class="lbl">Migliori tempi</div>${righe.length?`<div class="tblw"><table class="tbl"><tr><th>Distanza</th><th>In gara</th><th>In allenamento</th></tr>
      ${righe.map(r=>`<tr><td>${r.n}</td><td>${r.uff?`<a class="lnk" onclick="apriCorsa('${r.uff.id}')">${hms(r.uff.sec)}</a><small class="sotto">${g2(r.uff.data)}</small>`:'—'}</td><td>${r.all?`<a class="lnk" onclick="apriCorsa('${r.all.id}')">${hms(r.all.sec)}</a><small class="sotto">${secPasso(r.all.sec/r.d)}/km · ${g2(r.all.data)}</small>`:'—'}</td></tr>`).join('')}
      </table></div><p class="muted">In allenamento conta anche il tratto migliore dentro una corsa più lunga, se hai importato il file con gli intertempi. Il PB dichiarato nel piano è ${esc(S.cfg?S.cfg.pb:'—')}.</p>`:'<p class="muted">Ancora nessun tempo registrato.</p>'}</div>`;
    if(corse.length>=3){
      const piuLungo=corse.reduce((m,l)=>+l.km>+m.km?l:m), perSett={};
      for(const l of corse){const k=lunediDi(l.data);perSett[k]=(perSett[k]||0)+ +l.km;}
      const top=Object.keys(perSett).reduce((m,k)=>perSett[k]>perSett[m]?k:m), p=proiezione(21.0975);
      h+=`<div class="card"><div class="kv" style="margin-top:0">
        <span>Corsa più lunga <small class="muted">${g2(piuLungo.data)}</small></span><b>${num1(piuLungo.km)} km</b>
        <span>Settimana con più km <small class="muted">dal ${g2(top)}</small></span><b>${Math.round(perSett[top])} km</b>
        <span>Continuità attuale</span><b>${continuita()} settimane con 3 corse</b>
        <span>Stima mezza maratona</span><b>${hms(p.sec)} · prudente ${hms(p.prud)}</b></div>
        <p class="muted" style="margin-top:6px">Stima con la formula di Riegel da: ${esc(p.rif.et)}. È un ordine di grandezza, non una previsione.</p></div>`;
    }
  }

  if(t==='corse'){
    /* ── elenco di tutti gli allenamenti, filtrabile per tipo; tocco = dettaglio ── */
    const F=S.filtroCorse||'tutti', FILTRI=[['tutti','Tutti'],['corsa','Corse'],['Calcio','Calcio'],['Forza','Forza'],['Gara','Gare']];
    const lista=[...S.logs].filter(l=>F==='tutti'||(F==='corsa'?eCorsa(l):l.tipo===F)).sort((a,b)=>a.data<b.data?1:a.data>b.data?-1:(b.ts||0)-(a.ts||0));
    h+=`<div class="seg" style="margin-bottom:10px">${FILTRI.map(([k,n])=>`<button class="${F===k?'on':''}" onclick="S.filtroCorse='${k}';disegna()">${n}</button>`).join('')}</div>
      <div class="card">${lista.length?lista.slice(0,S.nCorse||60).map(l=>{
        const sc=S.shoes.find(x=>x.id===l.scarpa), mx=fastidioMax(l);
        return `<div class="lr ${classeLog(l.tipo)}" onclick="apriCorsa('${l.id}')"><i class="dot pieno"></i>
          <div class="lr-m"><div class="lr-1">${l.km?`<b>${num1(l.km)} km</b>`:`<b>${esc(l.tipo)}</b>`}${l.ritmo?`<span>${l.ritmo}/km</span>`:''}${l.km?`<span class="chip">${esc(l.tipo)}</span>`:l.durata?`<span>${l.durata} min</span>`:''}${l.splits&&l.splits.length?'<span class="chip">intertempi</span>':''}</div>
          <div class="lr-2">${dataIt(l.data,{weekday:'short',day:'numeric',month:'short'})}${l.rpe?' · sforzo '+l.rpe:''}${mx!=null?' · fastidio '+mx:''}${sc?' · '+esc(sc.nome):''}${l.note?' · '+esc(l.note):''}</div></div>
          <span class="muted">›</span></div>`;}).join('')+(lista.length>(S.nCorse||60)?`<button class="btn btn-sec w100" style="margin-top:8px" onclick="S.nCorse=(S.nCorse||60)+60;disegna()">Mostra altri</button>`:'')
        :'<div class="vuoto">Nessun allenamento.<br>Usa il tasto + in basso.</div>'}</div>`;
  }

  if(t==='fastidi'){
    /* ── fastidio al risveglio (0–10), test settimanale, fastidi in corsa, carico del giorno ── */
    const G=42, giorni=[];
    for(let i=G-1;i>=0;i--){
      const d=piuGiorni(oggi,-i), m=S.morning[d], lg=S.logs.filter(l=>l.data===d);
      const fc=lg.map(fastidioMax).filter(x=>x!=null);
      giorni.push({d,v:m&&m.v!=null?+m.v:null,z:m?m.z:'',test:S.tests[d]!=null?+S.tests[d]:null,corsa:fc.length?Math.max(...fc):null,
        km:lg.filter(eCorsa).reduce((s,l)=>s+ +l.km,0),calcio:lg.some(l=>l.tipo==='Calcio')});
    }
    const u14=giorni.slice(-14), media=a=>{const v=a.filter(g=>g.v!=null).map(g=>g.v);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null;};
    const m7=media(giorni.slice(-7)), m7p=media(giorni.slice(-14,-7));
    let reazioni=0;                                                 // giorni con fastidio +2 rispetto al giorno prima, dopo corsa o calcio
    for(let i=1;i<G;i++) if(giorni[i].v!=null&&giorni[i-1].v!=null&&giorni[i].v>=giorni[i-1].v+2&&(giorni[i-1].km>0||giorni[i-1].calcio)) reazioni++;
    h+=`<div class="tiles">
      <div class="tile"><span>Al risveglio</span><b>${m7!=null?num1(m7):'—'}<i> /10</i></b><small>${m7!=null&&m7p!=null?(m7<m7p-0.3?'in calo':m7>m7p+0.3?'in aumento':'stabile')+' sui 7 giorni prima':'media ultimi 7 giorni'}</small></div>
      <div class="tile"><span>Reazioni al carico</span><b>${reazioni}</b><small>+2 il giorno dopo, in 6 settimane</small></div>
      <div class="tile"><span>Esercizi fatti</span><b>${u14.filter(g=>S.rehab[g.d]).length}<i>/14</i></b><small>giorni, ultime 2 settimane</small></div>
      <div class="tile"><span>Mattine compilate</span><b>${u14.filter(g=>g.v!=null).length}<i>/14</i></b><small>ultime 2 settimane</small></div>
    </div>`;
    if(!giorni.some(g=>g.v!=null||g.test!=null||g.corsa!=null)) h+=`<div class="gr"><div class="lbl">Fastidi e carico</div><div class="vuoto">Compila il fastidio al risveglio in Oggi per qualche giorno: qui vedrai come risponde il corpo a corse e partite.</div></div>`;
    else{
      // sopra: fastidio 0–10 (risveglio = linea, test = rombo, in corsa = quadrato). Sotto, riquadro separato: km del giorno.
      const W=440,pl=26,pr=22,iw=W-pl-pr,y1=10,h1=110,y2=y1+h1+34,h2=52,H=y2+h2+22;
      const x=i=>pl+(i+0.5)*iw/G, yp=v=>y1+h1-(v/10)*h1, kmMax=assePulito(Math.max(8,...giorni.map(g=>g.km)),2).max, yk=v=>y2+h2-(v/kmMax)*h2;
      let g='';
      for(const v of [0,5,10]) g+=`<line x1="${pl}" x2="${W-pr}" y1="${yp(v)}" y2="${yp(v)}" stroke="var(--${v===0?'axis':'grid'})"/><text x="${pl-6}" y="${yp(v)+4}" text-anchor="end">${v}</text>`;
      g+=`<line x1="${pl}" x2="${W-pr}" y1="${yk(0)}" y2="${yk(0)}" stroke="var(--axis)"/><line x1="${pl}" x2="${W-pr}" y1="${yk(kmMax)}" y2="${yk(kmMax)}" stroke="var(--grid)"/>
        <text x="${pl-6}" y="${yk(kmMax)+4}" text-anchor="end">${kmMax}</text><text x="${pl-6}" y="${yk(0)+4}" text-anchor="end">0</text><text x="${pl}" y="${y2-16}">km corsi nel giorno</text>`;
      giorni.forEach((d,i)=>{
        if(i%7===6) g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${dataIt(d.d,{day:'numeric',month:'numeric'})}</text>`;
        if(d.km>0){const top=yk(d.km),r=Math.min(3,yk(0)-top);g+=`<path d="M${x(i)-3},${yk(0)}V${top+r}a${r},${r} 0 0 1 ${r},${-r}h${6-2*r}a${r},${r} 0 0 1 ${r},${r}V${yk(0)}Z" fill="var(--t3)"/>`;}
        if(d.calcio) g+=`<rect x="${x(i)-4}" y="${y2-6}" width="8" height="8" rx="2" fill="var(--pink)" stroke="var(--surface)" stroke-width="2"/>`;
      });
      const p=giorni.map((d,i)=>d.v!=null?[x(i),yp(d.v)]:null).filter(Boolean);
      if(p.length){
        g+=`<polyline points="${p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
        g+=p.slice(0,-1).map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2.2" fill="var(--c1)"/>`).join('');
        const u=p[p.length-1];g+=`<circle cx="${u[0].toFixed(1)}" cy="${u[1].toFixed(1)}" r="4.5" fill="var(--c1)" stroke="var(--surface)" stroke-width="2"/>`;
      }
      giorni.forEach((d,i)=>{
        if(d.corsa!=null) g+=`<rect x="${x(i)-4}" y="${yp(d.corsa)-4}" width="8" height="8" rx="1.5" fill="var(--c2)" stroke="var(--surface)" stroke-width="2"/>`;
        if(d.test!=null) g+=`<rect x="${x(i)-4.5}" y="${yp(d.test)-4.5}" width="9" height="9" transform="rotate(45 ${x(i)} ${yp(d.test)})" fill="var(--c3)" stroke="var(--surface)" stroke-width="2"/>`;
      });
      const dett=d=>`${dataIt(d.d,{weekday:'short',day:'numeric',month:'short'})}: risveglio ${d.v!=null?d.v+(d.z?' ('+d.z+')':''):'—'}`+(d.corsa!=null?` · in corsa ${d.corsa}`:'')+(d.test!=null?` · test ${d.test}`:'')+(d.km?` · ${num1(d.km)} km`:'')+(d.calcio?' · calcio':'');
      giorni.forEach((d,i)=>{g+=`<rect x="${pl+i*iw/G}" y="${y1}" width="${iw/G}" height="${H-y1-20}" fill="transparent" style="cursor:pointer" onclick="grOut('goFast',this)" data-o="${esc(dett(d))}"/>`;});
      const ultimo=[...giorni].reverse().find(d=>d.v!=null)||giorni[G-1];
      h+=`<div class="gr"><div class="lbl">Fastidi e carico<small>ultime 6 settimane</small></div>
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Fastidio al risveglio, in corsa, test settimanale e km per giorno">${g}</svg>
        <div class="gr-leg"><span><i style="background:var(--c1)"></i>al risveglio</span><span><i class="q" style="background:var(--c2)"></i>in corsa</span>
          <span><i class="q" style="background:var(--c3);transform:rotate(45deg);width:8px;height:8px"></i>test settimanale</span><span><i class="q" style="background:var(--t3)"></i>km</span><span><i class="q" style="background:var(--pink)"></i>calcio</span></div>
        <div class="gr-out" id="goFast">${esc(dett(ultimo))}</div>
        <p class="muted" style="margin-top:4px">Tocca un giorno per il dettaglio. Se la linea sale il giorno dopo una barra, quel carico era troppo.</p>
        <details class="tv"><summary>Tabella ultimi 14 giorni</summary><table><tr><th>Giorno</th><th>Risveglio</th><th>In corsa</th><th>Test</th><th>Km</th></tr>
          ${[...u14].reverse().map(d=>`<tr><td>${dataIt(d.d,{weekday:'short',day:'numeric',month:'numeric'})}</td><td>${d.v!=null?d.v+(d.z?' '+d.z:''):'—'}</td><td>${d.corsa??'—'}</td><td>${d.test??'—'}</td><td>${d.km?num1(d.km):d.calcio?'calcio':'—'}</td></tr>`).join('')}</table></details></div>`;
    }
    h+=`<div class="card"><div class="lbl">Come usare questi dati</div><ol class="ol">
      <li><b>Il fastidio al risveglio</b> è il segnale più affidabile: se sale il giorno dopo un carico, quel carico era troppo.</li>
      <li><b>Il test settimanale</b> dovrebbe scendere o restare fermo: se sale due volte di fila, la revisione del blocco propone di non aumentare.</li>
      <li>Per fisioterapista e coach usa Altro → Esporta (report o tabelle) oppure il foglio condiviso.</li></ol></div>`;
  }
  el.innerHTML=h;
}

/* ═══════════════ 8. ALTRO: foglio Google, esporta, scarpe, esercizi, impostazioni, guida ═══════════════
   S.tab.altro = '' mostra il menu; le altre voci aprono la sezione con "‹ Altro" per tornare. */
const MENU_ALTRO=[
  ['sync','Foglio Google','sincronizzazione, coach, backup privato'],
  ['export','Esporta e backup','file di backup, report per AI, tabelle, calendario'],
  ['scarpe','Scarpe','km per paio e soglia di cambio'],
  ['esercizi','Esercizi','la tua routine di forza e riabilitazione'],
  ['imp','Impostazioni','piano, revisione, aspetto, installazione, dati'],
  ['guida','Guida','come si usa e come ragiona']];

function disAltro(el){
  const t=S.tab.altro, oggi=oggiStr(), voce=MENU_ALTRO.find(m=>m[0]===t);
  let h=voce?`<div class="ph"><div><button class="lnk" onclick="tab('altro','')">‹ Altro</button><h1>${voce[1]}</h1></div></div>`
    :`<div class="ph"><div><h1>Altro</h1></div><div class="ph-r">RunLog<b>v${VER}</b></div></div>`;

  if(!voce){
    /* ── menu: ogni voce con una riga di stato ── */
    const scarpaVecchia=S.shoes.find(x=>!x.off&&kmScarpa(x)>=(x.soglia||700)*0.9);
    const stato={sync:!S.sheetUrl?'non collegato':S.sync.err?'⚠ '+S.sync.err:!S.token?'da collegare':S.pend.length?S.pend.length+' modifiche in attesa':'collegato',
      export:LS.g('rl_lastbackup',0)?'ultimo backup su file: '+new Date(LS.g('rl_lastbackup',0)).toLocaleDateString('it-IT'):'nessun backup su file',
      scarpe:scarpaVecchia?'⚡ '+scarpaVecchia.nome+' vicino alla soglia':S.shoes.filter(x=>!x.off).length+' in uso',
      esercizi:(S.ex||[]).filter(x=>x.on).length+' nella routine'};
    h+=`<div class="card menu">${MENU_ALTRO.map(m=>`<button onclick="tab('altro','${m[0]}')"><div><b>${m[1]}</b><span>${esc(stato[m[0]]||m[2])}</span></div><i>›</i></button>`).join('')}</div>
      <p class="muted" style="padding:0 4px 10px">RunLog è un diario di allenamento, non un parere medico: le decisioni su carichi ed esercizi spettano a chi ti segue.</p>`;
  }

  if(t==='sync') h+=sheetHTML();

  if(t==='export'){
    const pre=LS.g('rl_bak_pre11',null), rip=LS.g('rl_bak_prerip',null);
    h+=`<div class="card"><div class="lbl">Backup su file<small>${LS.g('rl_lastbackup',0)?'ultimo: '+new Date(LS.g('rl_lastbackup',0)).toLocaleDateString('it-IT'):'mai fatto'}</small></div>
        <p class="txt" style="margin-bottom:10px">Tutti i dati in un file: per cambiare telefono o browser. Non contiene la chiave del foglio.</p>
        <div class="btn-row"><button class="btn btn-sec" onclick="esportaBackup()">Scarica backup</button>
        <label class="btn btn-sec">Carica backup<input type="file" accept=".json,application/json,text/plain" style="display:none" onchange="importaBackup(this)"></label></div>
        ${pre||rip?`<details class="g" style="margin-top:8px"><summary>Copie di sicurezza automatiche</summary><div>
          ${pre?`<p>Dati com'erano prima dell'aggiornamento alla v11. <button class="lnk" onclick="scaricaPreMigrazione()">Scarica</button></p>`:''}
          ${rip?`<p>Dati com'erano prima dell'ultimo ripristino. <button class="lnk" onclick="scarica('runlog-prima-del-ripristino.json',LS.g('rl_bak_prerip',''),'application/json')">Scarica</button></p>`:''}</div></details>`:''}</div>
      <div class="card"><div class="lbl">Report per un'AI o per il coach</div>
        <p class="txt" style="margin-bottom:10px">Un file di testo (Markdown) con piano, settimane, allenamenti e fastidi, pronto da incollare in una chat. Non contiene nome, email né collegamenti.</p>
        <div class="fg2"><div class="fg"><label for="rp_n">Periodo</label><select id="rp_n"><option value="4">4 settimane</option><option value="8" selected>8 settimane</option><option value="12">12 settimane</option></select></div>
        <div class="fg"><span class="fl">Note</span><button type="button" class="spunta${S.set.reportNote?' on':''}" onclick="S.set.reportNote=!S.set.reportNote;salva();disegna()"><i>${S.set.reportNote?'✓':''}</i>Includi le note</button></div></div>
        <div class="btn-row"><button class="btn btn-pri" onclick="condividi('runlog-report-'+oggiStr()+'.md',reportAI(+$('rp_n').value),'text/markdown')">Condividi</button><button class="btn btn-sec" onclick="copia(reportAI(+$('rp_n').value))">Copia</button></div></div>
      <div class="card"><div class="lbl">Tabelle per Excel o Fogli<small>CSV con separatore ;</small></div>
        <div class="btn-row" style="flex-wrap:wrap">${['Corse','Intertempi','Settimane','Piano','Fastidi'].map(n=>`<button class="btn btn-sec sm" onclick="esportaCSV('${n}')">${n}</button>`).join('')}</div></div>
      <div class="card"><div class="lbl">Calendario del piano<small>file .ics</small></div>
        <p class="txt" style="margin-bottom:10px">Le sedute da fare entrano nel calendario del telefono: corse alle ${esc(S.set.oraUscita)} con avviso 30 minuti prima, calcio e forza come eventi di giornata. Se il piano cambia, scarica di nuovo il file: in Google Calendar le sedute con lo stesso codice vengono aggiornate, alcune app invece le duplicano.</p>
        <div class="fg"><label for="ic_ora">Ora delle corse</label><input type="time" id="ic_ora" value="${esc(S.set.oraUscita)}" onchange="S.set.oraUscita=this.value||'06:30';salva()"></div>
        <button class="btn btn-sec w100"${S.plan?'':' disabled'} onclick="scarica('runlog-piano.ics',calendarioICS(),'text/calendar')">Scarica il calendario</button></div>
      <div class="card"><div class="lbl">Piano come file</div>
        <p class="txt" style="margin-bottom:10px">Per modificarlo a mano o con un'AI e ricaricarlo. Le corse già fatte vengono ricollegate per data; il piano attuale resta tra le versioni precedenti.</p>
        <div class="btn-row"><button class="btn btn-sec sm"${S.plan?'':' disabled'} onclick="scarica('runlog-piano-${oggi}.json',JSON.stringify(S.plan,null,1),'application/json')">Scarica .json</button>
        <label class="btn btn-sec sm">Carica .json<input type="file" accept=".json,application/json,text/plain" style="display:none" onchange="importaPiano(this)"></label></div></div>`;
  }

  if(t==='scarpe'){
    /* ── km per paio (km iniziali + corse), soglia personale, ultimo uso ── */
    h+=S.shoes.map(x=>{
      const km=kmScarpa(x), sg=x.soglia||700, pct=km/sg, usi=S.logs.filter(l=>l.scarpa===x.id&&eCorsa(l)).sort((a,b)=>a.data<b.data?1:-1);
      return `<div class="card${x.off?' spento':''}"><div class="gara-h"><div><div class="gara-n">${esc(x.nome)}</div>
          <div class="muted">${x.off?'archiviate · ':''}${usi.length} corse${usi[0]?' · ultima il '+dataIt(usi[0].data,{day:'numeric',month:'short'}):''}</div></div>
          <div class="gara-g"><b>${Math.round(km)}</b><span>di ${sg} km</span></div></div>
        <div class="barra${pct>=1?' over':pct>=0.9?' near':''}"><i style="width:${Math.min(100,Math.round(pct*100))}%"></i></div>
        ${!x.off&&pct>=1?'<div class="alert a-warn" style="margin-top:10px"><b>⚡ Soglia superata</b>Ammortizzazione ridotta: valuta il cambio, soprattutto con il tendine sensibile.</div>':!x.off&&pct>=0.9?'<p class="muted" style="margin-top:8px">Vicine alla soglia: conviene iniziare ad alternarle con un paio nuovo.</p>':''}
        <div class="sc-a"><button class="btn btn-sec sm" onclick="apriScarpa('${x.id}')">Modifica</button><button class="btn btn-sec sm" onclick="scarpaStato('${x.id}')">${x.off?'Riattiva':'Archivia'}</button></div></div>`;
    }).join('')||'<div class="card vuoto">Nessun paio registrato.</div>';
    h+=`<button class="btn btn-sec w100" onclick="apriScarpa('')">Aggiungi scarpe</button>
      <p class="muted" style="padding:10px 4px">La soglia è indicativa: 600–800 km per la maggior parte delle scarpe da strada. Conta anche come ti senti: se le gambe arrivano più stanche del solito, controlla l'usura.</p>`;
  }

  if(t==='esercizi'){
    /* ── routine: esercizi divisi per gruppo; quelli attivi compaiono nelle sedute di forza del piano ── */
    h+=`<div class="card"><div class="lbl">Regole di carico</div><ol class="ol">
        <li>In corsa il fastidio resta entro <b>3–4/10</b> e non aumenta; il giorno dopo torna alla base.</li>
        <li>Se una regola salta: ripeti la settimana invece di salire. Se succede due volte, senti la fisioterapista.</li></ol>
        <p class="muted" style="margin-top:6px">Gli esercizi e le dosi sono un punto di partenza: adattali con chi ti segue.</p></div>`;
    for(const g in GRUPPI_EX){
      const lista=(S.ex||[]).filter(x=>x.gr===g);
      if(!lista.length) continue;
      h+=`<div class="card"><div class="lbl">${GRUPPI_EX[g]}<small>${lista.filter(x=>x.on).length} di ${lista.length} nella routine</small></div>
        ${lista.map(x=>`<div class="ex${x.on?'':' spento'}"><div class="ex-h"><b>${esc(x.nome)}</b><button class="spunta mini${x.on?' on':''}" onclick="togEsercizio('${x.id}')" aria-pressed="${!!x.on}" aria-label="Nella routine"><i>${x.on?'✓':''}</i></button></div>
          <span class="chip t-easy">${esc(x.dose)}</span>${x.desc?`<p>${esc(x.desc)}</p>`:''}<button class="lnk" onclick="apriEsercizio('${x.id}')">modifica</button></div>`).join('')}</div>`;
    }
    h+=`<button class="btn btn-sec w100" onclick="apriEsercizio('')">Aggiungi un esercizio</button>
      <button class="lnk" style="display:block;margin:12px auto" onclick="ripristinaEsercizi()">Rimetti gli esercizi predefiniti mancanti</button>`;
  }

  if(t==='imp'){
    const temaAtt=LS.g('rl_theme','light'), R=S.plan?riepilogoPiano(S.plan):null, rv=S.set.rev;
    const online=location.protocol==='https:'||location.hostname==='localhost', comeApp=!!(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
    h+=`<div class="card"><div class="lbl">Piano di allenamento</div>
        ${S.cfg&&R?`<p class="txt">${R.n} settimane dal ${dataIt(S.plan[0].lun,{day:'numeric',month:'long'})} · PB 10 km ${esc(S.cfg.pb)}${S.cfg.half?' · mezza '+dataIt(S.cfg.half,{day:'numeric',month:'short'}):''}${S.cfg.mara?' · maratona '+dataIt(S.cfg.mara,{day:'numeric',month:'short'}):''}${S.cfg.foot>=0?' · calcio il '+GG[S.cfg.foot].toLowerCase():''}</p>`:'<p class="txt">Nessun piano.</p>'}
        <button class="btn btn-sec w100" style="margin-top:10px" onclick="apriGeneratore()">${S.plan?'Cambia gare o parametri':'Crea il piano'}</button></div>
      <div class="card"><div class="lbl">Revisione del blocco<small>soglie della proposta</small></div>
        <div class="fg2"><div class="fg"><label for="rv_a">Prosegui se fatto almeno</label><select id="rv_a" onchange="S.set.rev.alto=+this.value;salva()">${[70,75,80,85,90].map(x=>`<option${x===rv.alto?' selected':''} value="${x}">${x}% dei km</option>`).join('')}</select></div>
        <div class="fg"><label for="rv_b">Alleggerisci sotto</label><select id="rv_b" onchange="S.set.rev.basso=+this.value;salva()">${[50,55,60,65,70].map(x=>`<option${x===rv.basso?' selected':''} value="${x}">${x}% dei km</option>`).join('')}</select></div></div>
        <div class="fg"><label for="rv_r">Sforzo medio nelle corse facili oltre</label><select id="rv_r" onchange="S.set.rev.rpe=+this.value;salva()">${[4,5,6].map(x=>`<option${x===rv.rpe?' selected':''} value="${x}">${x} su 10</option>`).join('')}</select></div>
        <p class="muted">Tra le due soglie la proposta è "consolida". Fastidi 5+ ripetuti o test in peggioramento portano sempre a non aumentare. La proposta non cambia mai il piano da sola.</p></div>
      <div class="card"><div class="lbl">Giornata tipo</div>
        <div class="fg2"><div class="fg"><label for="im_test">Test settimanale il</label><select id="im_test" onchange="S.set.testDay=+this.value;salva()">${GG.map((g,i)=>`<option value="${i}"${i===+S.set.testDay?' selected':''}>${g.toLowerCase()}</option>`).join('')}</select></div>
        <div class="fg"><label for="im_ora">Ora delle corse</label><input type="time" id="im_ora" value="${esc(S.set.oraUscita)}" onchange="S.set.oraUscita=this.value||'06:30';salva()"></div></div></div>
      <div class="card"><div class="lbl">Aspetto</div><div class="seg">
        ${[['light','Chiaro'],['dark','Scuro'],['auto','Automatico']].map(x=>`<button class="${temaAtt===x[0]?'on':''}" onclick="tema('${x[0]}')">${x[1]}</button>`).join('')}</div></div>
      <div class="card"><div class="lbl">Versione online<small>${online?esc(location.host):'file locale'}</small></div>
        ${online?`<div class="kv" style="margin-top:0">
            <span>Aperta come app</span><b>${comeApp?'sì':'no, dal browser'}</b>
            <span>Utilizzabile senza rete</span><b>${navigator.serviceWorker&&navigator.serviceWorker.controller?'sì':'dal prossimo avvio'}</b>
            <span>Archivio protetto dal browser</span><b id="st_pers">…</b></div>
          ${_installa?`<button class="btn btn-pri w100" style="margin-top:10px" onclick="installa()">Installa sulla schermata Home</button>`
            :comeApp?'':`<p class="muted" style="margin-top:8px">Per l'icona sulla schermata Home usa il menu del browser: Installa app, Aggiungi a schermata Home oppure Aggiungi al telefono.</p>`}
          <p class="muted" style="margin-top:8px">I dati appartengono a questo indirizzo e a questo browser: apri RunLog sempre da qui.</p>`
        :`<p class="txt">Stai usando il file aperto dal telefono. Online hai un indirizzo fisso, l'icona sulla schermata Home e un archivio stabile: vedi la Guida.</p>`}</div>
      <div class="card"><div class="lbl">Dati</div>
        <button class="btn btn-sec w100" style="margin-bottom:8px" onclick="if(confirm('Togliere spunte, salti e spostamenti del piano? Gli allenamenti registrati restano e vengono ricollegati per data.')){S.done={};S.skip={};S.over={};S.logs.forEach(l=>l.sk='');attivaStato();accoda('p');salva();disegna();toast('Spunte azzerate');sincronizza();}">Azzera spunte e spostamenti</button>
        <button class="btn btn-red w100" onclick="if(confirm('Cancellare TUTTI i dati di RunLog su questo dispositivo? Il foglio Google non viene toccato.')&&confirm('Sicuro? Hai un backup?')){Object.keys(localStorage).filter(k=>k.startsWith('rl_')).forEach(k=>localStorage.removeItem(k));window.name='';location.reload();}">Cancella tutti i dati</button></div>`;
  }

  if(t==='guida') h+=`<div class="card">${GUIDA.map(g=>`<details class="g"><summary>${g[0]}</summary><div>${g[1]}</div></details>`).join('')}</div>`;

  el.innerHTML=h;
  // "protetto" = il browser non svuota l'archivio da solo quando manca spazio
  if(t==='imp'&&navigator.storage&&navigator.storage.persisted) navigator.storage.persisted().then(p=>{const e=$('st_pers');if(e) e.textContent=p?'sì':'non ancora';}).catch(()=>{});
}

/* ── Scarpe ── */
const kmScarpa=x=>(+x.km0||0)+S.logs.filter(l=>l.scarpa===x.id&&eCorsa(l)).reduce((s,l)=>s+ +l.km,0);
function apriScarpa(id){
  const x=S.shoes.find(s=>s.id===id)||{id:'',nome:'',km0:0,soglia:700};
  S.scarpaId=x.id;
  apriSheet(1,x.id?'Modifica scarpe':'Nuove scarpe','',`
    <div class="fg"><label for="sh_n">Modello</label><input type="text" id="sh_n" value="${esc(x.nome)}" placeholder="es. Ghost 16"></div>
    <div class="fg2"><div class="fg"><label for="sh_k">Km fatti prima di RunLog</label><input type="number" inputmode="numeric" id="sh_k" value="${x.km0||''}" placeholder="0"></div>
    <div class="fg"><label for="sh_s">Soglia di cambio (km)</label><input type="number" inputmode="numeric" id="sh_s" value="${x.soglia||700}" step="50"></div></div>
    <div class="btn-row"><button class="btn btn-pri" onclick="salvaScarpa()">Salva</button><button class="btn btn-sec" onclick="chiudiSheet(1)">Annulla</button></div>
    ${x.id&&!S.logs.some(l=>l.scarpa===x.id)?`<button class="btn btn-red w100" style="margin-top:8px" onclick="S.shoes=S.shoes.filter(s=>s.id!==S.scarpaId);salva();chiudiSheet(1);disegna();">Elimina</button>`:''}`);
}
function salvaScarpa(){
  const nome=$('sh_n').value.trim();
  if(!nome){toast('Scrivi il modello','err');return;}
  const x=S.shoes.find(s=>s.id===S.scarpaId), d={nome,km0:+$('sh_k').value||0,soglia:Math.max(100,+$('sh_s').value||700)};
  if(x) Object.assign(x,d); else S.shoes.push({id:nuovoId('sh'),off:false,...d});
  salva();chiudiSheet(1);disegna();toast('Scarpe salvate');
}
function scarpaStato(id){const x=S.shoes.find(s=>s.id===id);if(x){x.off=!x.off;salva();disegna();}}

/* ── Esercizi ── */
function togEsercizio(id){const x=(S.ex||[]).find(e=>e.id===id);if(x){x.on=!x.on;salva();disegna();}}
function apriEsercizio(id){
  const x=(S.ex||[]).find(e=>e.id===id)||{id:'',nome:'',dose:'',desc:'',gr:'forza',on:true,mio:true};
  S.exId=x.id;
  apriSheet(1,x.id?'Modifica esercizio':'Nuovo esercizio','',`
    <div class="fg"><label for="ex_n">Nome</label><input type="text" id="ex_n" value="${esc(x.nome)}"></div>
    <div class="fg2"><div class="fg"><label for="ex_g">Gruppo</label><select id="ex_g">${Object.keys(GRUPPI_EX).map(g=>`<option value="${g}"${g===x.gr?' selected':''}>${GRUPPI_EX[g]}</option>`).join('')}</select></div>

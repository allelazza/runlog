      <div class="tile"><span>Questa settimana</span><b>${kmSett.toFixed(kmSett%1?1:0)}<i> km</i></b><small>${sett[11].piano!=null?Math.round(sett[11].piano)+' in piano':'fuori piano'}</small></div>

    /* ── grafico 1: km per settimana (barre) con il piano come trattino ── */
    if(!corse.length) h+=`<div class="gr"><div class="lbl">Km per settimana</div><div class="vuoto">Registra la prima corsa per vedere il grafico.</div></div>`;
    else{
      const W=440,H=190,pl=30,pr=6,pt=12,pb=24,iw=W-pl-pr,ih=H-pt-pb,slot=iw/12,bw=Math.min(24,slot-9);
      const ax=assePulito(Math.max(10,...sett.map(d=>Math.max(d.km,d.piano||0))),4), y=v=>pt+ih-(v/ax.max)*ih;
      const testo=d=>`Settimana del ${dataIt(d.l,{day:'numeric',month:'long'})}: ${d.km.toFixed(d.km%1?1:0)} km corsi`+(d.piano!=null?` · ${Math.round(d.piano)} in piano`:'');
      let g='';
      for(let v=0;v<=ax.max+1e-9;v+=ax.step) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--${v===0?'axis':'grid'})"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;

      });
      h+=`<div class="gr"><div class="lbl">Km per settimana<small>ultime 12</small></div>

          ${[...sett].reverse().map(d=>`<tr><td>${dataIt(d.l,{day:'numeric',month:'short'})}</td><td>${d.km.toFixed(1)}</td><td>${d.piano!=null?Math.round(d.piano):'—'}</td></tr>`).join('')}</table></details>
      </div>`;
    }

    /* ── grafico 2: passo nel tempo, 3 famiglie di allenamento ── */
    const lim=piuGiorni(oggi,-120), fam=x=>['Medio','Progressivo'].includes(x)?1:['Ripetute','Gara'].includes(x)?2:0;
    const NF=['Facile e lungo','Medio e progressivo','Ripetute e gare'];
    const pts=corse.filter(l=>l.ritmo&&+l.km>=2&&l.data>=lim).map(l=>({l,t:parseD(l.data).getTime(),p:passoSec(l.ritmo),c:fam(l.tipo)})).filter(p=>p.p>0).sort((a,b)=>a.t-b.t);

    else{

      const x=t=>pl+(t1===t0?iw/2:(t-t0)/(t1-t0)*iw), y=p=>pt+(p-lo)/(hi-lo)*ih;      // più veloce = più in alto
      let g='';
      for(let v=Math.ceil(lo/passoTick)*passoTick;v<=hi;v+=passoTick) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${secPasso(v)}</text>`;
      for(let i=0;i<4;i++){const tt=t0+(t1-t0)*i/3;g+=`<text x="${x(tt)}" y="${H-7}" text-anchor="${i===0?'start':i===3?'end':'middle'}">${new Date(tt).toLocaleDateString('it-IT',{day:'numeric',month:'numeric'})}</text>`;}

        <div class="gr-out" id="goPassi">${msg||'Tocca un punto per il dettaglio.'}</div>

    /* ── record personali (dalle corse registrate) ── */

  if(t==='tendine'){
    /* ── numeri: aderenza a esercizi e check, andamento rigidità ── */

      let g='';
      for(const v of [0,5,10]) g+=`<line x1="${pl}" x2="${W-pr}" y1="${yp(v)}" y2="${yp(v)}" stroke="var(--${v===0?'axis':'grid'})"/><text x="${pl-6}" y="${yp(v)+4}" text-anchor="end">${v}</text>`;

      giorni.forEach((d,i)=>{ if(d.test!=null) g+=`<rect x="${x(i)-4.5}" y="${yp(d.test)-4.5}" width="9" height="9" transform="rotate(45 ${x(i)} ${yp(d.test)})" fill="var(--c3)" stroke="var(--surface)" stroke-width="2"/>`; });
      // una colonna trasparente per giorno: tocco = dettaglio di quel giorno
      const dett=d=>`${dataIt(d.d,{weekday:'short',day:'numeric',month:'short'})}: achille ${d.rig!=null?d.rig:'—'} · caviglia ${d.cav!=null?d.cav:'—'}`+(d.test!=null?` · test ${d.test}`:'')+(d.km?` · ${d.km.toFixed(1)} km`:'')+(d.calcio?' · calcio':'');

          ${[...u14].reverse().map(d=>`<tr><td>${dataIt(d.d,{weekday:'short',day:'numeric',month:'numeric'})}</td><td>${d.rig!=null?d.rig:'—'}</td><td>${d.cav!=null?d.cav:'—'}</td><td>${d.km?d.km.toFixed(1):'—'}</td><td>${d.calcio?'sì':'—'}</td></tr>`).join('')}</table></details>

  }

  if(t==='storico'){
    const lista=[...S.logs].sort((a,b)=>a.data<b.data?1:a.data>b.data?-1:(b.ts||0)-(a.ts||0));
    h+=`<div class="card"><div class="lbl">Export per coach e fisioterapista</div>

    <div class="card"><div class="lbl">Tutti gli allenamenti<small>tocca per modificare</small></div>
      ${lista.length?lista.map(l=>{

        return `<div class="lr ${classeLog(l.tipo)}" onclick="apriLog({id:'${l.id}'})">

            <div class="lr-2">${dataIt(l.data,{weekday:'short',day:'numeric',month:'short'})}${l.rpe?' · sforzo '+l.rpe:''} · ach ${l.dolore_achille||0} · cav ${l.dolore_caviglia||0}${sc?' · '+esc(sc.nome):''}${l.note?' · '+esc(l.note):''}</div></div>

// Testo di riepilogo da mandare a coach/fisio: ultimi 30 allenamenti + check mattutini + test settimanali
function testoExport(){
  if(!S.logs.length) return 'Nessun allenamento registrato.';
  const ult=[...S.logs].sort((a,b)=>a.data<b.data?-1:1).slice(-30);
  const righe=ult.map(l=>`[${l.data}] ${l.tipo}`+(l.km?` ${l.km} km`:'')+(l.ritmo?` @ ${l.ritmo}/km`:'')+(!l.km&&l.durata?` ${l.durata} min`:'')+(l.rpe?` | sforzo ${l.rpe}/10`:'')+
    ` | achille ${l.dolore_achille||0} caviglia ${l.dolore_caviglia||0} schiena ${l.dolore_schiena||0}`+(l.note?` | ${l.note}`:''));
  const mk=Object.keys(S.morning).sort().slice(-21), tk=Object.keys(S.tests).sort().slice(-8);
  return `RUNLOG — ultimi ${ult.length} allenamenti (${ult.filter(eCorsa).reduce((s,l)=>s+ +l.km,0).toFixed(1)} km)\n`+righe.join('\n')+
    (mk.length?`\n\nCHECK MATTUTINI (ultimi ${mk.length} compilati)\n`+mk.map(k=>`[${k}] achille ${S.morning[k].rig??'-'} · caviglia ${S.morning[k].cav??'-'}`).join('\n'):'')+
    (tk.length?`\n\nTEST SETTIMANALE A FINE ESTENSIONE\n`+tk.map(k=>`[${k}] ${S.tests[k]}/10`).join('\n'):'');
}

function apriGara(id){
  const g=S.gare.find(x=>String(x.id)===String(id))||{id:'',nome:'',data:'',distKm:'',objSec:0};
  S.garaId=g.id;
  apriSheet(1,g.id?'Modifica gara':'Nuova gara','',`
    <div class="fg"><label for="ga_n">Nome</label><input type="text" id="ga_n" value="${esc(g.nome)}" placeholder="es. Mezza di Verona"></div>
    <div class="fg2"><div class="fg"><label for="ga_d">Data</label><input type="date" id="ga_d" value="${g.data||''}"></div>
    <div class="fg"><label for="ga_k">Distanza (km)</label><input type="number" inputmode="decimal" id="ga_k" step="0.1" value="${g.distKm||''}" placeholder="21.1"></div></div>
    <div class="fg"><label for="ga_o">Tempo obiettivo <small>ore:minuti:secondi</small></label><input type="text" id="ga_o" value="${g.objSec?Math.floor(g.objSec/3600)+':'+pad(Math.floor(g.objSec%3600/60))+':'+pad(Math.round(g.objSec%60)):''}" placeholder="1:40:00"></div>
    ${g.auto?'<p class="muted" style="margin-bottom:10px">Questa gara viene dal piano: per cambiarne la data usa Rigenera il piano.</p>':''}
    <div class="btn-row"><button class="btn btn-pri" onclick="salvaGara()">Salva</button><button class="btn btn-sec" onclick="chiudiSheet(1)">Annulla</button></div>
    ${g.id&&!g.auto?`<button class="btn btn-red w100" style="margin-top:8px" onclick="if(confirm('Eliminare la gara?')){S.gare=S.gare.filter(x=>String(x.id)!==String(S.garaId));salva();chiudiSheet(1);disegna();}">Elimina gara</button>`:''}`);
}
function salvaGara(){
  const nome=$('ga_n').value.trim();
  if(!nome){toast('Inserisci il nome','err');return;}
  const vecchia=S.gare.find(x=>String(x.id)===String(S.garaId));
  const g={...(vecchia||{}),id:S.garaId||('g'+Date.now()),nome,data:vecchia&&vecchia.auto?vecchia.data:$('ga_d').value,distKm:parseFloat($('ga_k').value)||'',objSec:passoSec($('ga_o').value)};
  if(vecchia) S.gare[S.gare.indexOf(vecchia)]=g; else S.gare.push(g);
  salva();chiudiSheet(1);disegna();toast('Gara salvata');
}
// le gare del piano (mezza/maratona) sono sincronizzate dal generatore: id fissi 'hm' e 'mar'
function sincGare(cfg){
  const Z=zone(cfg.pb), vecchie=Object.fromEntries(S.gare.map(g=>[g.id,g]));
  S.gare=S.gare.filter(g=>!g.auto&&g.id!==2&&g.id!==3&&!(g.id===1&&!g.data));   // via le automatiche e i segnaposto della v9 (mezza e maratona arrivano dal piano)
  if(cfg.half) S.gare.push({id:'hm',auto:true,nome:(vecchie.hm||{}).nome||'Mezza Maratona',data:cfg.half,distKm:21.1,objSec:(vecchie.hm||{}).objSec||Math.round(passoSec(Z.hm)*21.0975)});
  if(cfg.mara) S.gare.push({id:'mar',auto:true,nome:(vecchie.mar||{}).nome||'Maratona',data:cfg.mara,distKm:42.2,objSec:(vecchie.mar||{}).objSec||Math.round(passoSec(Z.mp)*42.195)});
}
function calcolaPasso(){
  const km=parseFloat($('ca_km').value)||0, sec=passoSec($('ca_t').value), out=$('ca_out');
  if(!km||!sec){out.innerHTML='<p class="muted">Scrivi il tempo come ore:minuti:secondi, ad esempio 1:40:00.</p>';return;}
  const p=sec/km, tappe=[];
  for(let k=5;k<km-0.5;k+=5) tappe.push(k);
  if(km>40) tappe.push(21.0975);
  tappe.sort((a,b)=>a-b).push(km);
  out.innerHTML=`<div class="kv" style="margin-top:0"><span>Passo</span><b>${secPasso(p)} /km</b>${tappe.map(k=>`<span>${k===km?'Arrivo':k===21.0975?'Mezza':'Km '+k}</span><b>${durata(p*k,true)}</b>`).join('')}</div>`;
}

// Attiva un piano (generato o importato): azzera lo stato delle sessioni e ricollega per data

function attivaPiano(cfg,pianoImportato){

  S.done={};S.skip={};S.over={};_dm=null;
  for(const l of [...S.logs].sort((a,b)=>a.data<b.data?-1:1)){

function importaPiano(inp){

    if(!Array.isArray(p)||!p.length||!p.every(w=>Array.isArray(w.sessions))){toast('Formato non valido: serve un elenco di settimane con sessions','err');return;}
    if(!confirm(`Importare il piano di ${p.length} settimane? Parte dal lunedì già impostato (${dataIt((S.cfg||cfgDefault()).start,{day:'numeric',month:'long'})}).`)) return;
    p.forEach((w,i)=>{w.w=i+1;w.phase=w.phase||'base';w.title=w.title||('Settimana '+(i+1));});

/* ── Google Sheet: invio allenamenti, backup e ripristino ──
   La richiesta parte come text/plain: è una "richiesta semplice", quindi il browser non fa il
   controllo CORS preliminare che Apps Script non sa gestire, e la risposta si può leggere.
   Così il collegamento è verificabile davvero (la v9 inviava alla cieca). */
const SCRIPT_GS=`// RunLog v10 — incolla in Estensioni > Apps Script del tuo Google Sheet
var COL=["ID","Data","Tipo","Km","Passo","Minuti","Sforzo","FC","Achille","Caviglia","Schiena","Scarpe","Note","Salvato"];
function out(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);}
function foglio(n){var ss=SpreadsheetApp.getActiveSpreadsheet();return ss.getSheetByName(n)||ss.insertSheet(n);}
function doGet(e){
  var a=(e&&e.parameter&&e.parameter.action)||"ping";
  if(a==="restore"){
    var b=foglio("Backup"),n=b.getLastRow()-1;
    if(n<1) return out({status:"empty"});
    var t=b.getRange(2,1,n,1).getValues().map(function(r){return String(r[0]).substring(1);}).join("");
    return out({status:"ok",saved:String(b.getRange(1,2).getValue()),backup:t});
  }
  return out({status:"ok",msg:"RunLog endpoint attivo",v:10});
}
function doPost(e){
  try{
    var d=JSON.parse(e.postData.contents);
    if(d.action==="test"){foglio("Backup").getRange(1,3).setValue("Test "+new Date());return out({status:"ok",msg:"scrittura ok"});}
    if(d.action==="backup"){
      var b=foglio("Backup");b.clearContents();
      b.getRange(1,1,1,2).setValues([["Backup RunLog (non modificare)",new Date()]]);
      var righe=[];
      for(var i=0;i<d.data.length;i+=40000) righe.push(["~"+d.data.substring(i,i+40000)]);
      b.getRange(2,1,righe.length,1).setNumberFormat("@").setValues(righe);
      return out({status:"ok",parti:righe.length});
    }
    var sh=foglio("Corse");
    if(sh.getLastRow()===0){sh.appendRow(COL);sh.getRange(1,1,1,COL.length).setFontWeight("bold");sh.setFrozenRows(1);}
    var id=d.action==="delete"?d.id:d.log[0],riga=0,n=sh.getLastRow()-1;
    if(n>0){var ids=sh.getRange(2,1,n,1).getValues();for(var j=0;j<ids.length;j++){if(String(ids[j][0])===String(id)){riga=j+2;break;}}}
    if(d.action==="delete"){if(riga) sh.deleteRow(riga);return out({status:"ok"});}
    if(riga) sh.getRange(riga,1,1,d.log.length).setValues([d.log]); else sh.appendRow(d.log);
    return out({status:"ok"});
  }catch(err){return out({status:"err",msg:String(err)});}
}`;
async function sheet(payload){
  const opt={method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'};
  let r;
  try{r=await fetch(S.sheetUrl,opt);}
  catch(e){
    if(!navigator.onLine) throw e;                                  // senza rete: resta in coda
    await fetch(S.sheetUrl,{...opt,mode:'no-cors'});                // piano B: alcuni browser bloccano la lettura → invio senza conferma
    return {status:'ok',cieco:true};
  }
  const t=await r.text();
  try{return JSON.parse(t);}catch(e){return {status:'err',msg:'Lo script ha risposto in modo inatteso: controlla il deployment (accesso "Chiunque")'};}
}
let _sync=false;
// Invia la coda (nuovi, modificati, eliminati) e poi aggiorna il backup sul foglio. Se manca la rete riprova al prossimo avvio.
async function sincronizza(manuale){
  if(!S.sheetUrl||_sync){if(manuale&&!S.sheetUrl) toast('Collega prima il Google Sheet','err');return;}
  _sync=true;
  const vuoto=x=>x==null?'':String(x).replace(/^([=+\-@])/," $1");   // un testo che inizia con = diventerebbe una formula
  try{
    for(const id of [...S.pend]){
      const l=S.logs.find(x=>x.id===id), sc=l&&S.shoes.find(x=>x.id===l.scarpa);
      const res=l?await sheet({action:'log',log:[l.id,l.data,l.tipo,l.km||'',l.ritmo?l.ritmo+'/km':'',l.durata||'',l.rpe||'',l.fc||'',l.dolore_achille||0,l.dolore_caviglia||0,l.dolore_schiena||0,sc?vuoto(sc.nome):'',vuoto(l.note),new Date().toISOString()]})
                 :await sheet({action:'delete',id});
      if(!res||res.status!=='ok'){if(manuale) toast((res&&res.msg)||'Invio non riuscito','err');break;}
      S.pend=S.pend.filter(x=>x!==id);LS.s('rl_pend',S.pend);
    }
    if(!S.pend.length){await backupCloud(false);if(manuale) toast('Google Sheet aggiornato');}
  }catch(e){if(manuale) toast('Nessuna connessione: riprovo più tardi','err');}
  _sync=false;
  if(S.page==='oggi'||S.tab.altro==='imp') disegna();
}
async function testSheet(){

  const b=$('gs_test');b.textContent='Prova in corso…';b.disabled=true;
  try{
    const res=await sheet({action:'test'});

async function backupCloud(manuale){
  if(!S.sheetUrl){if(manuale) toast('Collega prima il Google Sheet','err');return;}

async function ripristinaCloud(){
  if(!S.sheetUrl){toast('Incolla prima l\'URL del Google Sheet','err');return;}
  try{
    const r=await fetch(S.sheetUrl+(S.sheetUrl.includes('?')?'&':'?')+'action=restore',{redirect:'follow'}), d=await r.json();

    if(d.status!=='ok'||!d.backup){toast('Ripristino non riuscito','err');return;}

// tutte le chiavi "rl_" così come sono: il backup resta valido anche quando si aggiungono dati nuovi
function backupJSON(){
  const k={};
  try{for(let i=0;i<localStorage.length;i++){const n=localStorage.key(i);if(n&&n.startsWith('rl_')&&n!=='rl_pre_v10') k[n]=localStorage.getItem(n);}}catch(e){}
  return JSON.stringify({app:'RunLog',version:VER,exportDate:new Date().toISOString(),keys:k});
}
function esportaBackup(){
  if(scarica(`runlog-backup-${oggiStr()}.json`,backupJSON(),'application/json')){LS.s('rl_lastbackup',Date.now());if(S.page) disegna();}
}
function importaBackup(inp){
  const file=inp.files&&inp.files[0];if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{try{applicaBackup(JSON.parse(rd.result),'del file');}catch(e){toast('File non valido','err');}};
  rd.readAsText(file);inp.value='';
}
// Accetta sia il formato v10 (chiavi "rl_") sia il backup della v9 (campi sciolti: in quel caso
// si tengono allenamenti, check ed esercizi e il piano va rigenerato).
function applicaBackup(d,origine){
  const v10=d&&d.keys&&typeof d.keys==='object', v9=d&&Array.isArray(d.logs);
  if(!v10&&!v9){toast('Non sembra un backup di RunLog','err');return;}
  const n=v10?(JSON.parse(d.keys.rl_logs||'[]')).length:d.logs.length;
  if(!confirm(`Ripristinare il backup ${origine} del ${(d.exportDate||'?').slice(0,10)} con ${n} allenamenti? Sostituisce i dati su questo dispositivo.`)) return;
  if(v10){
    Object.keys(localStorage).filter(k=>k.startsWith('rl_')).forEach(k=>localStorage.removeItem(k));
    for(const k in d.keys) localStorage.setItem(k,d.keys[k]);
  }else{
    LS.s('rl_logs',d.logs);LS.s('rl_morning',d.morning||{});LS.s('rl_rehab',d.rehab||{});
    if(d.reminders) LS.s('rl_rem',d.reminders);
    if(d.sheetUrl) LS.s('rl_sheet',d.sheetUrl);
    if(d.theme) LS.s('rl_theme',d.theme);
    ['rl_plan','rl_plancfg','rl_done','rl_skip','rl_overrides','rl_ver'].forEach(LS.x);
  }
  // I dati vengono riletti sul posto, senza ricaricare la pagina: una ricarica immediata dopo tante
  // scritture può, con i file locali, mostrare per un attimo un archivio vuoto.
  caricaStato();const daV9=preparaDati();tema();appunto();
  chiudiSheet(1);chiudiSheet(2);
  if(!S.cfg||!S.plan){disegna();primoAvvio(daV9);}
  else{$('primo').style.display='none';vai('oggi');}
  toast(`Backup ripristinato: ${S.logs.length} allenamenti`);
}

async function installa(){
  if(!_installa) return;
  const ev=_installa;_installa=null;
  try{ev.prompt();await ev.userChoice;}catch(e){}
  disegna();
}

// Promemoria esercizi: controlla ogni 30 secondi se è l'ora impostata e la sessione non è spuntata
const _remFatti={};
function controllaPromemoria(){
  if(!S.rem.on||!('Notification' in window)||Notification.permission!=='granted') return;
  const ora=new Date(), hm=pad(ora.getHours())+':'+pad(ora.getMinutes()), t=oggiStr(), r=S.rehab[t]||{};
  for(const [slot,msg] of [['am','Esercizi del mattino: calf raise lento e isometrico (5 minuti)'],['pm','Esercizi della sera: chiudi la giornata con il protocollo della fisio']]){
    if(hm!==S.rem[slot]||r[slot]||_remFatti[t+slot]) continue;
    _remFatti[t+slot]=true;
    try{new Notification('RunLog',{body:msg,tag:'runlog-'+slot});}catch(e){}
  }
}

// Sistema i dati appena letti (all'avvio e dopo un ripristino). Restituisce true se si arriva dalla v9.
function preparaDati(){
  /* allenamenti creati con le versioni precedenti: aggiunge id e secondi totali */
  let toccati=false;
  S.logs.forEach((l,i)=>{
    if(!l.id){l.id='l'+(l.ts||0)+'_'+i;toccati=true;}
    if(l.sec==null){l.sec=l.ritmo&&l.km?Math.round(passoSec(l.ritmo)*l.km):(+l.durata||0)*60;toccati=true;}
  });
  /* arrivo dalla v9: il vecchio piano e le sue spunte vengono messi da parte (rl_pre_v10), i dati restano */
  const daV9=!S.cfg&&(S.logs.length>0||LS.g('rl_start',null)!==null||LS.g('rl_onboarded',null)!==null);
  if(daV9&&LS.g('rl_pre_v10',null)===null){
    LS.s('rl_pre_v10',{start:LS.g('rl_start',null),done:S.done,skip:S.skip,over:S.over,customPlan:LS.g('rl_customplan',null)});
    S.done={};S.skip={};S.over={};LS.x('rl_customplan');toccati=true;
  }
  if(toccati) salva();
  return daV9;
}

(function avvio(){
  tema();
  /* 1. guardia: la scheda ricorda che c'erano dati, ma l'archivio risulta vuoto. Con i file locali il browser
        può consegnare un archivio vuoto se si ricarica subito dopo una scrittura; alla ricarica successiva
        i dati tornano. Qui NON si scrive nulla: due tentativi automatici, poi si chiede cosa fare. */
  const ap=(window.name||'').split('|');
  if(STORAGE_OK&&ap[0]==='runlog'&&ap[4]===QUI&&(+ap[1]>0||ap[2]==='1')&&!S.cfg&&!S.logs.length){
    const tentativi=+ap[3]||0;
    if(tentativi<2){
      window.name=['runlog',ap[1],ap[2],tentativi+1,QUI].join('|');
      setTimeout(()=>location.reload(),700);
    }
    $('primoIn').innerHTML=`<h1>RunLog</h1>
      <p class="txt" style="margin:14px 0 18px">${tentativi<2?'Carico i dati…':`Il browser non ha consegnato i dati salvati (${ap[1]} allenamenti poco fa). Di solito basta ricaricare: non è una perdita.`}</p>
      ${tentativi<2?'':`<button class="btn btn-pri w100" onclick="window.name=['runlog',${+ap[1]},${+ap[2]},0,QUI].join('|');location.reload()">Ricarica</button>
        <label class="btn btn-sec w100" style="margin-top:8px">Carica un backup<input type="file" accept=".json,application/json,text/plain" style="display:none" onchange="importaBackup(this)"></label>
        <button class="lnk" style="margin-top:14px" onclick="if(confirm('Iniziare da zero? Fallo solo se hai davvero cancellato i dati.')){window.name='';location.reload();}">I dati li ho cancellati io: inizia da zero</button>`}`;
    $('primo').style.display='block';
  }else{
    /* 2. dati delle versioni precedenti, primo disegno, eventuale primo avvio */
    const daV9=preparaDati();
    disegna();
    if(!S.cfg||!S.plan) primoAvvio(daV9);
    appunto();
  }

  /* 3. fogli: tocco fuori = chiudi */
  for(const n of [1,2]) $('ov'+n).addEventListener('click',e=>{if(e.target===e.currentTarget) chiudiSheet(n);});

  /* 4. promemoria, cambio giorno, sincronizzazione al rientro */
  setInterval(controllaPromemoria,30000);
  let giorno=oggiStr();
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden) return;
    if(giorno!==oggiStr()){giorno=oggiStr();S.editCheck=false;disegna();}   // app rimasta aperta dal giorno prima
    if(S.pend.length) sincronizza();
  });
  window.addEventListener('online',()=>{if(S.pend.length) sincronizza();});
  if(S.pend.length) sincronizza();
  if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>tema());

  /* 5. installazione: quando il browser segnala che l'app è installabile, compare il pulsante "Installa" */
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_installa=e;if(S.page==='oggi'||S.page==='altro') disegna();});
  window.addEventListener('appinstalled',()=>{_installa=null;toast('RunLog installata sulla schermata Home');disegna();});

  /* 6. online (https): app installabile, utilizzabile senza rete, dati protetti dalla pulizia automatica */
  if(location.protocol==='https:'||location.hostname==='localhost'){
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
    if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  }
})();
</script>
